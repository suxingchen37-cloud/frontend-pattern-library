<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>前端模式库</title>
<style>
:root{--bg:#f3f1e9;--paper:#fbfaf5;--ink:#20241e;--muted:#6b7860;--faint:#94a184;--line:#deded2;--red:#c2402a;--ease:cubic-bezier(.2,.75,.25,1);--serif:Songti SC,STSong,"Noto Serif CJK SC",SimSun,serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
[data-theme=night]{--bg:#121610;--paper:#191d18;--ink:#e8efe0;--muted:#a9b8a0;--faint:#7b8a72;--line:#2c3327}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.7 Inter,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
body{display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:8px 24px;background:var(--paper);border-bottom:1px solid var(--line);flex:0 0 auto}
header b{font-size:15px;font-weight:600;letter-spacing:-.03em}
header .sub{font-size:11px;color:var(--faint);border-left:1px solid var(--line);padding-left:12px}
header .grow{flex:1}
header button{font:inherit;font-size:13px;padding:4px 12px;border:1px solid var(--line);border-radius:6px;background:transparent;color:inherit;cursor:pointer}
header button:hover{border-color:var(--ink)}
nav{display:flex;gap:4px;padding:4px 24px;background:var(--paper);border-bottom:1px solid var(--line);flex:0 0 auto}
nav button{font:inherit;font-size:13px;padding:4px 12px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--muted);cursor:pointer}
nav button:hover{color:var(--ink);border-color:var(--ink)}
nav button[data-on]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
nav .sp{flex:1}
nav code{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--faint);align-self:center}
main{flex:1;min-height:0;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
#home{position:absolute;inset:0;overflow:auto;padding:64px 40px 96px}
.page{max-width:68em;margin:0 auto}
.mast{padding:0 0 40px}
.mast::before{content:"";display:block;width:40px;height:1px;background:var(--red);margin:0 0 24px}
h1{font-family:var(--serif);font-weight:400;font-size:96px;line-height:1.05;letter-spacing:-.03em;margin:0}
.dek{max-width:40em;margin:24px 0 0;font-size:15px;line-height:1.7;color:var(--muted)}
.rows{border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;grid-template-areas:"idx ttl num" "idx note note";gap:0 24px;width:100%;margin:0;padding:24px 0;border:0;border-top:1px solid var(--line);border-radius:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;transition:transform 180ms var(--ease),border-top-color 180ms linear}
.row:hover{transform:translateY(-1px);border-top-color:var(--ink)}
.row:focus-visible{outline:1px solid var(--ink);outline-offset:2px}
.idx{grid-area:idx;align-self:start;padding-top:8px;font-family:var(--mono);font-size:11px;line-height:1.6;letter-spacing:.08em;color:var(--faint)}
.ttl{grid-area:ttl;min-width:0;font-size:21px;line-height:1.6;font-weight:600}
.num{grid-area:num;align-self:start;font-family:var(--mono);font-size:34px;line-height:1.05;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--ink)}
.note{grid-area:note;max-width:46em;margin-top:8px;font-size:13px;line-height:1.7;color:var(--muted)}
.colophon{margin-top:24px}
.colophon p{max-width:46em;margin:0;font-size:13px;line-height:1.7;color:var(--muted)}
.colophon .sig{margin-top:8px;font-size:11px;color:var(--muted)}
@media(max-width:900px){
  h1{font-size:56px}
}
@media(max-width:639px){
  header{padding:8px 16px}
  header .sub{display:none}
  nav{padding:4px 16px;overflow-x:auto;flex-wrap:nowrap}
  nav button{flex:0 0 auto;white-space:nowrap}
  nav code{display:none}
  #home{padding:24px 16px 40px}
  .mast{padding:0 0 24px}
  .mast::before{margin:0 0 16px}
  h1{font-size:34px}
  .dek{margin:16px 0 0}
  .row{grid-template-columns:24px minmax(0,1fr) auto;gap:0 16px;padding:16px 0}
  .idx{padding-top:4px}
  .num{font-size:21px}
}
@media(prefers-reduced-motion:reduce){
  .row{transition:none}
  .row:hover{transform:none}
}
</style>
</head>
<body>
<header>
  <b>前端模式库</b>
  <span class="sub">通用前端参考：动效与交互 / 设计系统 / 内容呈现</span>
  <span class="grow"></span>
  <button id="themebtn">夜间</button>
</header>
<nav>
  <button data-tab="home" data-on>总览</button>
  <button data-tab="motion">动效与交互 244</button>
  <button data-tab="system">设计系统</button>
  <button data-tab="content">内容呈现</button>
  <button data-tab="site">整站实战</button>
  <button data-tab="depth">纵深示范</button>
  <button data-tab="landing">产品站</button>
  <button data-tab="dashboard">工作台</button>
  <span class="sp"></span>
  <code>统一配色，明暗两套</code>
</nav>
<main>
  <div id="home">
    <article class="page">
      <div class="mast">
        <h1>前端模式库</h1>
        <p class="dek">三个资料库共用一套设计语言；再加一个整站实战，用来检验把它们拼成一个真站点是什么效果。</p>
      </div>
      <div class="rows">
        <button class="row" data-tab="motion">
          <span class="idx">01</span>
          <span class="ttl">动效与交互实验室</span>
          <span class="num">206</span>
          <span class="note">点「选中」把想要的挑出来；从入场、加载到滚动驱动与 3D 透视，全在同一页。</span>
        </button>
        <button class="row" data-tab="depth">
          <span class="idx">05</span>
          <span class="ttl">纵深示范：格点</span>
          <span class="num">7</span>
          <span class="note">把分层视差、滚动立起、等距图层、立体图表、标签球、悬浮影子拼成一页，看纵深真的用在站点里是什么样。</span>
        </button>
        <button class="row" data-tab="landing">
          <span class="idx">06</span>
          <span class="ttl">产品落地页：场记 SLATE</span>
          <span class="num">12</span>
          <span class="note">一整套卖点与价格：首屏打板卡、三件能力、现场流程、两档价格、四个问题。纯静态、无表单提交。</span>
        </button>
        <button class="row" data-tab="dashboard">
          <span class="idx">07</span>
          <span class="ttl">数据工作台：拍摄日报</span>
          <span class="num">6</span>
          <span class="note">侧栏、指标、柱状图、可筛选可排序的场次表、详情抽屉、空筛选态。数据写在前端，不接接口。</span>
        </button>
        <button class="row" data-tab="system">
          <span class="idx">02</span>
          <span class="ttl">设计系统</span>
          <span class="num">50</span>
          <span class="note">组件与状态的活体图鉴：示例、规则、反例并排；图标可复制，颜色令牌与七档字阶也在。</span>
        </button>
        <button class="row" data-tab="content">
          <span class="idx">03</span>
          <span class="ttl">内容呈现</span>
          <span class="num">50</span>
          <span class="note">文本、数据、媒体、引用、长文、代码各来几样；点缩略图看大图。</span>
        </button>
        <button class="row" data-tab="site">
          <span class="idx">04</span>
          <span class="ttl">整站实战：缓坡</span>
          <span class="num">4</span>
          <span class="note">虚构刊物《缓坡》的四页：编辑版式、长文阅读、筛选、表单，明暗主题都真能用。</span>
        </button>
      </div>
      <footer class="colophon">
        <p>244 个可交互效果、26 个分类：入场、加载、微交互、光标、滚动、过渡、拖拽、布局、数据、图表、反馈、排印、无障碍、表单、导航、浮层、列表、手势、内容、长文、表格、状态页、媒体、SVG 与路径、3D 与透视、滚动驱动。</p>
        <p class="sig">每一条都能点、能复制；挑中的可以拿去任何项目用。右上角可在纸色与夜间之间切换。
          给 AI 的对照页：<a href="ai-tells.html">AI 默认写法与本库的改法</a>。</p>
      </footer>
    </article>
  </div>
  <iframe id="frame" hidden></iframe>
</main>
<script>
const frame = document.getElementById('frame');
const home = document.getElementById('home');
const SRC = { motion: 'motion-lab.html', system: 'design-system.html#design', content: 'design-system.html#content', site: 'site/index.html', depth: 'depth.html', landing: 'landing.html', dashboard: 'dashboard.html' };
function themeNow() { return document.documentElement.getAttribute('data-theme') === 'night' ? 'night' : 'paper'; }
function go(tab, demo) {
  document.querySelectorAll('nav button[data-tab]').forEach(b => b.toggleAttribute('data-on', b.dataset.tab === tab));
  localStorage.setItem('site.tab', tab);
  if (tab === 'home') { frame.hidden = true; frame.src = 'about:blank'; home.hidden = false; return; }
  home.hidden = true; frame.hidden = false;
  const [base, hash] = SRC[tab].split('#');
  let src = base + '?t=' + Date.now() + '&theme=' + themeNow();
  if (demo && tab === 'motion') src += '&demo=' + encodeURIComponent(demo);
  frame.src = src + (hash ? '#' + hash : '');
}
document.querySelectorAll('[data-tab]').forEach(el => el.addEventListener('click', () => go(el.dataset.tab)));
const boot = new URLSearchParams(location.search);
if (boot.get('theme') === 'night') document.documentElement.setAttribute('data-theme', 'night');
else if (localStorage.getItem('site.theme') === 'night') document.documentElement.setAttribute('data-theme', 'night');
document.getElementById('themebtn').textContent = themeNow() === 'night' ? '纸色' : '夜间';
const bootDemo = boot.get('demo');
const bootTab = boot.get('tab') || (bootDemo ? 'motion' : localStorage.getItem('site.tab'));
if (bootTab && (bootTab === 'home' || SRC[bootTab])) go(bootTab, bootDemo);
document.getElementById('themebtn').addEventListener('click', e => {
  const night = themeNow() !== 'night';
  document.documentElement.setAttribute('data-theme', night ? 'night' : 'paper');
  e.target.textContent = night ? '纸色' : '夜间';
  localStorage.setItem('site.theme', night ? 'night' : 'paper');
  try { frame.contentWindow?.postMessage({ type: 'site-theme', value: night ? 'night' : 'paper' }, '*'); } catch { }
});
window.addEventListener('message', e => {
  if (!e.data || e.data.type !== 'site-theme') return;
  if (frame.hidden || e.source !== frame.contentWindow) return;
  const night = e.data.value === 'night';
  document.documentElement.setAttribute('data-theme', night ? 'night' : 'paper');
  localStorage.setItem('site.theme', night ? 'night' : 'paper');
  document.getElementById('themebtn').textContent = night ? '纸色' : '夜间';
});
</script>
</body>
</html>
