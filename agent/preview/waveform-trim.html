<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>波形选区 · waveform-trim · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px solid var(--line);
  --border-strong:1px solid var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-wt{position:relative;width:100%;max-width:340px;height:170px;padding:20px 16px;border:1px solid var(--line);border-radius:10px;background:var(--paper);overflow:hidden}
.d-wt-wave{display:flex;align-items:center;gap:1px;height:100%;opacity:.35;pointer-events:none}
.d-wt-wave i{flex:1;background:var(--ink);border-radius:2px}
.d-wt-sel{position:absolute;left:calc(var(--a) + 16px);width:calc(var(--b) - var(--a));top:20px;bottom:36px;border:1px solid var(--ink);border-radius:2px;background:color-mix(in srgb,var(--marker-hi) 18%,transparent);cursor:grab;touch-action:none}
.d-wt-h{position:absolute;top:0;bottom:0;width:8px;background:var(--ink);cursor:ew-resize;border-radius:2px}
.d-wt-hl{left:-8px}
.d-wt-hr{right:-8px}
.d-wt-sel b{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--font-mono);font-size:10px;color:var(--ink);background:var(--paper);padding:1px 4px;border-radius:2px}
.d-wt-note{position:absolute;left:16px;bottom:10px;margin:0;font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;color:var(--faint)}
</style>
</head>
<body>
<div class="pv-bar">
  <code>waveform-trim</code>
  <b>波形选区</b>
  <span>waveform trim</span>
  <span>分类 媒体</span>
  <span>运动 机械</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<div class="d-wt" data-box><div class="d-wt-wave" data-wave></div><div class="d-wt-sel" data-sel style="--a:14%;--b:62%"><i class="d-wt-h d-wt-hl" data-hl></i><i class="d-wt-h d-wt-hr" data-hr></i><b data-len>2.4s</b></div><p class="d-wt-note">拖两端改范围 · 拖中间平移</p></div>
</div>
<p class="pv-note">波形上的选区两端各有一个把手，拖动改边界、拖中间整体平移。选区外压暗到 35%，不是只画框：压暗才看得出「这段不要」。选区时长实时写在中间，剪辑时最先看的就是这个数字。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "waveform-trim";
  window.INITS = window.INITS || {};
  window.INITS["waveform-trim"] = (root => {
  var box = root.querySelector('[data-box]');
  var wave = root.querySelector('[data-wave]');
  var sel = root.querySelector('[data-sel]');
  var len = root.querySelector('[data-len]');
  if (!box || !wave || !sel) return;
  var i = 0;
  while (i < 48) { var b = document.createElement('i'); b.style.height = (12 + Math.abs(Math.sin(i * 1.7)) * 70).toFixed(0) + '%'; wave.appendChild(b); i++; }
  var a = .14, b = .62, drag = null, startX = 0, a0 = 0, b0 = 0;
  var dur = 6.2;
  var paint = function () {
    sel.style.setProperty('--a', (a * 100).toFixed(2) + '%');
    sel.style.setProperty('--b', (b * 100).toFixed(2) + '%');
    if (len) len.textContent = ((b - a) * dur).toFixed(1) + 's';
  };
  var down = function (mode) { return function (e) { drag = mode; startX = e.clientX; a0 = a; b0 = b; sel.setPointerCapture(e.pointerId); e.stopPropagation(); }; };
  sel.addEventListener('pointerdown', down('move'));
  sel.querySelector('[data-hl]').addEventListener('pointerdown', down('l'));
  sel.querySelector('[data-hr]').addEventListener('pointerdown', down('r'));
  sel.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var d = (e.clientX - startX) / box.clientWidth;
    if (drag === 'l') a = Math.max(0, Math.min(b - .08, a0 + d));
    else if (drag === 'r') b = Math.min(1, Math.max(a + .08, b0 + d));
    else { var w = b0 - a0; var na = Math.max(0, Math.min(1 - w, a0 + d)); a = na; b = na + w; }
    paint();
  });
  var end = function () { drag = null; };
  sel.addEventListener('pointerup', end);
  sel.addEventListener('pointercancel', end);
  paint();
});
  window.INITS["waveform-trim"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
