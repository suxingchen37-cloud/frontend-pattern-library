<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>过度滚动回弹 · overscroll-bounce · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px var(--line);
  --border-strong:1px var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-over{position:relative;width:300px;height:150px;color:var(--ink)}
.d-over-view{position:absolute;left:14px;top:12px;width:220px;height:112px;overflow:hidden;border:1px solid var(--line);border-radius:6px;background:var(--paper);cursor:grab;touch-action:none;user-select:none}
.d-over-view[data-end="t"]{border-top-color:var(--ink)}
.d-over-view[data-end="b"]{border-bottom-color:var(--ink)}
.d-over-view:focus-visible{outline:1px solid var(--ink);outline-offset:2px}
.d-over-view[data-drag]{cursor:grabbing}
.d-over-list{will-change:transform}
.d-over-row{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-bottom:1px solid var(--line)}
.d-over-row b{font-family:var(--mono);font-size:9px;font-weight:400;letter-spacing:.08em;color:var(--faint)}
.d-over-row span{font-size:11px}
.d-over-bar{position:absolute;left:246px;top:12px;width:1px;height:112px;background:var(--line)}
.d-over-thumb{position:absolute;left:0;top:0;width:1px;background:var(--ink)}
.d-over-hint{position:absolute;left:14px;bottom:8px;margin:0;font-family:var(--mono);font-size:9px;line-height:1.6;color:var(--faint)}
</style>
</head>
<body>
<div class="pv-bar">
  <code>overscroll-bounce</code>
  <b>过度滚动回弹</b>
  <span>overscroll bounce</span>
  <span>分类 手势</span>
  <span>运动 物理</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<div class="d-over" role="group" aria-label="过度滚动回弹">
  <div class="d-over-view" tabindex="0" role="group" aria-label="滚动列表，到端点再拖会拉伸，方向键也行">
    <div class="d-over-list">
      <div class="d-over-row"><b>01</b><span>校对</span></div>
      <div class="d-over-row"><b>02</b><span>付印</span></div>
      <div class="d-over-row"><b>03</b><span>折页</span></div>
      <div class="d-over-row"><b>04</b><span>装订</span></div>
      <div class="d-over-row"><b>05</b><span>裁切</span></div>
      <div class="d-over-row"><b>06</b><span>签样</span></div>
    </div>
  </div>
  <div class="d-over-bar" aria-hidden="true"><i class="d-over-thumb"></i></div>
  <p class="d-over-hint">端点后每 1px 折成 0.3px</p>
</div>
</div>
<p class="pv-note">端点后的位移按 0.3 折算，并且封顶 40px：折算到 0.5 像列表从手里滑走，到 0.15 又几乎看不出被拉住；40px 是 116px 视窗里还能看见最后一行、又明显变形的临界，超过就只剩一条空白。回弹给 280ms 而不是 180ms，因为 180ms 会有一声「啪」的惊吓感，橡皮筋要慢一点才像有弹性。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "overscroll-bounce";
  window.INITS = window.INITS || {};
  window.INITS["overscroll-bounce"] = (root => {
  const box = root.querySelector('.d-over');
  if (!box || box.dataset.ready) return;
  box.dataset.ready = '1';
  const view = box.querySelector('.d-over-view');
  const list = box.querySelector('.d-over-list');
  const thumb = box.querySelector('.d-over-thumb');
  const hint = box.querySelector('.d-over-hint');
  const IDLE = '端点后每 1px 折成 0.3px';
  const LIMIT = 40;
  let max = 0, scroll = 0, stretch = 0, thumbH = 16, drag = null, settleT = 0;

  function measure() {
    max = Math.max(0, list.offsetHeight - view.clientHeight);
    const h = view.clientHeight;
    thumbH = Math.max(16, h * (h / Math.max(list.offsetHeight, 1)));
    thumb.style.height = thumbH.toFixed(1) + 'px';
  }
  function apply(raw, animate) {
    let s = raw, ex = 0;
    if (raw < 0) { s = 0; ex = raw * .3; }
    else if (raw > max) { s = max; ex = (raw - max) * .3; }
    ex = Math.max(-LIMIT, Math.min(LIMIT, ex));
    scroll = s; stretch = ex;
    list.style.transition = animate ? 'transform .28s cubic-bezier(.34,1.56,.64,1)' : 'none';
    list.style.transform = 'translateY(' + (-s - ex).toFixed(2) + 'px)';
    const top = max ? (s / max) * (view.clientHeight - thumbH) : 0;
    thumb.style.transform = 'translateY(' + top.toFixed(1) + 'px)';
    if (ex !== 0) {
      view.dataset.end = raw < 0 ? 't' : 'b';
      hint.textContent = '端点 · 拉伸 ' + Math.round(Math.abs(ex)) + 'px';
    } else {
      delete view.dataset.end;
      hint.textContent = IDLE;
    }
  }
  function down(e) {
    if (drag) return;
    e.preventDefault();
    view.focus({ preventScroll: true });
    view.setPointerCapture(e.pointerId);
    list.style.transition = 'none';
    view.dataset.drag = '1';
    drag = { y0: e.clientY, s0: scroll };
  }
  function move(e) {
    if (!drag) return;
    apply(drag.s0 - (e.clientY - drag.y0), false);
  }
  function up() {
    if (!drag) return;
    drag = null;
    delete view.dataset.drag;
    apply(scroll, true);
  }
  function wheel(e) {
    e.preventDefault();
    list.style.transition = 'none';
    apply(scroll + e.deltaY, false);
    clearTimeout(settleT);
    settleT = setTimeout(() => apply(scroll, true), 180);
  }
  function key(e) {
    const d = e.key === 'ArrowDown' ? 28 : e.key === 'ArrowUp' ? -28 : 0;
    if (!d) return;
    e.preventDefault();
    const atEnd = (d > 0 && scroll >= max) || (d < 0 && scroll <= 0);
    apply(atEnd ? scroll + d * 2 : scroll + d, true);
    if (atEnd) {
      clearTimeout(settleT);
      settleT = setTimeout(() => apply(scroll, true), 280);
    }
  }

  view.addEventListener('wheel', wheel, { passive: false });
  view.addEventListener('pointerdown', down);
  view.addEventListener('pointermove', move);
  view.addEventListener('pointerup', up);
  view.addEventListener('pointercancel', up);
  view.addEventListener('keydown', key);
  measure();
  apply(0, false);
});
  window.INITS["overscroll-bounce"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
