<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>斜率图 · slope-chart · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px solid var(--line);
  --border-strong:1px solid var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-sl{width:100%;max-width:340px}
.d-sl-svg{display:block;width:100%;height:auto;overflow:visible}
.d-sl-line{stroke-width:1.5;stroke-linecap:round}
.d-sl-up{stroke:var(--ink)}
.d-sl-down{stroke:var(--ink-vermilion)}
.d-sl-dot{fill:var(--paper);stroke-width:1.5}
.d-sl-up.d-sl-dot{stroke:var(--ink)}
.d-sl-down.d-sl-dot{stroke:var(--ink-vermilion)}
.d-sl-name{fill:var(--ink);font-size:8px}
.d-sl-val{fill:var(--faint);font-family:var(--font-mono);font-size:7px}
.d-sl-note{margin:6px 0 0;font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;color:var(--faint)}
</style>
</head>
<body>
<div class="pv-bar">
  <code>slope-chart</code>
  <b>斜率图</b>
  <span>slope chart</span>
  <span>分类 图表</span>
  <span>运动 无动效</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<div class="d-sl"><svg class="d-sl-svg" viewBox="0 0 320 180" role="img" aria-label="去年与今年的排名变化斜率图"></svg><p class="d-sl-note">去年 → 今年 · 交叉的是反超</p></div>
</div>
<p class="pv-note">只看两个时间点之间的变化，不画中间过程：斜率图回答的是「谁上去了、谁掉下来了」，不是「怎么变的」。交叉的线最显眼，所以顺序按终点排、不按起点排，一眼就能看出谁反超。两条线就够了，三条以上开始乱；真要三组，换成分组柱。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "slope-chart";
  window.INITS = window.INITS || {};
  window.INITS["slope-chart"] = (root => {
  const svg = root.querySelector('.d-sl-svg');
  if (!svg) return;
  const rows = [['响应', 62, 74], ['稳定', 71, 68], ['成本', 44, 58], ['覆盖', 80, 76], ['维护', 55, 61]];
  const W = 320, H = 180, LX = 96, RX = 236;
  const vals = rows.flatMap(r => [r[1], r[2]]);
  const min = Math.min.apply(null, vals) - 6, max = Math.max.apply(null, vals) + 6;
  const y = v => 26 + (H - 52) * (1 - (v - min) / (max - min));
  const NS = 'http://www.w3.org/2000/svg';
  const mk = (tag, attrs) => { const el = document.createElementNS(NS, tag); for (const k in attrs) el.setAttribute(k, attrs[k]); return el; };
  svg.appendChild(mk('line', { class: 'd-sl-axis', x1: LX, y1: 20, x2: LX, y2: H - 20, stroke: 'var(--line)' }));
  svg.appendChild(mk('line', { class: 'd-sl-axis', x1: RX, y1: 20, x2: RX, y2: H - 20, stroke: 'var(--line)' }));
  ['去年', '今年'].forEach((t, i) => { const el = mk('text', { class: 'd-sl-label', x: i ? RX : LX, y: 14, 'text-anchor': 'middle' }); el.textContent = t; svg.appendChild(el); });
  rows.forEach(r => {
    const [name, a, b] = r;
    const up = b >= a;
    const cls = up ? 'd-sl-up' : 'd-sl-down';
    svg.appendChild(mk('line', { class: 'd-sl-line ' + cls, x1: LX + 4, y1: y(a).toFixed(1), x2: RX - 4, y2: y(b).toFixed(1) }));
    [[LX, a], [RX, b]].forEach(p => {
      svg.appendChild(mk('circle', { class: 'd-sl-dot ' + cls, cx: p[0], cy: y(p[1]).toFixed(1), r: 3 }));
    });
    const l = mk('text', { class: 'd-sl-name', x: LX - 10, y: y(a) + 3, 'text-anchor': 'end' });
    l.textContent = name; svg.appendChild(l);
    const v = mk('text', { class: 'd-sl-val', x: RX + 8, y: y(b) + 3 });
    v.textContent = String(b); svg.appendChild(v);
  });
});
  window.INITS["slope-chart"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
