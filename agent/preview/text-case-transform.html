<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文本大小写与空白转换 · text-case-transform · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px solid var(--line);
  --border-strong:1px solid var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-text-case-transform{width:100%;max-width:430px;min-width:0;color:var(--ink);font:inherit;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.d-text-case-transform *,.d-text-case-transform *::before,.d-text-case-transform *::after{box-sizing:border-box}
.d-text-case-transform [hidden]{display:none!important}
.d-text-case-transform .d-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0}
.d-text-case-transform .d-note{display:block;margin:8px 0 0;color:var(--muted);font-size:12px;min-height:1.5em}
.d-text-case-transform label{display:block;margin:8px 0}
.d-text-case-transform input,.d-text-case-transform select,.d-text-case-transform textarea,.d-text-case-transform button{font:inherit;color:inherit;max-width:100%;min-width:0}
.d-text-case-transform input:not([type=checkbox]):not([type=radio]),.d-text-case-transform select,.d-text-case-transform textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:var(--radius-control);background:var(--paper)}
.d-text-case-transform button{padding:6px 10px;border:1px solid var(--line);border-radius:var(--radius-control);background:var(--paper);cursor:pointer}
.d-text-case-transform button:disabled{opacity:.5;cursor:default}
.d-text-case-transform :focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.d-text-case-transform [aria-invalid=true]{border-color:var(--warn)!important}
.d-text-case-transform .d-scroll{max-width:100%;overflow:auto}
.d-text-case-transform table{width:100%;border-collapse:collapse;font-size:12px;text-align:left}
.d-text-case-transform th,.d-text-case-transform td{padding:7px;border-bottom:1px solid var(--line);vertical-align:top}
.d-text-case-transform caption{text-align:left;font-weight:600;margin-bottom:8px}
.d-text-case-transform progress{width:100%;accent-color:var(--ink)}
.d-text-case-transform pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}
.d-text-case-transform h3,.d-text-case-transform p{margin:8px 0}
.d-text-case-transform [aria-pressed=true],.d-text-case-transform [aria-selected=true]{border-color:var(--ink);font-weight:650}
.d-text-case-transform .d-grow{flex:1;min-width:100px}
.d-text-case-transform summary{cursor:pointer;padding:6px 0}
.d-text-case-transform ul,.d-text-case-transform ol{padding-left:24px}
</style>
</head>
<body>
<div class="pv-bar">
  <code>text-case-transform</code>
  <b>文本大小写与空白转换</b>
  <span>text case transform</span>
  <span>分类 内容</span>
  <span>运动 无动效</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<section class="d-text-case-transform" aria-label="文本大小写与空白转换"><label>原始文本<textarea data-input rows="3">  Scene ONE   Door  </textarea></label><label>转换方式<select data-mode><option value="lower">全部小写</option><option value="upper">全部大写</option><option value="spaces">折叠空白</option></select></label><button type="button" data-convert>生成结果</button><label>转换结果<textarea data-result rows="3"></textarea></label><output class="d-note" data-out role="status" aria-live="polite"></output></section>
</div>
<p class="pv-note">转换结果单独展示，原文保留；折叠空白和大小写模式分别选择，支持空输入。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "text-case-transform";
  window.INITS = window.INITS || {};
  window.INITS["text-case-transform"] = (root => {
 const q = selector => root.querySelector(selector);
 const qa = selector => [...root.querySelectorAll(selector)];
 const say = text => { const out = q('[data-out]'); if (out) out.textContent = text; };
 ((root,q,qa,say)=>{q('[data-result]').readOnly=true;q('[data-convert]').onclick=()=>{const text=q('[data-input]').value,mode=q('[data-mode]').value;q('[data-result]').value=mode==='upper'?text.toLocaleUpperCase():mode==='lower'?text.toLocaleLowerCase():text.trim().replace(/\s+/g,' ');say(text?'转换完成，原文保留':'原文为空，结果已清空');};})(root, q, qa, say);
});
  window.INITS["text-case-transform"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
