<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>指针当光源 · pointer-light · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px var(--line);
  --border-strong:1px var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-lt-stage{--lx:50%;--ly:0%;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;width:100%;max-width:340px;height:180px;border:1px solid var(--line);border-radius:10px;background:var(--bg);overflow:hidden}
.d-lt-card{position:relative;width:220px;padding:16px 16px 18px;border:1px solid var(--line);border-radius:10px;background:var(--paper);overflow:hidden;box-shadow:0 1px 0 var(--line)}
.d-lt-card:before{content:"";position:absolute;left:0;top:0;width:100%;height:100%;background:radial-gradient(120px 120px at var(--lx,50%) var(--ly,0%),color-mix(in srgb,var(--marker-hi) 55%,transparent),transparent 62%);opacity:0;transition:opacity 220ms var(--ease-print);pointer-events:none}
.d-lt-card:after{content:"";position:absolute;left:0;top:0;width:100%;height:100%;background:radial-gradient(60px 60px at var(--lx,50%) var(--ly,0%),color-mix(in srgb,var(--paper) 80%,transparent),transparent 70%);opacity:0;transition:opacity 220ms var(--ease-print);pointer-events:none}
.d-lt-stage.d-lt-on .d-lt-card:before{opacity:.18}
.d-lt-stage.d-lt-on .d-lt-card:after{opacity:.5}
.d-lt-k{display:block;font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;color:var(--faint)}
.d-lt-card b{display:block;margin-top:2px;font-size:17px;font-weight:650;letter-spacing:-.01em}
.d-lt-meta{display:block;margin-top:2px;font-size:11px;color:var(--muted)}
.d-lt-note{position:absolute;bottom:8px;margin:0;font-size:10px;color:var(--faint)}
@media (prefers-reduced-motion:reduce){.d-lt-card:before,.d-lt-card:after{transition:none}}
</style>
</head>
<body>
<div class="pv-bar">
  <code>pointer-light</code>
  <b>指针当光源</b>
  <span>pointer light</span>
  <span>分类 3D 与透视</span>
  <span>运动 物理</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<div class="d-lt-stage" tabindex="0" aria-label="指针移到卡面上，高光会跟着走"><div class="d-lt-card"><span class="d-lt-k">LIGHT</span><b>材质在动</b><span class="d-lt-meta">高光跟着指针，不是装饰</span></div><p class="d-lt-note">移一下指针</p></div>
</div>
<p class="pv-note">光是跟着指针走的一个圆形渐变，中心亮度只到 18%：再亮就盖住了卡面文字，读者先看见光斑再看见内容。光斑用两层——紧的一层是灯，散的一层是反射；只做一层会像一块脏印子。指针离开立刻灭，因为光源跟着人走了，不是留在原地。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "pointer-light";
  window.INITS = window.INITS || {};
  window.INITS["pointer-light"] = (root => {
  const stage = root.querySelector('.d-lt-stage');
  const card = stage && stage.querySelector('.d-lt-card');
  if (!stage || !card) return;
  stage.addEventListener('pointermove', e => {
    const r = card.getBoundingClientRect();
    const x = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    const y = Math.max(0, Math.min(1, (e.clientY - r.top) / r.height));
    card.style.setProperty('--lx', (x * 100).toFixed(1) + '%');
    card.style.setProperty('--ly', (y * 100).toFixed(1) + '%');
    stage.classList.add('d-lt-on');
  });
  stage.addEventListener('pointerleave', () => stage.classList.remove('d-lt-on'));
});
  window.INITS["pointer-light"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
