<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>图形裁剪揭示 · svg-clip-reveal · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px var(--line);
  --border-strong:1px var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-cr{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.d-cr-art{display:block;width:220px;height:120px;cursor:pointer}
.d-cr-block{fill:#2b4b8f}
.d-cr-ring{fill:none;stroke:var(--ink);stroke-width:1}
.d-cr-rule{stroke:var(--line);stroke-width:1}
.d-cr-cut{transform-box:fill-box;transform-origin:100% 100%;transform:scale(1)}
.d-cr.is-open .d-cr-cut{animation:d-svg-clip-reveal-open 900ms cubic-bezier(.2,.75,.25,1) both}
@keyframes d-svg-clip-reveal-open{from{transform:scale(0)}to{transform:scale(1)}}
.d-cr-btn{font-family:var(--font-mono);font-size:var(--fs-11);letter-spacing:var(--tracking-mono-label);padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--muted);cursor:pointer}
.d-cr-btn:hover{border-color:var(--ink);color:var(--ink)}
.d-cr-btn:focus-visible{outline:1px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<div class="pv-bar">
  <code>svg-clip-reveal</code>
  <b>图形裁剪揭示</b>
  <span>svg clip reveal</span>
  <span>分类 SVG 与路径</span>
  <span>运动 印刷</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<div class="d-cr"><svg class="d-cr-art" viewBox="0 0 220 120" aria-hidden="true"><defs><clipPath id="d-svg-clip-reveal-win" clipPathUnits="userSpaceOnUse"><rect class="d-cr-cut" x="0" y="0" width="220" height="120"/></clipPath></defs><g clip-path="url(#d-svg-clip-reveal-win)"><rect class="d-cr-block" x="20" y="20" width="180" height="80" rx="6"/><circle class="d-cr-ring" cx="186" cy="34" r="26"/><path class="d-cr-rule" d="M20 100H200"/></g></svg><button class="d-cr-btn" type="button">再揭示</button></div>
</div>
<p class="pv-note">clipPath 里的 rect 必须设 transform-box:fill-box，否则 transform-origin 按 SVG 用户坐标算，揭示会从画布左上角漏出来，而不是从你点的那个角长出来。点哪儿就从哪个角开始——这是人翻纸样时的习惯。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "svg-clip-reveal";
  window.INITS = window.INITS || {};
  window.INITS["svg-clip-reveal"] = (root => {
    const box = root.querySelector('.d-cr'), art = box.querySelector('.d-cr-art'), cut = box.querySelector('.d-cr-cut'), btn = box.querySelector('.d-cr-btn');
    let corner = '100% 100%';
    const open = () => {
      cut.style.transformOrigin = corner;
      box.classList.remove('is-open');
      void art.getBoundingClientRect();
      box.classList.add('is-open');
    };
    art.onclick = e => {
      const r = art.getBoundingClientRect();
      corner = ((e.clientX - r.left) / r.width > .5 ? '100% ' : '0% ') + ((e.clientY - r.top) / r.height > .5 ? '100%' : '0%');
      open();
    };
    btn.onclick = open;
    open();
  });
  window.INITS["svg-clip-reveal"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
