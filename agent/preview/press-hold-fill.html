<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>按住确认 · press-hold-fill · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px solid var(--line);
  --border-strong:1px solid var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-ph{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:340px}
.d-ph-btn{position:relative;display:grid;place-items:center;width:132px;height:132px;border:0;background:none;font:inherit;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent}
.d-ph-btn svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.d-ph-track{fill:none;stroke:var(--line);stroke-width:3}
.d-ph-fill{fill:none;stroke:var(--ink-vermilion);stroke-width:3;stroke-linecap:round;stroke-dasharray:0 999;transition:stroke-dasharray 60ms linear}
.d-ph-btn span{font-size:12px;max-width:80px;text-align:center}
.d-ph-note{margin:0;font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;color:var(--faint)}
.d-ph-btn:focus-visible{outline:1px solid var(--ink);outline-offset:4px}
</style>
</head>
<body>
<div class="pv-bar">
  <code>press-hold-fill</code>
  <b>按住确认</b>
  <span>press and hold</span>
  <span>分类 手势</span>
  <span>运动 物理</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<div class="d-ph"><button type="button" class="d-ph-btn" data-hold><svg viewBox="0 0 64 64" aria-hidden="true"><circle class="d-ph-track" cx="32" cy="32" r="28"></circle><circle class="d-ph-fill" cx="32" cy="32" r="28"></circle></svg><span>按住 0.9 秒清空</span></button><p class="d-ph-note" data-note>松手即取消</p></div>
</div>
<p class="pv-note">长按 900ms 填满才生效：短到 500ms 会误触，长到 1.5 秒手会酸。填充用环而不是进度条，因为手指正压着按钮中间，环形能在不移动视线的前提下被余光看到。中途松手立刻退回，没有半途生效这回事。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "press-hold-fill";
  window.INITS = window.INITS || {};
  window.INITS["press-hold-fill"] = (root => {
  var btn = root.querySelector('[data-hold]');
  var ring = btn && btn.querySelector('.d-ph-fill');
  var note = root.querySelector('[data-note]');
  if (!btn || !ring) return;
  var C = 2 * Math.PI * 28, raf = 0, t0 = 0, done = false;
  var stop = function () { cancelAnimationFrame(raf); ring.style.strokeDasharray = '0 ' + C; };
  var tick = function () {
    var p = Math.min(1, (performance.now() - t0) / 900);
    ring.style.strokeDasharray = (C * p).toFixed(1) + ' ' + C;
    if (p >= 1) { done = true; if (note) note.textContent = '已清空 · 再按住可撤销'; btn.querySelector('span').textContent = '已清空'; return; }
    raf = requestAnimationFrame(tick);
  };
  btn.addEventListener('pointerdown', function (e) { e.preventDefault(); if (done) return; t0 = performance.now(); if (note) note.textContent = '继续按住…'; btn.setPointerCapture(e.pointerId); cancelAnimationFrame(raf); raf = requestAnimationFrame(tick); });
  btn.addEventListener('pointerup', function () { if (done) { done = false; btn.querySelector('span').textContent = '按住 0.9 秒清空'; if (note) note.textContent = '松手即取消'; } stop(); });
  btn.addEventListener('pointercancel', stop);
});
  window.INITS["press-hold-fill"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
