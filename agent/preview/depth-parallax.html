<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>分层视差 · depth-parallax · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px solid var(--line);
  --border-strong:1px solid var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-dp{box-sizing:border-box;width:300px;max-width:100%;height:150px;border:1px solid var(--line);border-radius:10px;background:var(--bg);perspective:560px;overflow:hidden}
.d-dp-scene{position:relative;width:100%;height:100%;transform-style:preserve-3d;will-change:transform}
.d-dp-plane{position:absolute;display:flex;align-items:center;justify-content:center;box-sizing:border-box;border-radius:6px}
.d-dp-back{left:16px;top:16px;right:16px;bottom:16px;border:1px solid var(--line);background:var(--paper);transform:translateZ(-120px)}
.d-dp-mid{left:64px;top:40px;width:172px;height:70px;border:1px solid var(--faint);background:var(--bg);transform:translateZ(-30px)}
.d-dp-front{left:112px;top:56px;width:76px;height:38px;background:var(--ink);color:var(--bg);transform:translateZ(60px)}
.d-dp-k{font-size:11px;letter-spacing:.08em;color:var(--muted)}
.d-dp-v{font-family:var(--font-mono);font-size:11px}
.d-dp:focus-visible{outline:1px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<div class="pv-bar">
  <code>depth-parallax</code>
  <b>分层视差</b>
  <span>depth parallax</span>
  <span>分类 3D 与透视</span>
  <span>运动 物理</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<div class="d-dp" tabindex="0" role="group" aria-label="分层视差：鼠标移动或方向键转动景深"><div class="d-dp-scene"><span class="d-dp-plane d-dp-back"></span><span class="d-dp-plane d-dp-mid"><span class="d-dp-k">景深三层</span></span><span class="d-dp-plane d-dp-front"><span class="d-dp-v">+60</span></span></div></div>
</div>
<p class="pv-note">三层靠 translateZ 分景深，不手算每层位移：场景绕 Y 轴转 11° 时，近层在屏幕上走过的像素自然多于远层，跟真实透视一致。11° / 9° 是上限，再转背板边缘就会露出空边；方向键一次 3°，和鼠标手感同档。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "depth-parallax";
  window.INITS = window.INITS || {};
  window.INITS["depth-parallax"] = (root => {
  const box = root.querySelector('.d-dp');
  if (!box) return;
  const scene = box.querySelector('.d-dp-scene');
  let kx = 0, ky = 0;
  const apply = () => { scene.style.transform = 'rotateX(' + ky.toFixed(2) + 'deg) rotateY(' + kx.toFixed(2) + 'deg)'; };
  box.onpointermove = e => {
    const r = box.getBoundingClientRect();
    kx = ((e.clientX - r.left) / r.width - .5) * 22;
    ky = -((e.clientY - r.top) / r.height - .5) * 18;
    scene.style.transition = 'none';
    apply();
  };
  box.onpointerleave = () => {
    kx = 0; ky = 0;
    scene.style.transition = 'transform 280ms cubic-bezier(.34,1.56,.64,1)';
    apply();
  };
  const step = { ArrowLeft: [-3, 0], ArrowRight: [3, 0], ArrowUp: [0, -3], ArrowDown: [0, 3] };
  box.onkeydown = e => {
    const s = step[e.key];
    if (!s) return;
    e.preventDefault();
    kx = Math.max(-11, Math.min(11, kx + s[0]));
    ky = Math.max(-9, Math.min(9, ky + s[1]));
    scene.style.transition = 'transform 280ms cubic-bezier(.34,1.56,.64,1)';
    apply();
  };
});
  window.INITS["depth-parallax"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
