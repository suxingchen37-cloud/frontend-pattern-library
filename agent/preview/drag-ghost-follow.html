<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拖拽残影 · drag-ghost-follow · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px var(--line);
  --border-strong:1px var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-ghost{position:relative;width:300px;height:150px;padding:16px;color:var(--ink)}
.d-ghost-slot{position:relative;width:120px;height:80px}
.d-ghost-frame{position:absolute;inset:0;border:1px dashed var(--line);border-radius:10px}
.d-ghost-card,.d-ghost-copy{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:8px 10px;background:var(--paper);border:1px solid var(--line);border-radius:10px}
.d-ghost-card{box-shadow:0 1px 0 var(--line);cursor:grab;touch-action:none;user-select:none;transition:opacity .18s linear}
.d-ghost-copy{border-color:var(--ink);box-shadow:0 12px 24px -8px #20241e26;opacity:0;pointer-events:none;will-change:transform}
.d-ghost[data-drag="1"] .d-ghost-card{opacity:.28;border-style:dashed;cursor:grabbing}
.d-ghost-card b,.d-ghost-copy b{font-size:13px;font-weight:650}
.d-ghost-card em,.d-ghost-copy em{font-style:normal;font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--faint)}
.d-ghost-card:focus-visible{outline:1px solid var(--ink);outline-offset:2px}
.d-ghost-hint{position:absolute;left:16px;bottom:8px;margin:0;font-family:var(--mono);font-size:9px;color:var(--faint)}
</style>
</head>
<body>
<div class="pv-bar">
  <code>drag-ghost-follow</code>
  <b>拖拽残影</b>
  <span>ghost trail</span>
  <span>分类 拖拽</span>
  <span>运动 物理</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<div class="d-ghost" role="group" aria-label="拖拽残影">
  <div class="d-ghost-slot">
    <span class="d-ghost-frame" aria-hidden="true"></span>
    <article class="d-ghost-card" tabindex="0" role="button" aria-label="按住拖动，原件留残影"><b>原件</b><em>拖我</em></article>
    <article class="d-ghost-copy" aria-hidden="true"><b>原件</b><em>拖我</em></article>
  </div>
  <p class="d-ghost-hint">残影每帧按 0.3 追指针</p>
</div>
</div>
<p class="pv-note">残影每帧按 0.3 追指针：0.5 就变成钉在指针上、没有重量，0.15 会一直掉半个身位、像卡住了。原件压到 0.28 不透明度也有上下限——再高会和残影抢注意力，再低就看不出「它原来在哪」，而「原来在哪」正是这条要传达的信息。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "drag-ghost-follow";
  window.INITS = window.INITS || {};
  window.INITS["drag-ghost-follow"] = (root => {
  const box = root.querySelector('.d-ghost');
  if (!box || box.dataset.ready) return;
  box.dataset.ready = '1';
  const card = box.querySelector('.d-ghost-card');
  const copy = box.querySelector('.d-ghost-copy');
  const hint = box.querySelector('.d-ghost-hint');
  const IDLE = '残影每帧按 0.3 追指针';
  let tx = 0, ty = 0, cx = 0, cy = 0, raf = 0, drag = null;

  function loop() {
    cx += (tx - cx) * .3;
    cy += (ty - cy) * .3;
    copy.style.transform = 'translate(' + cx.toFixed(2) + 'px,' + cy.toFixed(2) + 'px)';
    raf = requestAnimationFrame(loop);
  }

  function down(e) {
    if (drag) return;
    e.preventDefault();
    card.focus({ preventScroll: true });
    card.setPointerCapture(e.pointerId);
    drag = { x: e.clientX, y: e.clientY };
    tx = ty = cx = cy = 0;
    box.dataset.drag = '1';
    copy.style.transition = 'none';
    copy.style.opacity = '1';
    if (!raf) raf = requestAnimationFrame(loop);
  }
  function move(e) {
    if (!drag) return;
    tx = e.clientX - drag.x;
    ty = e.clientY - drag.y;
    hint.textContent = '滞后 ' + Math.round(Math.hypot(tx - cx, ty - cy)) + 'px';
  }
  function up() {
    if (!drag) return;
    drag = null;
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    delete box.dataset.drag;
    copy.style.transition = 'transform .28s cubic-bezier(.34,1.56,.64,1),opacity .18s linear';
    copy.style.transform = 'translate(0px,0px)';
    copy.style.opacity = '0';
    tx = ty = cx = cy = 0;
    hint.textContent = IDLE;
  }
  function key(e) {
    const mv = { ArrowLeft: [-12, 0], ArrowRight: [12, 0], ArrowUp: [0, -12], ArrowDown: [0, 12] }[e.key];
    if (!mv) return;
    e.preventDefault();
    const nx = Math.max(-40, Math.min(64, Number(card.dataset.x || 0) + mv[0]));
    const ny = Math.max(-20, Math.min(24, Number(card.dataset.y || 0) + mv[1]));
    card.dataset.x = String(nx);
    card.dataset.y = String(ny);
    card.style.transition = 'transform .18s cubic-bezier(.34,1.56,.64,1)';
    card.style.transform = 'translate(' + nx + 'px,' + ny + 'px)';
    hint.textContent = '方向键把卡推开 ' + Math.abs(nx + ny) + 'px';
  }

  card.addEventListener('pointerdown', down);
  card.addEventListener('pointermove', move);
  card.addEventListener('pointerup', up);
  card.addEventListener('pointercancel', up);
  card.addEventListener('keydown', key);
});
  window.INITS["drag-ghost-follow"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
