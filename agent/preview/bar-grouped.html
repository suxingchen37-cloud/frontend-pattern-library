<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>分组柱 · bar-grouped · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px var(--line);
  --border-strong:1px var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-bg2{width:100%;max-width:340px}
.d-bg2-svg{display:block;width:100%;height:auto;overflow:visible}
.d-bg2-axis{stroke:var(--line);stroke-width:1}
.d-bg2-label{fill:var(--faint);font-family:var(--font-mono);font-size:7px;letter-spacing:.06em}
.d-bg2-a{fill:var(--ink)}
.d-bg2-b{fill:color-mix(in srgb,var(--ink) 28%,var(--paper))}
.d-bg2-g{cursor:default}
.d-bg2-g .d-bg2-a,.d-bg2-g .d-bg2-b{transition:opacity 160ms var(--ease-print)}
.d-bg2-svg:hover .d-bg2-g{opacity:.45}
.d-bg2-svg .d-bg2-g:hover{opacity:1}
.d-bg2-note{margin:6px 0 0;font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;color:var(--faint)}
</style>
</head>
<body>
<div class="pv-bar">
  <code>bar-grouped</code>
  <b>分组柱</b>
  <span>grouped bars</span>
  <span>分类 图表</span>
  <span>运动 印刷</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<div class="d-bg2"><svg class="d-bg2-svg" viewBox="0 0 320 170" role="img" aria-label="四组对比柱状图，每组两根"></svg><p class="d-bg2-note">深浅两根：今年 / 去年</p></div>
</div>
<p class="pv-note">两根柱之间留 4px、组与组之间留 18px：间距就是分组信号，两组一样宽反而分不出谁跟谁比。基線从 0 起，不给「截断轴」——截断能让差距看着翻倍，那是骗人。悬停整组变色，是为了让你比较一组里的两根，而不是单根。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "bar-grouped";
  window.INITS = window.INITS || {};
  window.INITS["bar-grouped"] = (root => {
  const svg = root.querySelector('.d-bg2-svg');
  if (!svg) return;
  const groups = [['一季度', 42, 31], ['二季度', 58, 47], ['三季度', 51, 39], ['四季度', 72, 55]];
  const W = 320, H = 170, L = 26, R = 10, T = 14, B = 26;
  const max = 80;
  const plotW = W - L - R, plotH = H - T - B;
  const gw = plotW / groups.length;
  const bw = 16, gap = 4;
  const y = v => T + plotH * (1 - v / max);
  const NS = 'http://www.w3.org/2000/svg';
  const mk = (tag, attrs) => { const el = document.createElementNS(NS, tag); for (const k in attrs) el.setAttribute(k, attrs[k]); return el; };
  for (let g = 0; g <= 4; g++) {
    const gy = T + plotH * g / 4;
    svg.appendChild(mk('line', { class: 'd-bg2-axis', x1: L, y1: gy, x2: W - R, y2: gy }));
    const t = mk('text', { class: 'd-bg2-label', x: 0, y: gy + 2.5 });
    t.textContent = String(max - g * 20);
    svg.appendChild(t);
  }
  groups.forEach((gr, i) => {
    const g = mk('g', { class: 'd-bg2-g' });
    const cx = L + gw * i + gw / 2;
    const x0 = cx - (bw * 2 + gap) / 2;
    g.appendChild(mk('rect', { class: 'd-bg2-a', x: x0, y: y(gr[1]), width: bw, height: y(0) - y(gr[1]) }));
    g.appendChild(mk('rect', { class: 'd-bg2-b', x: x0 + bw + gap, y: y(gr[2]), width: bw, height: y(0) - y(gr[2]) }));
    const t = mk('text', { class: 'd-bg2-label', x: cx, y: H - 8, 'text-anchor': 'middle' });
    t.textContent = gr[0];
    g.appendChild(t);
    svg.appendChild(g);
  });
});
  window.INITS["bar-grouped"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
