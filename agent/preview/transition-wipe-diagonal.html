<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>斜切擦除 · transition-wipe-diagonal · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px solid var(--line);
  --border-strong:1px solid var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-wipe{position:relative;width:296px;max-width:100%;height:132px;overflow:hidden;border:1px solid var(--line);border-radius:10px;font-family:var(--sans);outline:none;cursor:pointer}
.d-wipe:focus-visible{outline:1px solid var(--ink);outline-offset:2px}
.d-wipe-a,.d-wipe-b{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;padding:var(--sp-12)}
.d-wipe-a{background:var(--paper);color:var(--muted)}
.d-wipe-b{background:#2b4b8f;color:var(--paper);clip-path:polygon(0 0,0 0,0 100%,0 100%)}
.d-wipe-k{font-family:var(--mono);font-size:var(--fs-9);letter-spacing:.08em;opacity:.75}
.d-wipe-l{font-size:var(--fs-21);font-weight:600;letter-spacing:-.02em}
.d-wipe.is-on .d-wipe-b{animation:d-transition-wipe-diagonal-in 280ms cubic-bezier(.2,.75,.25,1) forwards}
.d-wipe.is-on .d-wipe-b .d-wipe-l{animation:d-transition-wipe-diagonal-text 280ms cubic-bezier(.2,.75,.25,1) forwards}
.d-wipe.is-out .d-wipe-b{animation:d-transition-wipe-diagonal-out 280ms cubic-bezier(.2,.75,.25,1) forwards}
@keyframes d-transition-wipe-diagonal-in{from{clip-path:polygon(0 0,0 0,0 100%,0 100%)}to{clip-path:polygon(0 0,128% 0,108% 100%,0 100%)}}
@keyframes d-transition-wipe-diagonal-out{from{clip-path:polygon(0 0,128% 0,108% 100%,0 100%)}to{clip-path:polygon(0 0,0 0,0 100%,0 100%)}}
@keyframes d-transition-wipe-diagonal-text{from{transform:translateX(-10px)}to{transform:translateX(0)}}
</style>
</head>
<body>
<div class="pv-bar">
  <code>transition-wipe-diagonal</code>
  <b>斜切擦除</b>
  <span>diagonal wipe</span>
  <span>分类 过渡</span>
  <span>运动 印刷</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<div class="d-wipe" tabindex="0" role="group" aria-label="斜切擦除，回车重播"><div class="d-wipe-a"><span class="d-wipe-k">旧版</span><span class="d-wipe-l">排字顺序</span></div><div class="d-wipe-b"><span class="d-wipe-k">新版</span><span class="d-wipe-l">阅读顺序</span></div></div>
</div>
<p class="pv-note">边界斜 20%（顶边比底边多走 20% 宽），斜边一有角度，眼睛先看到「被刮开」而不是「淡入」；新内容同时从 -10px 推到 0，才像被带过来。整版靛蓝是本批两处破格之一——擦除的边只有色差才看得见。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "transition-wipe-diagonal";
  window.INITS = window.INITS || {};
  window.INITS["transition-wipe-diagonal"] = (root => {
  const box = root.querySelector('.d-wipe');
  if (!box || box.dataset.dwd) return;
  box.dataset.dwd = '1';
  const on = () => {
    clearTimeout(box._dwT);
    box.classList.remove('is-out');
    box.classList.add('is-on');
  };
  const off = () => {
    clearTimeout(box._dwT);
    box.classList.add('is-out');
    box._dwT = setTimeout(() => {
      box.classList.remove('is-on');
      box.classList.remove('is-out');
    }, 280);
  };
  box._dwT = setTimeout(on, 280);
  box.addEventListener('click', () => { if (box.classList.contains('is-on')) off(); else on(); });
  box.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      if (box.classList.contains('is-on')) off(); else on();
    }
  });
});
  window.INITS["transition-wipe-diagonal"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
