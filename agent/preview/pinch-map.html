<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>地图式缩放 · pinch-map · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px solid var(--line);
  --border-strong:1px solid var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-pm{position:relative;width:100%;max-width:340px;height:190px;border:1px solid var(--line);border-radius:10px;background:var(--bg);overflow:hidden;touch-action:none;cursor:grab}
.d-pm-layer{position:absolute;inset:0;transform-origin:0 0;will-change:transform}
.d-pm-layer span{position:absolute;left:14px;top:12px;font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;color:var(--faint)}
.d-pm-block{position:absolute;border:1px solid var(--ink);border-radius:2px;background:color-mix(in srgb,var(--ink) 8%,var(--paper))}
.d-pm-b1{left:40px;top:52px;width:90px;height:54px}
.d-pm-b2{left:150px;top:92px;width:70px;height:64px}
.d-pm-b3{left:238px;top:40px;width:56px;height:88px;background:color-mix(in srgb,var(--ink-vermilion) 18%,var(--paper));border-color:var(--ink-vermilion)}
.d-pm-layer em{position:absolute;right:10px;bottom:8px;font-style:normal;font-family:var(--font-mono);font-size:9px;color:var(--faint)}
</style>
</head>
<body>
<div class="pv-bar">
  <code>pinch-map</code>
  <b>地图式缩放</b>
  <span>pinch map</span>
  <span>分类 手势</span>
  <span>运动 物理</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<div class="d-pm" data-map><div class="d-pm-layer" data-layer><span>街区 A</span><i class="d-pm-block d-pm-b1"></i><i class="d-pm-block d-pm-b2"></i><i class="d-pm-block d-pm-b3"></i><em data-scale>1.0×</em></div></div>
</div>
<p class="pv-note">缩放围绕两指中点，不是画布中心：手指想放大的地方就该留在指尖下。倍率卡在 1–3，缩到 1 再缩会停住而不是乱飘；平移范围跟着倍率算，放得越大能拖的越多。滚轮用 Ctrl 当捏合，桌面也能试。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "pinch-map";
  window.INITS = window.INITS || {};
  window.INITS["pinch-map"] = (root => {
  const box = root.querySelector('[data-map]');
  const layer = root.querySelector('[data-layer]');
  const label = layer && layer.querySelector('[data-scale]');
  if (!box || !layer) return;
  let scale = 1, x = 0, y = 0;
  const pts = new Map();
  let pinch = null, pan = null;
  const clamp = () => {
    const minX = box.clientWidth * (1 - scale), minY = box.clientHeight * (1 - scale);
    x = Math.max(minX, Math.min(0, x));
    y = Math.max(minY, Math.min(0, y));
    layer.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) scale(' + scale.toFixed(3) + ')';
    if (label) label.textContent = scale.toFixed(1) + '×';
  };
  const zoomAt = (cx, cy, factor) => {
    const next = Math.max(1, Math.min(3, scale * factor));
    const k = next / scale;
    x = cx - (cx - x) * k;
    y = cy - (cy - y) * k;
    scale = next;
  };
  const span = () => {
    const v = [...pts.values()];
    return { d: Math.hypot(v[0].x - v[1].x, v[0].y - v[1].y), cx: (v[0].x + v[1].x) / 2, cy: (v[0].y + v[1].y) / 2 };
  };
  box.addEventListener('pointerdown', e => {
    box.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2) {
      const s = span(), r = box.getBoundingClientRect();
      pinch = { d: s.d, cx: s.cx - r.left, cy: s.cy - r.top };
    } else if (pts.size === 1) {
      pan = { x: e.clientX, y: e.clientY, px: x, py: y };
    }
  });
  box.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2 && pinch) {
      const s = span(), r = box.getBoundingClientRect();
      const factor = s.d / Math.max(1, pinch.d);
      zoomAt(s.cx - r.left, s.cy - r.top, factor);
      x += (s.cx - r.left) - pinch.cx;
      y += (s.cy - r.top) - pinch.cy;
      pinch = { d: s.d, cx: s.cx - r.left, cy: s.cy - r.top };
      clamp();
    } else if (pan && scale > 1) {
      x = pan.px + (e.clientX - pan.x);
      y = pan.py + (e.clientY - pan.y);
      clamp();
    }
  });
  const release = e => {
    pts.delete(e.pointerId);
    if (pts.size < 2) pinch = null;
    if (pts.size === 0) pan = null;
    else if (pts.size === 1) { const p = [...pts.values()][0]; pan = { x: p.x, y: p.y, px: x, py: y }; }
  };
  box.addEventListener('pointerup', release);
  box.addEventListener('pointercancel', release);
  box.addEventListener('wheel', e => {
    if (!e.ctrlKey) return;
    e.preventDefault();
    const r = box.getBoundingClientRect();
    zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.15 : 0.87);
    clamp();
  }, { passive: false });
  box.addEventListener('dblclick', e => {
    const r = box.getBoundingClientRect();
    if (scale > 1.5) { scale = 1; x = 0; y = 0; clamp(); }
    else { zoomAt(e.clientX - r.left, e.clientY - r.top, 2); clamp(); }
  });
  clamp();
});
  window.INITS["pinch-map"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
