<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>片段地址驱动视图 · hash-section-router · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px solid var(--line);
  --border-strong:1px solid var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-hash-section-router{width:100%;max-width:430px;min-width:0;color:var(--ink);font:inherit;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.d-hash-section-router *,.d-hash-section-router *::before,.d-hash-section-router *::after{box-sizing:border-box}
.d-hash-section-router [hidden]{display:none!important}
.d-hash-section-router .d-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0}
.d-hash-section-router .d-note{display:block;margin:8px 0 0;color:var(--muted);font-size:12px;min-height:1.5em}
.d-hash-section-router label{display:block;margin:8px 0}
.d-hash-section-router input,.d-hash-section-router select,.d-hash-section-router textarea,.d-hash-section-router button{font:inherit;color:inherit;max-width:100%;min-width:0}
.d-hash-section-router input:not([type=checkbox]):not([type=radio]),.d-hash-section-router select,.d-hash-section-router textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:var(--radius-control);background:var(--paper)}
.d-hash-section-router button{padding:6px 10px;border:1px solid var(--line);border-radius:var(--radius-control);background:var(--paper);cursor:pointer}
.d-hash-section-router button:disabled{opacity:.5;cursor:default}
.d-hash-section-router :focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.d-hash-section-router [aria-invalid=true]{border-color:var(--warn)!important}
.d-hash-section-router .d-scroll{max-width:100%;overflow:auto}
.d-hash-section-router table{width:100%;border-collapse:collapse;font-size:12px;text-align:left}
.d-hash-section-router th,.d-hash-section-router td{padding:7px;border-bottom:1px solid var(--line);vertical-align:top}
.d-hash-section-router caption{text-align:left;font-weight:600;margin-bottom:8px}
.d-hash-section-router progress{width:100%;accent-color:var(--ink)}
.d-hash-section-router pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}
.d-hash-section-router h3,.d-hash-section-router p{margin:8px 0}
.d-hash-section-router [aria-pressed=true],.d-hash-section-router [aria-selected=true]{border-color:var(--ink);font-weight:650}
.d-hash-section-router .d-grow{flex:1;min-width:100px}
.d-hash-section-router summary{cursor:pointer;padding:6px 0}
.d-hash-section-router ul,.d-hash-section-router ol{padding-left:24px}
</style>
</head>
<body>
<div class="pv-bar">
  <code>hash-section-router</code>
  <b>片段地址驱动视图</b>
  <span>hash section router</span>
  <span>分类 导航</span>
  <span>运动 无动效</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<section class="d-hash-section-router" aria-label="片段地址驱动视图"><div class="d-row"><button type="button" data-overview>概览</button><button type="button" data-assets>素材</button><button type="button" data-delivery>交付</button></div><p data-view></p><output class="d-note" data-out role="status" aria-live="polite"></output></section>
</div>
<p class="pv-note">三个视图共用明确的片段前缀，刷新时读取片段；浏览器前进后退同步当前视图。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "hash-section-router";
  window.INITS = window.INITS || {};
  window.INITS["hash-section-router"] = (root => {
 const q = selector => root.querySelector(selector);
 const qa = selector => [...root.querySelectorAll(selector)];
 const say = text => { const out = q('[data-out]'); if (out) out.textContent = text; };
 ((root,q,qa,say)=>{const views={overview:'项目概览',assets:'素材目录',delivery:'交付说明'};const draw=()=>{const key=location.hash.replace('#workflow-route-',''),current=Object.hasOwn(views,key)?key:'overview';q('[data-view]').textContent=views[current];Object.keys(views).forEach(name=>q('[data-'+name+']').setAttribute('aria-pressed',String(name===current)));say('当前视图：'+views[current]);};Object.keys(views).forEach(key=>q('[data-'+key+']').onclick=()=>{location.hash='workflow-route-'+key;draw();});window.addEventListener('hashchange',draw);draw();})(root, q, qa, say);
});
  window.INITS["hash-section-router"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
