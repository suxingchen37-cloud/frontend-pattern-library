<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>步骤状态 · step-status · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px var(--line);
  --border-strong:1px var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-ss3{width:240px}
.d-step-status-sssteps3{display:flex;gap:4px;margin-bottom:7px}
.d-step-status-sssteps3 span{flex:1;font-size:9px;text-align:center;padding:4px 2px;border:1px solid var(--line);border-radius:2px;color:var(--faint)}
.d-step-status-sssteps3 span.d-step-status-live3{border-color:var(--ink);color:var(--ink);background:var(--lime-soft)}
.d-step-status-sssteps3 span.d-step-status-done3{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.d-step-status-sssteps3 span.err3{border-color:var(--coral);color:var(--warn);background:color-mix(in srgb,var(--coral) 10%,transparent)}
.d-step-status-ssmsg3{margin:0 0 7px;font:9.5px var(--mono);color:var(--muted)}
.d-step-status-ssacts3{display:flex;gap:4px}
.d-step-status-ssacts3 button{font-size:9px;border:1px solid var(--line);background:var(--paper);border-radius:2px;padding:2px 7px;cursor:pointer}
</style>
</head>
<body>
<div class="pv-bar">
  <code>step-status</code>
  <b>步骤状态</b>
  <span>step status</span>
  <span>分类 反馈</span>
  <span>运动 无动效</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<div class="d-ss3"><div class="d-step-status-sssteps3" data-sssteps><span class="d-step-status-done3">1 检查</span><span class="d-step-status-live3">2 构建</span><span>3 发布</span></div><p class="d-step-status-ssmsg3" data-ssmsg3>正在构建…</p><div class="d-step-status-ssacts3"><button type="button" data-nextstep3>下一步</button><button type="button" data-failstep3>模拟失败</button></div></div>
</div>
<p class="pv-note">每一步有等待、进行、完成、失败；失败后能重试，不用从头再来。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "step-status";
  window.INITS = window.INITS || {};
  window.INITS["step-status"] = (root => {
    const steps = [...root.querySelectorAll('[data-sssteps] span')], msg = root.querySelector('[data-ssmsg3]');
    let idx = 1, err = false;
    const paint = () => {
      steps.forEach((s, i) => {
        s.className = '';
        if (i < idx) s.classList.add('d-step-status-done3');
        else if (i === idx) s.classList.add(err ? 'err3' : 'd-step-status-live3');
      });
      msg.textContent = err ? '构建失败 · 可以重试这一步' : idx >= steps.length ? '全部完成 · 已发布' : '正在' + steps[idx].textContent.split(' ')[1] + '…';
    };
    root.querySelector('[data-nextstep3]').onclick = () => {
      if (err) { err = false; paint(); return; }
      idx = Math.min(steps.length, idx + 1); paint();
    };
    root.querySelector('[data-failstep3]').onclick = () => { err = true; paint(); };
    paint();
  });
  window.INITS["step-status"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
