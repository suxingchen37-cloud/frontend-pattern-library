<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>高对比模式 · contrast-toggle · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px var(--line);
  --border-strong:1px var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-ct{width:300px;max-width:100%;height:150px;padding:12px;border:1px solid var(--line);border-radius:2px;background:var(--bg);font-family:var(--sans)}
.d-ct-card{padding:7px 10px;border:1px solid var(--line);border-radius:2px;background:var(--paper);box-shadow:0 1px 0 var(--line)}
.d-ct-h{display:block;font-size:11.5px;line-height:1.5;font-weight:650;color:var(--ink)}
.d-ct-p{margin:4px 0 0;font-size:11px;line-height:1.6;color:var(--muted)}
.d-ct-meta{display:block;margin-top:6px;font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--faint)}
.d-ct-bar{display:flex;align-items:center;gap:10px;margin-top:10px}
.d-ct-sw{display:inline-flex;align-items:center;gap:6px;padding:3px 8px 3px 4px;border:1px solid var(--line);border-radius:999px;background:var(--paper);cursor:pointer}
.d-ct-sw:focus-visible{outline:1px solid var(--ink);outline-offset:2px}
.d-ct-track{display:block;width:32px;height:16px;padding:1px;border:1px solid var(--line);border-radius:999px;background:var(--bg)}
.d-ct-knob{display:block;width:12px;height:12px;border-radius:999px;background:var(--faint);transform:translateX(0);transition:transform 120ms steps(6),background-color 120ms steps(6)}
.d-ct-opt{font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--muted)}
.d-ct-state{font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--faint)}
.d-ct.is-hc{background:var(--paper)}
.d-ct.is-hc .d-ct-card{box-shadow:none;border-color:var(--ink)}
.d-ct.is-hc .d-ct-p{color:var(--ink)}
.d-ct.is-hc .d-ct-meta{color:var(--muted)}
.d-ct.is-hc .d-ct-track{border-color:var(--ink);background:var(--paper)}
.d-ct.is-hc .d-ct-opt,.d-ct.is-hc .d-ct-state{color:var(--ink)}
.d-ct.is-hc .d-ct-knob{transform:translateX(16px);background:var(--ink)}
</style>
</head>
<body>
<div class="pv-bar">
  <code>contrast-toggle</code>
  <b>高对比模式</b>
  <span>contrast toggle</span>
  <span>分类 无障碍</span>
  <span>运动 机械</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<div class="d-ct"><div class="d-ct-card"><b class="d-ct-h">第 04 期 · 排字房札记</b><p class="d-ct-p">行距 1.7，字距 0，欠一档光就够读。</p><span class="d-ct-meta">p.14 / 全文 2200 字</span></div><div class="d-ct-bar"><button class="d-ct-sw" type="button" role="switch" aria-checked="false"><i class="d-ct-track"><i class="d-ct-knob" aria-hidden="true"></i></i><span class="d-ct-opt">高对比</span></button><span class="d-ct-state">STATE · 正常</span></div></div>
</div>
<p class="pv-note">两态之间不做淡入淡出：拨杆用 steps(6) 走 120ms，一格一格换挡，像老印刷机的调墨杆——过渡会让人怀疑「是不是还在切」。真正只换三样：正文落到 --ink、描边从 --line 加深到 --ink、0 1px 0 的底边阴影清零；颜色一变立刻可读，不用等动画结束。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "contrast-toggle";
  window.INITS = window.INITS || {};
  window.INITS["contrast-toggle"] = (root => {
  const box = root.querySelector('.d-ct');
  if (!box || box.dataset.ct) return;
  box.dataset.ct = '1';
  const sw = box.querySelector('.d-ct-sw');
  const state = box.querySelector('.d-ct-state');
  const paint = on => {
    box.classList.toggle('is-hc', on);
    sw.classList.toggle('is-on', on);
    sw.setAttribute('aria-checked', String(on));
    state.textContent = on ? 'STATE · 高对比' : 'STATE · 正常';
  };
  sw.addEventListener('click', () => paint(sw.getAttribute('aria-checked') !== 'true'));
  paint(false);
});
  window.INITS["contrast-toggle"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
