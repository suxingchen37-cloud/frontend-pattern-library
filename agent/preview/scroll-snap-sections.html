<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>分屏吸附 · scroll-snap-sections · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px var(--line);
  --border-strong:1px var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-ss{position:relative;box-sizing:border-box;width:300px;max-width:100%;height:150px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.d-ss-scroll{box-sizing:border-box;height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;padding-right:30px}
.d-ss-scroll::-webkit-scrollbar{width:0;height:0}
.d-ss-panel{box-sizing:border-box;height:100%;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:0 16px;border-bottom:1px solid var(--line);scroll-snap-align:start;scroll-snap-stop:always}
.d-ss-panel:last-child{border-bottom:0}
.d-ss-no{font-family:var(--font-mono);font-size:var(--fs-11);letter-spacing:var(--tracking-mono-label);color:var(--faint)}
.d-ss-h{margin:0;font-size:var(--fs-21);font-weight:650;line-height:var(--lh-display);letter-spacing:var(--tracking-display);color:var(--ink)}
.d-ss-p{margin:0;font-size:var(--fs-11);line-height:var(--lh-note);color:var(--muted)}
.d-ss-rail{--i:0;position:absolute;right:8px;top:50%;width:16px;height:58px;transform:translateY(-50%)}
.d-ss-tick{position:absolute;right:0;width:7px;height:1px;background:var(--faint)}
.d-ss-tick:nth-child(1){top:0}
.d-ss-tick:nth-child(2){top:28px}
.d-ss-tick:nth-child(3){top:56px}
.d-ss-mark{position:absolute;right:0;top:0;width:12px;height:2px;background:var(--ink);transform:translateY(calc(var(--i,0) * 28px));transition:transform 180ms linear}
.d-ss-scroll:focus-visible{outline:1px solid var(--ink);outline-offset:-3px}
</style>
</head>
<body>
<div class="pv-bar">
  <code>scroll-snap-sections</code>
  <b>分屏吸附</b>
  <span>snap sections</span>
  <span>分类 滚动驱动</span>
  <span>运动 机械</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<div class="d-ss" role="group" aria-label="分屏吸附：滚动三段，右侧刻度指示当前段"><div class="d-ss-scroll" tabindex="0" aria-label="三段面板，滚动或按 PageUp / PageDown 换段"><section class="d-ss-panel"><span class="d-ss-no">01 / 03</span><h3 class="d-ss-h">装版</h3><p class="d-ss-p">铅字按行排进版框，木楔从两侧顶紧</p></section><section class="d-ss-panel"><span class="d-ss-no">02 / 03</span><h3 class="d-ss-h">校色</h3><p class="d-ss-p">先印一张样张，对着色标看深浅</p></section><section class="d-ss-panel"><span class="d-ss-no">03 / 03</span><h3 class="d-ss-h">裁切</h3><p class="d-ss-p">切刀对齐十字线，一刀到底</p></section></div><div class="d-ss-rail" aria-hidden="true"><i class="d-ss-tick"></i><i class="d-ss-tick"></i><i class="d-ss-tick"></i><span class="d-ss-mark"></span></div></div>
</div>
<p class="pv-note">每段高度正好等于滚动框内高（148px），所以 scroll-snap 一定停在段首，不会停在半段；右侧刻度按同样的 28px 步距排三点，指针用 linear 180ms 平移——刻度是读数，加弹簧反而让人以为还有惯性没走完。记忆点：翻页式的段落，右边有个跟着走的指针。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "scroll-snap-sections";
  window.INITS = window.INITS || {};
  window.INITS["scroll-snap-sections"] = (root => {
  const box = root.querySelector('.d-ss-scroll');
  const rail = root.querySelector('.d-ss-rail');
  if (!box || !rail || box.dataset.ss) return;
  box.dataset.ss = '1';
  const sync = () => {
    const h = box.clientHeight || 1;
    const i = Math.max(0, Math.min(2, Math.round(box.scrollTop / h)));
    rail.style.setProperty('--i', String(i));
  };
  box.addEventListener('scroll', sync, { passive: true });
  box.addEventListener('keydown', e => {
    const h = box.clientHeight || 0;
    if (e.key === 'PageDown') { e.preventDefault(); box.scrollTo({ top: Math.min(box.scrollHeight, box.scrollTop + h) }); }
    else if (e.key === 'PageUp') { e.preventDefault(); box.scrollTo({ top: Math.max(0, box.scrollTop - h) }); }
  });
  sync();
});
  window.INITS["scroll-snap-sections"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
