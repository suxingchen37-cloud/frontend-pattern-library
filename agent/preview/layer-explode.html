<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>分层爆炸图 · layer-explode · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px solid var(--line);
  --border-strong:1px solid var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-le{box-sizing:border-box;width:260px;max-width:100%;height:150px;display:grid;place-items:center;perspective:640px}
.d-le-deck{position:relative;width:196px;height:84px;transform-style:preserve-3d;transform:rotateX(18deg) rotateY(-14deg)}
.d-le-plate{position:absolute;inset:0;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);transform:translateZ(var(--z,0px));transition:transform 280ms cubic-bezier(.34,1.56,.64,1),opacity 180ms cubic-bezier(.34,1.56,.64,1),border-color 120ms cubic-bezier(.34,1.56,.64,1);will-change:transform}
.d-le-plate:nth-child(1){--z:0px;z-index:1}
.d-le-plate:nth-child(2){--z:26px;z-index:2}
.d-le-plate:nth-child(3){--z:52px;z-index:3}
.d-le-no{font-family:var(--font-mono);font-size:var(--fs-11);font-weight:400;letter-spacing:var(--tracking-mono-label);color:var(--faint)}
.d-le-name{font-size:var(--fs-13);font-weight:600}
.d-le-deck.is-hot .d-le-plate{opacity:.45;transform:translateZ(-18px)}
.d-le-deck.is-hot .d-le-plate.is-on{opacity:1;border-color:var(--ink);transform:translateZ(64px)}
.d-le-plate:focus-visible{outline:1px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<div class="pv-bar">
  <code>layer-explode</code>
  <b>分层爆炸图</b>
  <span>layer explode</span>
  <span>分类 3D 与透视</span>
  <span>运动 物理</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<div class="d-le" role="group" aria-label="分层爆炸图：悬停或聚焦任一层，该层抬起、其余后退"><div class="d-le-deck"><div class="d-le-plate" tabindex="0"><b class="d-le-no">01</b><span class="d-le-name">底板</span></div><div class="d-le-plate" tabindex="0"><b class="d-le-no">02</b><span class="d-le-name">图文层</span></div><div class="d-le-plate" tabindex="0"><b class="d-le-no">03</b><span class="d-le-name">标注层</span></div></div></div>
</div>
<p class="pv-note">三层沿 Z 轴拉开 26px，是 1px 描边在 640px 透视下还能认出「这是三层」的最小间隙，再挤就糊成一张卡；指针进入某层时它抬到 64px、其余退到 -18px 并压到 45% 不透明度，读者先看清被抽出的那一层，再回头对它在原图里的位置。记忆点：抽屉式抽层。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "layer-explode";
  window.INITS = window.INITS || {};
  window.INITS["layer-explode"] = (root => {
  const deck = root.querySelector('.d-le-deck');
  if (!deck || deck.dataset.le) return;
  deck.dataset.le = '1';
  const plates = Array.from(deck.querySelectorAll('.d-le-plate'));
  const on = el => { deck.classList.add('is-hot'); plates.forEach(p => p.classList.toggle('is-on', p === el)); };
  const off = () => { deck.classList.remove('is-hot'); plates.forEach(p => p.classList.remove('is-on')); };
  deck.addEventListener('pointerover', e => { const p = e.target.closest('.d-le-plate'); if (p) on(p); });
  deck.addEventListener('pointerout', e => { const p = e.target.closest('.d-le-plate'); if (p && !p.contains(e.relatedTarget)) off(); });
  deck.addEventListener('focusin', e => { const p = e.target.closest('.d-le-plate'); if (p) on(p); });
  deck.addEventListener('focusout', e => { const p = e.target.closest('.d-le-plate'); if (p && !p.contains(e.relatedTarget)) off(); });
  deck.addEventListener('keydown', e => { if (e.key === 'Escape') off(); });
});
  window.INITS["layer-explode"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
