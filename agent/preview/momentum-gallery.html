<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>惯性相册 · momentum-gallery · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px solid var(--line);
  --border-strong:1px solid var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-mg{position:relative;width:100%;max-width:340px;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:12px 0 0}
.d-mg-track{display:flex;gap:8px;padding:0 12px;will-change:transform;touch-action:pan-y;cursor:grab}
.d-mg-card{flex:0 0 78%;height:110px;display:flex;flex-direction:column;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.d-mg-card b{font-family:var(--font-mono);font-size:9px;letter-spacing:.08em;color:var(--faint);font-weight:400}
.d-mg-card span{font-size:13px}
.d-mg-note{margin:8px 0 10px;text-align:center;font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;color:var(--faint)}
</style>
</head>
<body>
<div class="pv-bar">
  <code>momentum-gallery</code>
  <b>惯性相册</b>
  <span>momentum gallery</span>
  <span>分类 手势</span>
  <span>运动 物理</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<div class="d-mg" data-gallery><div class="d-mg-track" data-track><div class="d-mg-card"><b>01</b><span>开场</span></div><div class="d-mg-card"><b>02</b><span>推门</span></div><div class="d-mg-card"><b>03</b><span>停顿</span></div><div class="d-mg-card"><b>04</b><span>反打</span></div><div class="d-mg-card"><b>05</b><span>收</span></div></div><p class="d-mg-note">快速横滑 · 会自己滑一会儿</p></div>
</div>
<p class="pv-note">松手后按最后一段速度继续滑，摩擦每帧 0.94：手指快划时能连翻三四张，慢拖则停在原地。停下来的位置吸附到最近的整张，因为半张卡停在中间既不能看也不能点。单张宽度取容器 78%，露出下一张的一角，人才知道后面还有。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "momentum-gallery";
  window.INITS = window.INITS || {};
  window.INITS["momentum-gallery"] = (root => {
  var box = root.querySelector('[data-gallery]');
  var track = root.querySelector('[data-track]');
  if (!box || !track) return;
  var x = 0, v = 0, startX = 0, lastX = 0, lastT = 0, drag = false, raf = 0;
  var minX = function () { return Math.min(0, box.clientWidth - track.scrollWidth - 12); };
  var apply = function () { track.style.transform = 'translate3d(' + x.toFixed(1) + 'px,0,0)'; };
  var snap = function () {
    var card = track.querySelector('.d-mg-card');
    if (!card) return;
    var w = card.offsetWidth + 8;
    var i = Math.round(-x / w);
    var target = Math.max(minX(), Math.min(0, -i * w));
    x = target; apply();
  };
  var tick = function () {
    if (drag) return;
    x += v; v *= .94;
    if (x > 0) { x = 0; v = 0; }
    if (x < minX()) { x = minX(); v = 0; }
    apply();
    if (Math.abs(v) > .3) raf = requestAnimationFrame(tick);
    else { snap(); v = 0; }
  };
  track.addEventListener('pointerdown', function (e) { drag = true; startX = e.clientX; lastX = e.clientX; lastT = Date.now(); v = 0; cancelAnimationFrame(raf); track.setPointerCapture(e.pointerId); });
  track.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var now = Date.now();
    x += e.clientX - lastX;
    v = (e.clientX - lastX) / Math.max(1, now - lastT) * 16;
    lastX = e.clientX; lastT = now;
    if (x > 0) x *= .35;
    if (x < minX()) x = minX() + (x - minX()) * .35;
    apply();
  });
  var end = function () { if (!drag) return; drag = false; raf = requestAnimationFrame(tick); };
  track.addEventListener('pointerup', end);
  track.addEventListener('pointercancel', end);
  apply();
});
  window.INITS["momentum-gallery"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
