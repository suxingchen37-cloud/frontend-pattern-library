<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>边缘右滑返回 · edge-swipe-back · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px solid var(--line);
  --border-strong:1px solid var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-back{position:relative;width:300px;height:150px;color:var(--ink)}
.d-back-screen{position:absolute;left:20px;top:14px;width:260px;height:104px;border:1px solid var(--line);border-radius:10px;background:var(--bg);overflow:hidden}
.d-back-under{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--faint)}
.d-back-edge{position:absolute;left:0;top:0;bottom:0;width:18px;z-index:2;cursor:ew-resize;touch-action:none}
.d-back-grip{position:absolute;left:7px;top:50%;width:1px;height:24px;margin-top:-12px;background:var(--line)}
.d-back-edge:focus-visible{outline:1px solid var(--ink);outline-offset:-2px}
.d-back-page{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;padding:10px 12px;background:var(--paper);border-left:1px solid var(--line);border-radius:10px;box-shadow:0 1px 0 var(--line);will-change:transform}
.d-back-page b{font-size:13px;font-weight:650}
.d-back-page em{font-style:normal;font-family:var(--mono);font-size:9px;letter-spacing:.04em;color:var(--faint)}
.d-back-ruler{position:absolute;left:20px;top:130px;width:260px;height:1px;background:var(--line)}
.d-back-fill{position:absolute;left:0;top:0;width:0;height:1px;background:#c2402a}
.d-back-tick{position:absolute;left:30%;top:-2px;width:1px;height:5px;background:var(--ink)}
.d-back-hint{position:absolute;left:20px;top:136px;margin:0;font-family:var(--mono);font-size:9px;line-height:1.6;color:var(--faint)}
</style>
</head>
<body>
<div class="pv-bar">
  <code>edge-swipe-back</code>
  <b>边缘右滑返回</b>
  <span>edge swipe</span>
  <span>分类 手势</span>
  <span>运动 物理</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<div class="d-back" role="group" aria-label="边缘右滑返回">
  <div class="d-back-screen">
    <span class="d-back-under">← 上一页</span>
    <div class="d-back-edge" tabindex="0" role="button" aria-label="从左边缘往右拖，或按右方向键返回"><i class="d-back-grip" aria-hidden="true"></i></div>
    <div class="d-back-page">
      <b>详情页</b>
      <em>从左边缘往右拖</em>
    </div>
  </div>
  <div class="d-back-ruler" aria-hidden="true"><i class="d-back-fill"></i><span class="d-back-tick"></span></div>
  <p class="d-back-hint">过 30% 才提交 · 30% 处有刻度</p>
</div>
</div>
<p class="pv-note">30% 是「划到这里心里已经决定要走」的位置：低于它松手算误触，高于它手指已经到屏幕中间，再弹回就显得很突兀。判定只在左边缘 18px 内起手，否则页面里正常的横向拖动会被当成返回，这一条是整条手势能不能用的关键。进度用 1px 的尺子加一根刻度表示，人在拖的时候需要知道「还差多少」，而不是一个百分比数字。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "edge-swipe-back";
  window.INITS = window.INITS || {};
  window.INITS["edge-swipe-back"] = (root => {
  const box = root.querySelector('.d-back');
  if (!box || box.dataset.ready) return;
  box.dataset.ready = '1';
  const page = box.querySelector('.d-back-page');
  const edge = box.querySelector('.d-back-edge');
  const fill = box.querySelector('.d-back-fill');
  const under = box.querySelector('.d-back-under');
  const hint = box.querySelector('.d-back-hint');
  const W = 260;
  const IDLE = '过 30% 才提交 · 30% 处有刻度';
  let x = 0, drag = null;

  function draw() {
    page.style.transform = 'translateX(' + x.toFixed(1) + 'px)';
    fill.style.width = Math.min(100, (x / W) * 100).toFixed(1) + '%';
  }
  function commit() {
    page.style.transition = 'transform .28s cubic-bezier(.34,1.56,.64,1)';
    x = W;
    draw();
    under.textContent = '已返回';
    hint.textContent = '已返回上一页 · 260px 一次走完';
    clearTimeout(box._t);
    box._t = setTimeout(() => {
      page.style.transition = 'none';
      x = 0;
      draw();
      under.textContent = '← 上一页';
      hint.textContent = IDLE;
    }, 280);
  }
  function reset() {
    page.style.transition = 'transform .28s cubic-bezier(.34,1.56,.64,1)';
    x = 0;
    draw();
    hint.textContent = IDLE;
  }
  function down(e) {
    if (drag) return;
    e.preventDefault();
    edge.focus({ preventScroll: true });
    edge.setPointerCapture(e.pointerId);
    page.style.transition = 'none';
    drag = { x0: e.clientX };
    x = 0;
    draw();
  }
  function move(e) {
    if (!drag) return;
    let dx = e.clientX - drag.x0;
    if (dx < 0) dx = dx * .2;
    x = Math.min(W, dx);
    draw();
    hint.textContent = x / W >= .3 ? '过 30% · 松手就返回' : '还差 ' + Math.round((.3 - x / W) * 100) + '% 才提交';
  }
  function up() {
    if (!drag) return;
    drag = null;
    if (x / W >= .3) commit(); else reset();
  }
  function key(e) {
    if (e.key === 'ArrowRight') { e.preventDefault(); commit(); }
    else if (e.key === 'ArrowLeft' || e.key === 'Escape') { e.preventDefault(); reset(); }
  }

  edge.addEventListener('pointerdown', down);
  edge.addEventListener('pointermove', move);
  edge.addEventListener('pointerup', up);
  edge.addEventListener('pointercancel', up);
  edge.addEventListener('keydown', key);
  draw();
});
  window.INITS["edge-swipe-back"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
