<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>热力格 · heatmap · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px solid var(--line);
  --border-strong:1px solid var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-heat{display:grid;grid-template-columns:repeat(12,10px);gap:3px}
.d-heat i{opacity:var(--o);width:10px;height:10px;border-radius:2px;background:var(--ink)}
</style>
</head>
<body>
<div class="pv-bar">
  <code>heatmap</code>
  <b>热力格</b>
  <span>heatmap</span>
  <span>分类 数据</span>
  <span>运动 无动效</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>

<div class="pv-stage" id="pv-stage">
<div class="d-heat"><i style="--o:0.1"></i><i style="--o:0.47"></i><i style="--o:0.84"></i><i style="--o:0.31"></i><i style="--o:0.68"></i><i style="--o:0.15"></i><i style="--o:0.52"></i><i style="--o:0.89"></i><i style="--o:0.36"></i><i style="--o:0.73"></i><i style="--o:0.2"></i><i style="--o:0.57"></i><i style="--o:0.94"></i><i style="--o:0.41"></i><i style="--o:0.78"></i><i style="--o:0.25"></i><i style="--o:0.62"></i><i style="--o:0.99"></i><i style="--o:0.46"></i><i style="--o:0.83"></i><i style="--o:0.3"></i><i style="--o:0.67"></i><i style="--o:0.14"></i><i style="--o:0.51"></i><i style="--o:0.88"></i><i style="--o:0.35"></i><i style="--o:0.72"></i><i style="--o:0.19"></i><i style="--o:0.56"></i><i style="--o:0.93"></i><i style="--o:0.4"></i><i style="--o:0.77"></i><i style="--o:0.24"></i><i style="--o:0.61"></i><i style="--o:0.98"></i><i style="--o:0.45"></i><i style="--o:0.82"></i><i style="--o:0.29"></i><i style="--o:0.66"></i><i style="--o:0.13"></i><i style="--o:0.5"></i><i style="--o:0.87"></i><i style="--o:0.34"></i><i style="--o:0.71"></i><i style="--o:0.18"></i><i style="--o:0.55"></i><i style="--o:0.92"></i><i style="--o:0.39"></i><i style="--o:0.76"></i><i style="--o:0.23"></i><i style="--o:0.6"></i><i style="--o:0.97"></i><i style="--o:0.44"></i><i style="--o:0.81"></i><i style="--o:0.28"></i><i style="--o:0.65"></i><i style="--o:0.12"></i><i style="--o:0.49"></i><i style="--o:0.86"></i><i style="--o:0.33"></i><i style="--o:0.7"></i><i style="--o:0.17"></i><i style="--o:0.54"></i><i style="--o:0.91"></i><i style="--o:0.38"></i><i style="--o:0.75"></i><i style="--o:0.22"></i><i style="--o:0.59"></i><i style="--o:0.96"></i><i style="--o:0.43"></i><i style="--o:0.8"></i><i style="--o:0.27"></i><i style="--o:0.64"></i><i style="--o:0.11"></i><i style="--o:0.48"></i><i style="--o:0.85"></i><i style="--o:0.32"></i><i style="--o:0.69"></i><i style="--o:0.16"></i><i style="--o:0.53"></i><i style="--o:0.9"></i><i style="--o:0.37"></i><i style="--o:0.74"></i><i style="--o:0.21"></i></div>
</div>
<p class="pv-note">密度型数据（每天活跃/提交量）；颜色要单调递进。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "heatmap";
  /* 本条没有 init（纯 CSS） */
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
