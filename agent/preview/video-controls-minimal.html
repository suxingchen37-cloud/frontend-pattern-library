<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>极简播放控件 · video-controls-minimal · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px solid var(--line);
  --border-strong:1px solid var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-vc{position:relative;width:100%;max-width:340px;border:1px solid var(--line);border-radius:10px;background:var(--paper);overflow:hidden;outline:none}
.d-vc:focus-visible{outline:1px solid var(--ink);outline-offset:2px}
.d-vc-frame{position:relative;display:flex;align-items:flex-end;justify-content:space-between;height:120px;padding:10px 12px;background:linear-gradient(150deg,color-mix(in srgb,var(--ink) 82%,var(--paper)),color-mix(in srgb,var(--ink) 55%,var(--paper)));color:var(--paper)}
.d-vc-frame span,.d-vc-frame em{font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;font-style:normal;opacity:.85}
.d-vc-bar{position:relative;height:6px;background:var(--line);cursor:pointer}
.d-vc-buf{position:absolute;left:0;top:0;bottom:0;width:62%;background:color-mix(in srgb,var(--ink) 18%,transparent)}
.d-vc-play{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--ink)}
.d-vc-row{display:flex;align-items:center;justify-content:space-between;padding:8px 12px}
.d-vc-toggle{width:30px;height:30px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink);font:inherit;font-size:11px;cursor:pointer}
.d-vc-row span{font-family:var(--font-mono);font-size:10px;color:var(--faint)}
</style>
</head>
<body>
<div class="pv-bar">
  <code>video-controls-minimal</code>
  <b>极简播放控件</b>
  <span>minimal player controls</span>
  <span>分类 媒体</span>
  <span>运动 机械</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<div class="d-vc" data-player tabindex="0"><div class="d-vc-frame"><span data-tc>00:00</span><em data-state>暂停</em></div><div class="d-vc-bar" data-bar><i class="d-vc-buf"></i><i class="d-vc-play" data-fill></i></div><div class="d-vc-row"><button type="button" class="d-vc-toggle" data-toggle aria-label="播放或暂停">▶</button><span data-total>00:42</span></div></div>
</div>
<p class="pv-note">一条进度条上画三层：已播、缓冲、总长。缓冲不画出来，加载时用户只会看到「卡住」。播放键只放在左下角一个，时长放右下角——控件越少，画面越像片子而不是网页。空格键也能播，是因为看片的人手本来就在键盘上。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "video-controls-minimal";
  window.INITS = window.INITS || {};
  window.INITS["video-controls-minimal"] = (root => {
  var box = root.querySelector('[data-player]');
  var fill = root.querySelector('[data-fill]');
  var tc = root.querySelector('[data-tc]');
  var st = root.querySelector('[data-state]');
  var btn = root.querySelector('[data-toggle]');
  var bar = root.querySelector('[data-bar]');
  if (!box || !fill || !bar) return;
  var dur = 42, t = 0, playing = false, timer = 0;
  var fmt = function (s) { return '00:' + (s < 10 ? '0' : '') + Math.floor(s); };
  var paint = function () { fill.style.width = (t / dur * 100).toFixed(2) + '%'; if (tc) tc.textContent = fmt(t); };
  var tick = function () { t = Math.min(dur, t + .25); paint(); if (t >= dur) pause(); };
  var play = function () { if (playing) return; playing = true; if (btn) btn.textContent = '❚❚'; if (st) st.textContent = '播放中'; timer = setInterval(tick, 250); };
  var pause = function () { playing = false; clearInterval(timer); if (btn) btn.textContent = '▶'; if (st) st.textContent = '暂停'; };
  if (btn) btn.addEventListener('click', function () { playing ? pause() : play(); });
  box.addEventListener('keydown', function (e) { if (e.key === ' ') { e.preventDefault(); playing ? pause() : play(); } });
  bar.addEventListener('pointerdown', function (e) { var r = bar.getBoundingClientRect(); t = Math.max(0, Math.min(dur, (e.clientX - r.left) / r.width * dur)); paint(); });
  paint();
});
  window.INITS["video-controls-minimal"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
