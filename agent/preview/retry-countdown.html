<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>可取消的重试等待 · retry-countdown · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px solid var(--line);
  --border-strong:1px solid var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-retry-countdown{width:100%;max-width:430px;min-width:0;color:var(--ink);font:inherit;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.d-retry-countdown *,.d-retry-countdown *::before,.d-retry-countdown *::after{box-sizing:border-box}
.d-retry-countdown [hidden]{display:none!important}
.d-retry-countdown .d-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0}
.d-retry-countdown .d-note{display:block;margin:8px 0 0;color:var(--muted);font-size:12px;min-height:1.5em}
.d-retry-countdown label{display:block;margin:8px 0}
.d-retry-countdown input,.d-retry-countdown select,.d-retry-countdown textarea,.d-retry-countdown button{font:inherit;color:inherit;max-width:100%;min-width:0}
.d-retry-countdown input:not([type=checkbox]):not([type=radio]),.d-retry-countdown select,.d-retry-countdown textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:var(--radius-control);background:var(--paper)}
.d-retry-countdown button{padding:6px 10px;border:1px solid var(--line);border-radius:var(--radius-control);background:var(--paper);cursor:pointer}
.d-retry-countdown button:disabled{opacity:.5;cursor:default}
.d-retry-countdown :focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.d-retry-countdown [aria-invalid=true]{border-color:var(--warn)!important}
.d-retry-countdown .d-scroll{max-width:100%;overflow:auto}
.d-retry-countdown table{width:100%;border-collapse:collapse;font-size:12px;text-align:left}
.d-retry-countdown th,.d-retry-countdown td{padding:7px;border-bottom:1px solid var(--line);vertical-align:top}
.d-retry-countdown caption{text-align:left;font-weight:600;margin-bottom:8px}
.d-retry-countdown progress{width:100%;accent-color:var(--ink)}
.d-retry-countdown pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}
.d-retry-countdown h3,.d-retry-countdown p{margin:8px 0}
.d-retry-countdown [aria-pressed=true],.d-retry-countdown [aria-selected=true]{border-color:var(--ink);font-weight:650}
.d-retry-countdown .d-grow{flex:1;min-width:100px}
.d-retry-countdown summary{cursor:pointer;padding:6px 0}
.d-retry-countdown ul,.d-retry-countdown ol{padding-left:24px}
</style>
</head>
<body>
<div class="pv-bar">
  <code>retry-countdown</code>
  <b>可取消的重试等待</b>
  <span>cancelable retry countdown</span>
  <span>分类 反馈</span>
  <span>运动 无动效</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<section class="d-retry-countdown" aria-label="可取消的重试等待"><p>本地演示：连接失败，等待后重试。</p><div class="d-row"><button data-start type="button">等待后重试</button><button data-cancel type="button" disabled>取消等待</button></div><output class="d-note" data-out role="status" aria-live="polite"></output></section>
</div>
<p class="pv-note">等待期间展示剩余时间并允许取消，防止用户反复点击产生多次重试。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "retry-countdown";
  window.INITS = window.INITS || {};
  window.INITS["retry-countdown"] = (root => {
 const q = selector => root.querySelector(selector);
 const qa = selector => [...root.querySelectorAll(selector)];
 const say = text => { const out = q('[data-out]'); if (out) out.textContent = text; };
 ((root,q,qa,say)=>{let timer=0;const idle=()=>{clearInterval(timer);timer=0;q('[data-start]').disabled=false;q('[data-cancel]').disabled=true;};q('[data-start]').onclick=()=>{if(timer)return;let left=3;q('[data-start]').disabled=true;q('[data-cancel]').disabled=false;say(left+' 秒后模拟重试');timer=setInterval(()=>{if(!root.isConnected){idle();return;}left--;if(left<=0){idle();say('模拟重试完成');}else say(left+' 秒后模拟重试');},1000);};q('[data-cancel]').onclick=()=>{idle();say('等待已取消，不会继续重试');};})(root, q, qa, say);
});
  window.INITS["retry-countdown"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
