<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>下拉关闭 · drag-to-close · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px solid var(--line);
  --border-strong:1px solid var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-dc{position:relative;width:100%;max-width:340px;height:190px;border:1px solid var(--line);border-radius:10px;background:var(--paper);overflow:hidden}
.d-dc-open{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink);font:inherit;font-size:11px;cursor:pointer}
.d-dc-scrim{position:absolute;inset:0;background:var(--ink);opacity:0;pointer-events:none;transition:opacity 180ms var(--ease)}
.d-dc-sheet{position:absolute;left:0;right:0;bottom:0;padding:8px 16px 16px;border-radius:10px 10px 0 0;background:var(--bg);border-top:1px solid var(--line);transform:translateY(105%);transition:transform 280ms var(--ease-physical);touch-action:none;cursor:grab}
.d-dc-sheet.on{transform:none}
.d-dc-grip{display:block;width:34px;height:4px;margin:0 auto 8px;border-radius:999px;background:var(--line)}
.d-dc-sheet b{font-size:13px}
.d-dc-sheet p{margin:2px 0 0;font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<div class="pv-bar">
  <code>drag-to-close</code>
  <b>下拉关闭</b>
  <span>drag to close</span>
  <span>分类 手势</span>
  <span>运动 物理</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<div class="d-dc" data-box><button type="button" class="d-dc-open" data-open>打开卡片</button><div class="d-dc-scrim" data-scrim></div><div class="d-dc-sheet" data-sheet><span class="d-dc-grip"></span><b>补充说明</b><p>往下拖可以关掉这张卡片。</p></div></div>
</div>
<p class="pv-note">弹层随手指往下走，背景同步变淡，松手时超过 1/4 高度才关：只有跟手的位移才让人相信「这是可以被推走的」。关的速度比开的快（180ms 对 280ms）——撤销总是应该比进入干脆。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "drag-to-close";
  window.INITS = window.INITS || {};
  window.INITS["drag-to-close"] = (root => {
  var sheet = root.querySelector('[data-sheet]');
  var scrim = root.querySelector('[data-scrim]');
  var open = root.querySelector('[data-open]');
  if (!sheet || !scrim || !open) return;
  var startY = 0, dy = 0, drag = false, H = 0;
  var setOpen = function (v) { sheet.style.transition = 'transform 280ms cubic-bezier(.34,1.56,.64,1)'; sheet.classList.toggle('on', v); scrim.style.opacity = v ? '.18' : '0'; };
  open.addEventListener('click', function () { setOpen(true); });
  sheet.addEventListener('pointerdown', function (e) { drag = true; startY = e.clientY; dy = 0; H = sheet.offsetHeight; sheet.style.transition = 'none'; sheet.setPointerCapture(e.pointerId); });
  sheet.addEventListener('pointermove', function (e) {
    if (!drag) return;
    dy = Math.max(0, e.clientY - startY);
    sheet.style.transform = 'translateY(' + dy.toFixed(1) + 'px)';
    scrim.style.opacity = String(Math.max(0, .18 * (1 - dy / H)));
  });
  var end = function () {
    if (!drag) return;
    drag = false;
    sheet.style.transition = 'transform 180ms cubic-bezier(.2,.75,.25,1)';
    if (dy > H * .25) { sheet.style.transform = 'translateY(105%)'; sheet.classList.remove('on'); scrim.style.opacity = '0'; }
    else { sheet.style.transform = ''; scrim.style.opacity = '.18'; setTimeout(function () { sheet.style.transition = 'transform 280ms cubic-bezier(.34,1.56,.64,1)'; }, 200); }
  };
  sheet.addEventListener('pointerup', end);
  sheet.addEventListener('pointercancel', end);
});
  window.INITS["drag-to-close"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
