<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>边缘窥视 · edge-peek · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px solid var(--line);
  --border-strong:1px solid var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-ep{position:relative;width:100%;max-width:340px;height:190px;border:1px solid var(--line);border-radius:10px;background:var(--bg);overflow:hidden;touch-action:pan-y}
.d-ep-page{position:relative;z-index:2;height:100%;padding:16px;background:var(--paper);border-right:1px solid var(--line);will-change:transform;transition:transform 260ms var(--ease-physical)}
.d-ep-page b,.d-ep-under b{display:block;font-size:13px}
.d-ep-page span,.d-ep-under span{font-size:11px;color:var(--muted)}
.d-ep-under{position:absolute;inset:0;padding:16px;background:var(--bg);z-index:1}
.d-ep-edge{position:absolute;left:0;top:0;bottom:0;width:26px;z-index:3;cursor:ew-resize}
.d-ep-hint{position:absolute;right:10px;bottom:8px;margin:0;font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;color:var(--faint);z-index:4}
</style>
</head>
<body>
<div class="pv-bar">
  <code>edge-peek</code>
  <b>边缘窥视</b>
  <span>edge peek</span>
  <span>分类 手势</span>
  <span>运动 物理</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<div class="d-ep" data-peek><div class="d-ep-page"><b>当前页</b><span>场记本 · 第 12 天</span></div><div class="d-ep-under" data-under><b>上一页</b><span>场记本 · 第 11 天</span></div><div class="d-ep-edge" data-edge></div><p class="d-ep-hint">从左边缘往里拉</p></div>
</div>
<p class="pv-note">从屏幕左缘往里拉会露出上一页的一角，松手弹回；拉过 40% 才真的返回。只露出一角、不整页跟手，是为了让人随时能放弃——整页跟手时，手一抖就回不去了。右缘不做，避免和系统手势打架。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "edge-peek";
  window.INITS = window.INITS || {};
  window.INITS["edge-peek"] = (root => {
  var box = root.querySelector('[data-peek]');
  var page = box && box.querySelector('.d-ep-page');
  var edge = box && box.querySelector('[data-edge]');
  if (!box || !page || !edge) return;
  var startX = 0, dx = 0, drag = false, w = 0;
  edge.addEventListener('pointerdown', function (e) { drag = true; startX = e.clientX; dx = 0; w = box.clientWidth; page.style.transition = 'none'; edge.setPointerCapture(e.pointerId); });
  edge.addEventListener('pointermove', function (e) { if (!drag) return; dx = Math.max(0, Math.min(w, e.clientX - startX)); page.style.transform = 'translateX(' + dx.toFixed(1) + 'px)'; });
  var end = function () { if (!drag) return; drag = false; page.style.transition = 'transform 260ms cubic-bezier(.34,1.56,.64,1)'; page.style.transform = dx > w * .4 ? 'translateX(' + w + 'px)' : 'none'; setTimeout(function () { page.style.transition = 'none'; page.style.transform = 'none'; void page.offsetWidth; page.style.transition = 'transform 260ms cubic-bezier(.34,1.56,.64,1)'; }, 300); };
  edge.addEventListener('pointerup', end);
  edge.addEventListener('pointercancel', end);
});
  window.INITS["edge-peek"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
