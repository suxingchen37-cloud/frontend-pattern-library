<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>卡片翻面 · card-flip-3d · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px var(--line);
  --border-strong:1px var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-cf3d{position:relative;box-sizing:border-box;width:300px;max-width:100%;height:148px;padding:0;border:0;background:none;font:inherit;color:inherit;text-align:left;perspective:900px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.d-cf3d-in{position:absolute;inset:0;display:block;transform-style:preserve-3d;transition:transform 280ms cubic-bezier(.34,1.56,.64,1)}
.d-cf3d-on .d-cf3d-in{transform:rotateY(180deg)}
.d-cf3d-face{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:12px 16px;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;background:var(--paper);box-shadow:inset 0 1px 0 #fff5;backface-visibility:hidden}
.d-cf3d-back{transform:rotateY(180deg);gap:2px}
.d-cf3d-k{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;color:var(--faint);text-transform:uppercase}
.d-cf3d-name{font-size:21px;font-weight:650;letter-spacing:-.01em;color:var(--ink)}
.d-cf3d-note{font-size:11px;color:var(--muted)}
.d-cf3d-row{display:flex;justify-content:space-between;gap:8px;padding:2px 0;border-bottom:1px solid var(--line);font-size:11px}
.d-cf3d-row:last-child{border-bottom:0}
.d-cf3d-v{font-family:var(--font-mono);color:var(--ink)}
.d-cf3d:focus-visible{outline:1px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<div class="pv-bar">
  <code>card-flip-3d</code>
  <b>卡片翻面</b>
  <span>card flip</span>
  <span>分类 3D 与透视</span>
  <span>运动 物理</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<button type="button" class="d-cf3d" aria-pressed="false" aria-label="卡片翻面：正面看名称，背面看参数"><span class="d-cf3d-in"><span class="d-cf3d-face"><span class="d-cf3d-k">规格 · spec</span><span class="d-cf3d-name">卡片 A</span><span class="d-cf3d-note">点一下，背面是参数表</span></span><span class="d-cf3d-face d-cf3d-back"><span class="d-cf3d-row"><span class="d-cf3d-k">尺寸</span><span class="d-cf3d-v">300 × 148</span></span><span class="d-cf3d-row"><span class="d-cf3d-k">圆角</span><span class="d-cf3d-v">10</span></span><span class="d-cf3d-row"><span class="d-cf3d-k">翻面</span><span class="d-cf3d-v">280ms</span></span></span></span></button>
</div>
<p class="pv-note">翻面用 280ms：180° 要让眼睛看清「转的是同一张卡」，再短只剩闪一下，900ms 又会两面叠在半途、分不清哪面是新的。参数表放背面，因为翻面这个动作已经说明是同一张卡的另一面，不必再换位置。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "card-flip-3d";
  window.INITS = window.INITS || {};
  window.INITS["card-flip-3d"] = (root => {
  const box = root.querySelector('.d-cf3d');
  if (!box) return;
  box.onclick = () => {
    const on = !box.classList.contains('d-cf3d-on');
    box.classList.toggle('d-cf3d-on', on);
    box.setAttribute('aria-pressed', on ? 'true' : 'false');
  };
});
  window.INITS["card-flip-3d"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
