<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>可转立体图表 · orbit-chart · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px solid var(--line);
  --border-strong:1px solid var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-oc-stage{position:relative;width:100%;max-width:340px;padding:8px 0 0;border:1px solid var(--line);border-radius:10px;background:var(--bg);overflow:hidden;touch-action:none;cursor:grab}
.d-oc-stage.d-oc-drag{cursor:grabbing}
.d-oc-scene{position:relative;height:172px;margin:0 auto;width:220px;transform-style:preserve-3d;transform:rotateX(58deg) rotateZ(-40deg) translateZ(-18px);will-change:transform}
.d-oc-floor{position:absolute;left:0;bottom:0;width:200px;height:120px;background-image:repeating-linear-gradient(0deg,var(--line) 0 1px,transparent 1px 24px),repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 24px);opacity:.9}
.d-oc-bar{position:absolute;bottom:0;left:calc(var(--i) * 38px + 12px);width:20px;height:var(--h);border-radius:2px 2px 0 0;background:var(--ink);transform:translateZ(0);transform-origin:50% 100%}
.d-oc-bar:nth-child(odd){background:var(--ink-vermilion)}
.d-oc-note{margin:4px 0 8px;text-align:center;font-family:var(--font-mono);font-size:9px;letter-spacing:.08em;color:var(--faint)}
</style>
</head>
<body>
<div class="pv-bar">
  <code>orbit-chart</code>
  <b>可转立体图表</b>
  <span>orbit chart</span>
  <span>分类 3D 与透视</span>
  <span>运动 物理</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<div class="d-oc-stage" aria-label="立体柱状图：拖动可以换角度"><div class="d-oc-scene"><div class="d-oc-floor"></div><div class="d-oc-bar" style="--h:58px;--i:0"></div><div class="d-oc-bar" style="--h:92px;--i:1"></div><div class="d-oc-bar" style="--h:38px;--i:2"></div><div class="d-oc-bar" style="--h:74px;--i:3"></div><div class="d-oc-bar" style="--h:47px;--i:4"></div></div><p class="d-oc-note">拖动换角度 · 单位：次</p></div>
</div>
<p class="pv-note">柱子高度直接写进每根自己的变量里，换数据只改数字，不用动布局；地面网格给 5 格是为了让眼睛有刻度，不给格子就只能看个大概。拖到侧面时后排柱子会被前排挡住一点，这是真三维该有的遮挡，不是 bug——反过来，如果完全不遮，说明只是在斜切一张平面图。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "orbit-chart";
  window.INITS = window.INITS || {};
  window.INITS["orbit-chart"] = (root => {
  const stage = root.querySelector('.d-oc-stage');
  if (!stage) return;
  const scene = stage.querySelector('.d-oc-scene');
  if (!scene) return;
  let rz = -40, rx = 58, drag = null, vx = 0, vy = 0, raf = 0, live = false;
  const apply = () => { scene.style.transform = 'rotateX(' + rx.toFixed(2) + 'deg) rotateZ(' + rz.toFixed(2) + 'deg) translateZ(-18px)'; };
  const tick = () => {
    if (!live) return;
    if (!drag) { rz += vx; rx += vy; vx *= 0.93; vy *= 0.93; if (Math.abs(vx) < 0.01) vx = 0; if (Math.abs(vy) < 0.01) vy = 0; rx = Math.max(30, Math.min(76, rx)); apply(); }
    if (drag || vx || vy) raf = requestAnimationFrame(tick); else live = false;
  };
  const start = () => { if (!live) { live = true; raf = requestAnimationFrame(tick); } };
  stage.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; stage.classList.add('d-oc-drag'); stage.setPointerCapture(e.pointerId); vx = vy = 0; });
  stage.addEventListener('pointermove', e => {
    if (!drag) return;
    rz += (e.clientX - drag.x) * 0.4;
    rx = Math.max(30, Math.min(76, rx - (e.clientY - drag.y) * 0.25));
    vx = (e.clientX - drag.x) * 0.06; vy = -(e.clientY - drag.y) * 0.04;
    drag = { x: e.clientX, y: e.clientY };
    apply(); start();
  });
  const release = () => { drag = null; stage.classList.remove('d-oc-drag'); start(); };
  stage.addEventListener('pointerup', release);
  stage.addEventListener('pointercancel', release);
  apply();
});
  window.INITS["orbit-chart"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
