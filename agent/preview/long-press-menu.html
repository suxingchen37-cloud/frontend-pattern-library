<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>长按菜单 · long-press-menu · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px var(--line);
  --border-strong:1px var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-press{position:relative;width:300px;height:150px;color:var(--ink)}
.d-press-card{position:absolute;left:12px;top:16px;width:150px;height:96px;display:flex;flex-direction:column;justify-content:space-between;padding:10px;background:var(--ink);color:var(--bg);border:1px solid var(--ink);border-radius:10px;overflow:hidden;cursor:pointer;touch-action:none;user-select:none;transition:transform .12s linear}
.d-press-card b{font-size:15px;line-height:1.2;font-weight:650}
.d-press-card em{font-style:normal;font-family:var(--mono);font-size:9px;letter-spacing:.04em;color:var(--faint)}
.d-press-card[data-hold]{transform:scale(.985)}
.d-press-card:focus-visible{outline:1px solid var(--ink);outline-offset:2px}
.d-press-bar{position:absolute;left:0;bottom:0;width:0;height:1px;background:#e8c34a}
.d-press-menu{position:absolute;left:150px;top:26px;width:132px;display:flex;flex-direction:column;gap:1px;padding:4px;background:var(--paper);border:1px solid var(--ink);border-radius:6px;box-shadow:0 12px 24px -8px #20241e26;transform-origin:0 0;opacity:0;transform:translateX(-6px) scale(.96);pointer-events:none;transition:opacity .18s cubic-bezier(.34,1.56,.64,1),transform .18s cubic-bezier(.34,1.56,.64,1)}
.d-press-menu[data-open]{opacity:1;transform:translateX(0) scale(1);pointer-events:auto}
.d-press-item{border:0;background:transparent;color:var(--ink);font-family:inherit;font-size:11px;line-height:1.4;text-align:left;padding:6px 8px;border-radius:2px;cursor:pointer}
.d-press-item:hover{background:var(--bg)}
.d-press-item:focus-visible{outline:1px solid var(--ink);outline-offset:-1px}
.d-press-danger{color:#c2402a}
.d-press-hint{position:absolute;left:12px;bottom:6px;margin:0;font-family:var(--mono);font-size:9px;letter-spacing:.04em;color:var(--faint)}
</style>
</head>
<body>
<div class="pv-bar">
  <code>long-press-menu</code>
  <b>长按菜单</b>
  <span>long press</span>
  <span>分类 手势</span>
  <span>运动 物理</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<div class="d-press" role="group" aria-label="长按菜单">
  <div class="d-press-card" tabindex="0" role="button" aria-haspopup="menu" aria-expanded="false">
    <b>按住 420ms</b>
    <em>移动超过 8px 即取消</em>
    <i class="d-press-bar" aria-hidden="true"></i>
  </div>
  <div class="d-press-menu" role="menu" aria-hidden="true" aria-label="卡片操作">
    <button class="d-press-item" type="button" role="menuitem" tabindex="-1">重命名</button>
    <button class="d-press-item" type="button" role="menuitem" tabindex="-1">复制链接</button>
    <button class="d-press-item d-press-danger" type="button" role="menuitem" tabindex="-1">归档</button>
  </div>
  <p class="d-press-hint">按住 420ms 或 Enter 呼出</p>
</div>
</div>
<p class="pv-note">按 420ms：300ms 会被滑动起步的惯性误触，500ms 又像卡顿；比 iOS 的 400ms 多 20ms，是因为这里同时画一条走满才弹的进度线，线到 420ms 刚好走完，两条时间轴合得上。移动超过 8px 立刻取消——长按和拖动只能二选一，否则手指一抖两件事都做一半。整块主墨也是故意的：420ms 的停留需要一个实心面来承重，描边卡撑不住这个时长，本组只此一处大色块。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "long-press-menu";
  window.INITS = window.INITS || {};
  window.INITS["long-press-menu"] = (root => {
  const box = root.querySelector('.d-press');
  if (!box || box.dataset.ready) return;
  box.dataset.ready = '1';
  const card = box.querySelector('.d-press-card');
  const menu = box.querySelector('.d-press-menu');
  const bar = box.querySelector('.d-press-bar');
  const hint = box.querySelector('.d-press-hint');
  const items = [].slice.call(box.querySelectorAll('.d-press-item'));
  const HOLD = 420, MOVE = 8;
  const IDLE = '按住 420ms 或 Enter 呼出';
  let timer = 0, raf = 0, t0 = 0, sx = 0, sy = 0, holding = false, cur = 0;

  function progress() {
    const p = Math.min(1, (performance.now() - t0) / HOLD);
    bar.style.width = (p * 100).toFixed(1) + '%';
    if (p < 1 && holding) raf = requestAnimationFrame(progress);
  }
  function stopHold() {
    holding = false;
    clearTimeout(timer);
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    delete card.dataset.hold;
    bar.style.width = '0%';
  }
  function open() {
    stopHold();
    menu.dataset.open = '1';
    menu.setAttribute('aria-hidden', 'false');
    card.setAttribute('aria-expanded', 'true');
    items.forEach(b => b.tabIndex = 0);
    bar.style.width = '100%';
    hint.textContent = '方向键选 · Esc 关';
    cur = 0;
    items[0].focus({ preventScroll: true });
  }
  function close(refocus) {
    if (!menu.dataset.open) return;
    delete menu.dataset.open;
    menu.setAttribute('aria-hidden', 'true');
    card.setAttribute('aria-expanded', 'false');
    items.forEach(b => b.tabIndex = -1);
    bar.style.width = '0%';
    hint.textContent = IDLE;
    if (refocus) card.focus({ preventScroll: true });
  }
  function down(e) {
    if (menu.dataset.open) { close(true); return; }
    holding = true;
    sx = e.clientX; sy = e.clientY; t0 = performance.now();
    card.dataset.hold = '1';
    hint.textContent = '正在长按…移动 8px 就取消';
    timer = setTimeout(open, HOLD);
    raf = requestAnimationFrame(progress);
  }
  function move(e) {
    if (!holding) return;
    if (Math.hypot(e.clientX - sx, e.clientY - sy) > MOVE) {
      stopHold();
      hint.textContent = '已取消 · 移动超过 8px';
      clearTimeout(box._t2);
      box._t2 = setTimeout(() => { hint.textContent = IDLE; }, 900);
    }
  }
  function cardKey(e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      if (menu.dataset.open) close(true); else open();
    } else if (e.key === 'Escape') {
      close(true);
    }
  }
  function menuKey(e) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      cur = (cur + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      items[cur].focus({ preventScroll: true });
    } else if (e.key === 'Escape') {
      e.preventDefault();
      close(true);
    } else if (e.key === 'Tab') {
      close(false);
    }
  }
  function outside(e) {
    if (!menu.dataset.open) return;
    if (card.contains(e.target) || menu.contains(e.target)) return;
    close(false);
  }

  card.addEventListener('pointerdown', down);
  card.addEventListener('pointermove', move);
  card.addEventListener('pointerup', () => { if (!menu.dataset.open) stopHold(); });
  card.addEventListener('pointercancel', stopHold);
  card.addEventListener('pointerleave', () => { if (holding) stopHold(); });
  card.addEventListener('keydown', cardKey);
  menu.addEventListener('keydown', menuKey);
  items.forEach((b, i) => {
    b.addEventListener('focus', () => { cur = i; });
    b.addEventListener('click', () => {
      hint.textContent = '选了「' + b.textContent + '」';
      close(true);
    });
  });
  root.addEventListener('pointerdown', outside);
});
  window.INITS["long-press-menu"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
