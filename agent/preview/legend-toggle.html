<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>图例联动 · legend-toggle · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px solid var(--line);
  --border-strong:1px solid var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-lt2{width:100%;max-width:340px}
.d-lt2-legend{display:flex;gap:8px;margin-bottom:4px}
.d-lt2-legend button{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink);font:inherit;font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;cursor:pointer}
.d-lt2-legend button[aria-pressed="false"]{color:var(--faint);text-decoration:line-through}
.d-lt2-legend i{width:10px;height:2px;display:block;background:var(--ink)}
.d-lt2-legend button:nth-child(2) i{background:var(--ink-vermilion)}
.d-lt2-legend button:nth-child(3) i{background:var(--ink-indigo)}
.d-lt2-svg{display:block;width:100%;height:auto;overflow:visible}
.d-lt2-axis{stroke:var(--line);stroke-width:1}
.d-lt2-line{fill:none;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round;transition:opacity 180ms var(--ease-print)}
.d-lt2-s0{stroke:var(--ink)}
.d-lt2-s1{stroke:var(--ink-vermilion)}
.d-lt2-s2{stroke:var(--ink-indigo)}
.d-lt2-off{opacity:.12}
</style>
</head>
<body>
<div class="pv-bar">
  <code>legend-toggle</code>
  <b>图例联动</b>
  <span>legend toggle</span>
  <span>分类 图表</span>
  <span>运动 印刷</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<div class="d-lt2"><div class="d-lt2-legend"><button type="button" data-k="0" aria-pressed="true"><i></i>访问</button><button type="button" data-k="1" aria-pressed="true"><i></i>注册</button><button type="button" data-k="2" aria-pressed="true"><i></i>付费</button></div><svg class="d-lt2-svg" viewBox="0 0 320 170" role="img" aria-label="三条趋势线的图例开关"></svg></div>
</div>
<p class="pv-note">点图例关掉一条线，纵轴不跟着缩：一缩，剩下的线立刻被拉高，看起来像涨了，其实是删了数据。关掉的那条在图例上留一道删除线，随时能点回来——图例既是开关，也是当前状态的记录。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "legend-toggle";
  window.INITS = window.INITS || {};
  window.INITS["legend-toggle"] = (root => {
  const svg = root.querySelector('.d-lt2-svg');
  const btns = [...root.querySelectorAll('[data-k]')];
  if (!svg || !btns.length) return;
  const series = [[30, 38, 35, 48, 44, 57, 62], [12, 15, 14, 19, 22, 21, 26], [4, 5, 7, 6, 9, 11, 13]];
  const W = 320, H = 170, L = 26, R = 8, T = 14, B = 26;
  const n = series[0].length, max = 70;
  const x = i => L + i * (W - L - R) / (n - 1);
  const y = v => T + (H - T - B) * (1 - v / max);
  const NS = 'http://www.w3.org/2000/svg';
  const mk = (tag, attrs) => { const el = document.createElementNS(NS, tag); for (const k in attrs) el.setAttribute(k, attrs[k]); return el; };
  for (let g = 0; g <= 3; g++) svg.appendChild(mk('line', { class: 'd-lt2-axis', x1: L, y1: T + (H - T - B) * g / 3, x2: W - R, y2: T + (H - T - B) * g / 3 }));
  const paths = series.map((s, si) => {
    const d = s.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
    const p = mk('path', { class: 'd-lt2-line d-lt2-s' + si, d: d });
    svg.appendChild(p);
    return p;
  });
  btns.forEach(b => {
    b.onclick = () => {
      const on = b.getAttribute('aria-pressed') === 'true';
      b.setAttribute('aria-pressed', on ? 'false' : 'true');
      paths[Number(b.dataset.k)].classList.toggle('d-lt2-off', on);
    };
  });
});
  window.INITS["legend-toggle"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
