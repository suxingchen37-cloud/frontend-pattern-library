<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>折线趋势 · line-chart · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px solid var(--line);
  --border-strong:1px solid var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-lc{position:relative;width:100%;max-width:340px}
.d-lc-svg{display:block;width:100%;height:auto;overflow:visible}
.d-lc-axis{stroke:var(--line);stroke-width:1}
.d-lc-label{fill:var(--faint);font-family:var(--font-mono);font-size:7px;letter-spacing:.06em}
.d-lc-line{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.d-lc-dot{fill:var(--paper);stroke:var(--ink);stroke-width:1.5;opacity:0}
.d-lc-dot.on{opacity:1}
.d-lc-cross{stroke:var(--line);stroke-width:1;stroke-dasharray:2 3;opacity:0}
.d-lc-cross.on{opacity:1}
.d-lc-val{fill:var(--ink);font-size:11px;font-weight:650}
.d-lc-note{margin:6px 0 0;font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;color:var(--faint)}
</style>
</head>
<body>
<div class="pv-bar">
  <code>line-chart</code>
  <b>折线趋势</b>
  <span>line chart</span>
  <span>分类 图表</span>
  <span>运动 机械</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<div class="d-lc"><svg class="d-lc-svg" viewBox="0 0 320 170" role="img" aria-label="月度访问量折线图，共 12 个月"></svg><p class="d-lc-note">悬停看每月读数</p></div>
</div>
<p class="pv-note">12 个月只留 4 个横轴标签：每月都标，字会挤成一片，反而看不出趋势。悬停时十字线吸附到最近的点而不是跟着鼠标飘——读数要落在真实数据上，落在两点之间就是假数据。线用 1.5px，网格 1px 且压到很淡：图是主角，不是网格。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "line-chart";
  window.INITS = window.INITS || {};
  window.INITS["line-chart"] = (root => {
  const svg = root.querySelector('.d-lc-svg');
  if (!svg) return;
  const data = [32, 41, 38, 52, 47, 61, 58, 72, 68, 79, 88, 96];
  const months = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const W = 320, H = 170, L = 26, R = 8, T = 18, B = 26;
  const max = 100, min = 0;
  const x = i => L + i * (W - L - R) / (data.length - 1);
  const y = v => T + (H - T - B) * (1 - (v - min) / (max - min));
  const NS = 'http://www.w3.org/2000/svg';
  const mk = (tag, attrs) => { const el = document.createElementNS(NS, tag); for (const k in attrs) el.setAttribute(k, attrs[k]); return el; };
  for (let g = 0; g <= 4; g++) {
    const gy = T + (H - T - B) * g / 4;
    svg.appendChild(mk('line', { class: 'd-lc-axis', x1: L, y1: gy, x2: W - R, y2: gy }));
    const t = mk('text', { class: 'd-lc-label', x: 0, y: gy + 2.5 });
    t.textContent = String(100 - g * 25);
    svg.appendChild(t);
  }
  const d = data.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
  svg.appendChild(mk('path', { class: 'd-lc-line', d: d }));
  months.forEach((m, i) => { if (i % 3 !== 0) return; const t = mk('text', { class: 'd-lc-label', x: x(i), y: H - 8, 'text-anchor': 'middle' }); t.textContent = m; svg.appendChild(t); });
  const cross = mk('line', { class: 'd-lc-cross', x1: 0, y1: T, x2: 0, y2: H - B });
  svg.appendChild(cross);
  const dots = data.map((v, i) => { const c = mk('circle', { class: 'd-lc-dot', cx: x(i), cy: y(v), r: 3.5 }); svg.appendChild(c); return c; });
  const val = mk('text', { class: 'd-lc-val', x: 0, y: 0 });
  svg.appendChild(val);
  const move = e => {
    const box = svg.getBoundingClientRect();
    const px = (e.clientX - box.left) / box.width * W;
    let idx = Math.round((px - L) / ((W - L - R) / (data.length - 1)));
    idx = Math.max(0, Math.min(data.length - 1, idx));
    dots.forEach((c, i) => c.classList.toggle('on', i === idx));
    cross.classList.add('on');
    cross.setAttribute('x1', x(idx)); cross.setAttribute('x2', x(idx));
    val.textContent = months[idx] + ' · ' + data[idx];
    val.setAttribute('x', Math.min(W - 60, Math.max(L, x(idx) - 22)));
    val.setAttribute('y', Math.max(12, y(data[idx]) - 8));
  };
  svg.addEventListener('pointermove', move);
  svg.addEventListener('pointerleave', () => { dots.forEach(c => c.classList.remove('on')); cross.classList.remove('on'); val.textContent = ''; });
});
  window.INITS["line-chart"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
