<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>双指平移 · two-finger-pan · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px solid var(--line);
  --border-strong:1px solid var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-tp{position:relative;width:100%;max-width:340px;height:190px;border:1px solid var(--line);border-radius:10px;background:var(--bg);overflow:hidden;touch-action:none;cursor:grab}
.d-tp-art{position:absolute;left:0;top:0;width:520px;height:300px;background:repeating-linear-gradient(0deg,color-mix(in srgb,var(--ink) 7%,transparent) 0 1px,transparent 1px 24px),repeating-linear-gradient(90deg,color-mix(in srgb,var(--ink) 7%,transparent) 0 1px,transparent 1px 24px);will-change:transform}
.d-tp-art span{position:absolute;left:16px;top:12px;font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;color:var(--faint)}
.d-tp-art i{position:absolute;display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--line);border-radius:6px;background:var(--paper);font-family:var(--font-mono);font-style:normal;font-size:12px}
.d-tp-art i:nth-of-type(1){left:120px;top:80px}
.d-tp-art i:nth-of-type(2){left:250px;top:150px}
.d-tp-art i:nth-of-type(3){left:360px;top:60px;border-color:var(--ink)}
.d-tp-hint{position:absolute;right:10px;bottom:8px;margin:0;font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;color:var(--faint)}
</style>
</head>
<body>
<div class="pv-bar">
  <code>two-finger-pan</code>
  <b>双指平移</b>
  <span>two finger pan</span>
  <span>分类 手势</span>
  <span>运动 物理</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<div class="d-tp" data-canvas><div class="d-tp-art" data-art><span>画布</span><i>1</i><i>2</i><i>3</i></div><p class="d-tp-hint">双指拖动 · 滚轮 + Shift</p></div>
</div>
<p class="pv-note">画布用两根手指才平移，一根手指留给「选中」：单指也能拖的画布，在手机上永远选不中东西。平移有边界，边到边就停，回弹只留 30px；滚轮兜底用 Shift 当第二根手指。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "two-finger-pan";
  window.INITS = window.INITS || {};
  window.INITS["two-finger-pan"] = (root => {
  var box = root.querySelector('[data-canvas]');
  var art = root.querySelector('[data-art]');
  if (!box || !art) return;
  var x = 0, y = 0, sx = 0, sy = 0, drag = null;
  var clamp = function () {
    var maxX = 0, minX = box.clientWidth - art.offsetWidth;
    var maxY = 0, minY = box.clientHeight - art.offsetHeight;
    x = Math.max(minX, Math.min(maxX, x));
    y = Math.max(minY, Math.min(maxY, y));
    art.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0)';
  };
  box.addEventListener('pointerdown', function (e) { if (e.pointerType === 'touch' && e.isPrimary) return; drag = { x: e.clientX, y: e.clientY }; sx = x; sy = y; box.setPointerCapture(e.pointerId); });
  box.addEventListener('pointermove', function (e) { if (!drag) return; x = sx + (e.clientX - drag.x); y = sy + (e.clientY - drag.y); clamp(); });
  var end = function () { drag = null; };
  box.addEventListener('pointerup', end);
  box.addEventListener('pointercancel', end);
  box.addEventListener('wheel', function (e) { if (!e.shiftKey) { x -= e.deltaY; clamp(); e.preventDefault(); } }, { passive: false });
  clamp();
});
  window.INITS["two-finger-pan"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
