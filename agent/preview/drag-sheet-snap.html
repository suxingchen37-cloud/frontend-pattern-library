<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>抽屉分档 · drag-sheet-snap · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px solid var(--line);
  --border-strong:1px solid var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-ds2{position:relative;width:100%;max-width:340px;height:190px;border:1px solid var(--line);border-radius:10px;background:var(--paper);overflow:hidden}
.d-ds2-open{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink);font:inherit;font-size:11px;cursor:pointer}
.d-ds2-sheet{position:absolute;left:0;right:0;bottom:0;height:150px;padding:8px 14px 14px;border-top:1px solid var(--line);border-radius:10px 10px 0 0;background:var(--bg);transform:translateY(102px);transition:transform 280ms var(--ease-physical);touch-action:none;cursor:grab;will-change:transform}
.d-ds2-grip{display:block;width:34px;height:4px;border-radius:999px;background:var(--line);margin:0 auto 8px}
.d-ds2-sheet b{font-size:12px}
.d-ds2-sheet p{margin:2px 0 0;font-size:11px;color:var(--muted)}
.d-ds2-sheet em{position:absolute;right:14px;bottom:10px;font-style:normal;font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;color:var(--faint)}
</style>
</head>
<body>
<div class="pv-bar">
  <code>drag-sheet-snap</code>
  <b>抽屉分档</b>
  <span>drag sheet snap</span>
  <span>分类 手势</span>
  <span>运动 物理</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<div class="d-ds2" data-wrap><button type="button" class="d-ds2-open" data-open>打开抽屉</button><div class="d-ds2-sheet" data-sheet><span class="d-ds2-grip"></span><b>这一场的信息</b><p>机位 B，50mm，14:22:07 打板。缺 38 秒，已标在素材页。</p><em data-state>peek</em></div></div>
</div>
<p class="pv-note">抽屉只停三档：露头、半屏、全屏。档位固定，是因为自由高度会让每次打开都要重新找位置；松手后按「离哪档近 + 甩的方向」决定落到哪，甩得够快时方向比距离更重要。拖到最上面再往上不再动，但会有 24px 的阻尼，告诉你到头了。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "drag-sheet-snap";
  window.INITS = window.INITS || {};
  window.INITS["drag-sheet-snap"] = (root => {
  var sheet = root.querySelector('[data-sheet]');
  var open = root.querySelector('[data-open]');
  var state = root.querySelector('[data-state]');
  if (!sheet || !open) return;
  var H = 150, peaks = [102, 52, 0], idx = 0;
  var startY = 0, startT = 0, base = 102, y = 102, dragging = false;
  var apply = function (v, anim) { y = v; sheet.style.transition = anim ? 'transform 280ms cubic-bezier(.34,1.56,.64,1)' : 'none'; sheet.style.transform = 'translateY(' + v + 'px)'; if (state) state.textContent = v === peaks[0] ? 'peek' : v === peaks[1] ? 'half' : 'full'; };
  var nearest = function (v) { var best = 0; peaks.forEach(function (p, i) { if (Math.abs(p - v) < Math.abs(peaks[best] - v)) best = i; }); return best; };
  sheet.addEventListener('pointerdown', function (e) { dragging = true; startY = e.clientY; startT = Date.now(); base = y; sheet.setPointerCapture(e.pointerId); });
  sheet.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var d = e.clientY - startY;
    var v = base + d;
    if (v < 0) v = v * .25;
    if (v > peaks[0]) v = peaks[0] + (v - peaks[0]) * .3;
    apply(v, false);
  });
  var end = function () { if (!dragging) return; dragging = false; var v = (y - base) / Math.max(1, Date.now() - startT); var i = nearest(y); if (Math.abs(v) > .5) i = Math.max(0, Math.min(2, i + (v > 0 ? 1 : -1))); idx = i; apply(peaks[idx], true); };
  sheet.addEventListener('pointerup', end);
  sheet.addEventListener('pointercancel', end);
  open.addEventListener('click', function () { idx = Math.min(2, idx + 1); apply(peaks[idx], true); });
  apply(102, false);
});
  window.INITS["drag-sheet-snap"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
