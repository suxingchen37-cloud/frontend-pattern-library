<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>媒体加载失败 · media-error-retry · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px solid var(--line);
  --border-strong:1px solid var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-mer{width:100%;max-width:340px;border:1px solid var(--line);border-radius:10px;background:var(--paper);overflow:hidden}
.d-mer-frame{position:relative;height:130px}
.d-mer-ok{position:absolute;inset:0;display:flex;align-items:flex-end;padding:10px;background:color-mix(in srgb,var(--ink) 68%,var(--paper));color:var(--paper)}
.d-mer-ok span{font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;opacity:.85}
.d-mer-err{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--bg);text-align:center}
.d-mer-err b{font-size:13px}
.d-mer-err p{margin:0;font-size:11px;color:var(--muted)}
.d-mer-acts{display:flex;gap:6px;margin-top:6px}
.d-mer-acts button{padding:3px 12px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink);font:inherit;font-size:11px;cursor:pointer}
.d-mer-bar{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;border-top:1px solid var(--line)}
.d-mer-bar span{font-family:var(--font-mono);font-size:9px;color:var(--faint)}
.d-mer-bar button{padding:2px 10px;border:0;background:none;color:var(--faint);font:inherit;font-size:10px;cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<div class="pv-bar">
  <code>media-error-retry</code>
  <b>媒体加载失败</b>
  <span>media error retry</span>
  <span>分类 媒体</span>
  <span>运动 机械</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<div class="d-mer" data-box><div class="d-mer-frame"><div class="d-mer-ok" data-ok><span>画面正常</span></div><div class="d-mer-err" data-err hidden><b>这段解不开</b><p>文件在，但编码不支持。</p><div class="d-mer-acts"><button type="button" data-retry>重试</button><button type="button" data-alt>换清晰度</button></div></div></div><div class="d-mer-bar"><span>00:42</span><button type="button" data-break>模拟失败</button></div></div>
</div>
<p class="pv-note">失败时保留播放器外框和时长，只在画面位置写原因：整块换成一个错误页，用户会以为跳走了。原因写人话（「文件在，但解不开」而不是 error code），下面给重试和「换个清晰度」两条路，因为失败常常只是这一档码率的问题。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "media-error-retry";
  window.INITS = window.INITS || {};
  window.INITS["media-error-retry"] = (root => {
  var ok = root.querySelector('[data-ok]');
  var err = root.querySelector('[data-err]');
  var brk = root.querySelector('[data-break]');
  var retry = root.querySelector('[data-retry]');
  var alt = root.querySelector('[data-alt]');
  if (!ok || !err) return;
  var show = function (bad) { ok.hidden = bad; err.hidden = !bad; };
  if (brk) brk.addEventListener('click', function () { show(true); });
  if (retry) retry.addEventListener('click', function () { err.querySelector('p').textContent = '正在重连…'; setTimeout(function () { show(false); err.querySelector('p').textContent = '文件在，但编码不支持。'; }, 900); });
  if (alt) alt.addEventListener('click', function () { err.querySelector('p').textContent = '已切到 720p，正在重新加载…'; setTimeout(function () { show(false); }, 900); });
});
  window.INITS["media-error-retry"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
