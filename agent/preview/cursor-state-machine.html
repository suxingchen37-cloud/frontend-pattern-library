<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>光标状态机 · cursor-state-machine · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px solid var(--line);
  --border-strong:1px solid var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-cursor-states{position:relative;width:300px;max-width:100%;height:132px;border:1px solid var(--line);border-radius:10px;background:var(--paper);overflow:hidden;font-family:var(--sans);outline:none;cursor:none;touch-action:none}
.d-cursor-states:focus-visible{outline:1px solid var(--ink);outline-offset:2px}
.d-cs-cursor{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;opacity:0;transition:opacity 120ms linear}
.d-cursor-states.is-live .d-cs-cursor{opacity:1}
.d-cs-shape{position:absolute;left:0;top:0;display:block;width:8px;height:8px;margin:-4px 0 0 -4px;border:1px solid var(--muted);border-radius:999px;background:transparent;transition:width 120ms steps(6),height 120ms steps(6),margin 120ms steps(6),border-radius 120ms steps(6),border-color 120ms steps(6),background 120ms steps(6)}
.d-cursor-states[data-s=hover] .d-cs-shape{width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:2px;border-color:var(--ink)}
.d-cursor-states[data-s=drag] .d-cs-shape{width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:2px;border-color:var(--ink);background:var(--ink)}
.d-cursor-states[data-s=wait] .d-cs-shape{width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:999px;border-color:var(--line);border-top-color:var(--ink);animation:d-cursor-state-machine-spin 900ms steps(6) infinite}
.d-cs-block{position:absolute;left:28px;top:44px;display:grid;place-items:center;width:64px;height:42px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-size:var(--fs-11);color:var(--muted);box-shadow:inset 0 1px 0 #fff5;user-select:none}
.d-cursor-states[data-s=drag] .d-cs-block{border-color:var(--ink);color:var(--ink)}
.d-cs-tip{position:absolute;left:10px;bottom:8px;font-family:var(--mono);font-style:normal;font-size:var(--fs-9);letter-spacing:.08em;color:var(--faint)}
@keyframes d-cursor-state-machine-spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="pv-bar">
  <code>cursor-state-machine</code>
  <b>光标状态机</b>
  <span>cursor states</span>
  <span>分类 光标</span>
  <span>运动 机械</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<div class="d-cursor-states" tabindex="0" role="group" aria-label="光标状态机，方向键移动，空格抓取"><i class="d-cs-cursor" aria-hidden="true"><b class="d-cs-shape"></b></i><span class="d-cs-block">拖我</span><em class="d-cs-tip" aria-live="polite">待机</em></div>
</div>
<p class="pv-note">本例让光标在悬停、按下与等待状态间变化，帮助理解操作进度。尺寸、形状、颜色、时长与曲线均可重定；等待应由真实任务状态驱动。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "cursor-state-machine";
  window.INITS = window.INITS || {};
  window.INITS["cursor-state-machine"] = (root => {
  const box = root.querySelector('.d-cursor-states');
  if (!box || box.dataset.dcs) return;
  box.dataset.dcs = '1';
  const cur = box.querySelector('.d-cs-cursor');
  const blk = box.querySelector('.d-cs-block');
  const tip = box.querySelector('.d-cs-tip');
  const label = { idle: '待机', hover: '可抓取', drag: '拖动中', wait: '等待结果' };
  let x = 150, y = 66, drag = false, gx = 0, gy = 0, sx = 0, sy = 0, tx = 0, ty = 0;
  const set = s => { box.dataset.s = s; tip.textContent = label[s]; };
  const hit = () => {
    const a = blk.getBoundingClientRect(), r = box.getBoundingClientRect();
    return x >= a.left - r.left && x <= a.right - r.left && y >= a.top - r.top && y <= a.bottom - r.top;
  };
  const place = (nx, ny) => {
    const r = box.getBoundingClientRect();
    x = Math.max(0, Math.min(r.width, nx));
    y = Math.max(0, Math.min(r.height, ny));
    cur.style.transform = 'translate(' + x + 'px,' + y + 'px)';
    if (!drag) set(hit() ? 'hover' : box.dataset.s === 'wait' ? 'wait' : 'idle');
  };
  const moveBlk = () => {
    const w = box.clientWidth, h = box.clientHeight, bw = blk.offsetWidth, bh = blk.offsetHeight;
    tx = Math.max(-blk.offsetLeft, Math.min(w - blk.offsetLeft - bw, sx + (x - gx)));
    ty = Math.max(-blk.offsetTop, Math.min(h - blk.offsetTop - bh, sy + (y - gy)));
    blk.style.transform = 'translate(' + tx + 'px,' + ty + 'px)';
  };
  const beginDrag = () => { drag = true; gx = x; gy = y; sx = tx; sy = ty; set('drag'); };
  const endDrag = () => {
    drag = false;
    set('wait');
    clearTimeout(box._dcsT);
    box._dcsT = setTimeout(() => set(hit() ? 'hover' : 'idle'), 900);
  };
  box.addEventListener('focus', () => { box.classList.add('is-live'); place(x, y); });
  box.addEventListener('blur', () => { box.classList.remove('is-live'); });
  box.addEventListener('pointerenter', e => {
    const r = box.getBoundingClientRect();
    box.classList.add('is-live');
    place(e.clientX - r.left, e.clientY - r.top);
  });
  box.addEventListener('pointermove', e => {
    const r = box.getBoundingClientRect();
    place(e.clientX - r.left, e.clientY - r.top);
    if (drag) moveBlk();
  });
  box.addEventListener('pointerdown', e => {
    const r = box.getBoundingClientRect();
    place(e.clientX - r.left, e.clientY - r.top);
    if (hit()) { beginDrag(); box.setPointerCapture(e.pointerId); e.preventDefault(); }
  });
  box.addEventListener('pointerup', () => { if (drag) endDrag(); });
  box.addEventListener('pointerleave', () => { if (!drag) box.classList.remove('is-live'); });
  box.addEventListener('keydown', e => {
    const k = e.key, step = 12;
    if (k === 'ArrowLeft') { e.preventDefault(); place(x - step, y); if (drag) moveBlk(); }
    else if (k === 'ArrowRight') { e.preventDefault(); place(x + step, y); if (drag) moveBlk(); }
    else if (k === 'ArrowUp') { e.preventDefault(); place(x, y - step); if (drag) moveBlk(); }
    else if (k === 'ArrowDown') { e.preventDefault(); place(x, y + step); if (drag) moveBlk(); }
    else if (k === ' ') {
      e.preventDefault();
      if (drag) endDrag();
      else if (hit()) beginDrag();
    }
  });
});
  window.INITS["cursor-state-machine"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
