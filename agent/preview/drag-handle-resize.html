<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拖动调整高度 · drag-handle-resize · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px solid var(--line);
  --border-strong:1px solid var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-dh{display:flex;flex-direction:column;width:100%;max-width:340px;height:200px;border:1px solid var(--line);border-radius:10px;background:var(--paper);overflow:hidden}
.d-dh-top{flex:1;min-height:0;padding:14px;display:flex;flex-direction:column;gap:2px;background:var(--bg)}
.d-dh-top b,.d-dh-bottom b{font-size:12px}
.d-dh-top span,.d-dh-bottom span{font-size:11px;color:var(--muted)}
.d-dh-handle{display:grid;place-items:center;height:14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--paper);cursor:ns-resize;touch-action:none}
.d-dh-handle i{width:34px;height:3px;border-radius:999px;background:var(--line)}
.d-dh-bottom{height:96px;padding:14px;display:flex;flex-direction:column;gap:2px;background:var(--paper)}
</style>
</head>
<body>
<div class="pv-bar">
  <code>drag-handle-resize</code>
  <b>拖动调整高度</b>
  <span>drag handle resize</span>
  <span>分类 手势</span>
  <span>运动 物理</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<div class="d-dh" data-wrap><div class="d-dh-top"><b>预览</b><span>上面这块会被压缩</span></div><div class="d-dh-handle" data-handle><i></i></div><div class="d-dh-bottom" data-bottom><b>详情</b><span data-size>高 96px</span></div></div>
</div>
<p class="pv-note">上下两块之间的把手给 14px 高，是因为手指按上去会挡住 10px：比这更薄，用户只能盲拖。拖动时有最小高度（80px）和最大（面板的七成），到边继续拖只回弹 4px，手感上知道到底了。松手不吸附——这是自由高度，不是分档。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "drag-handle-resize";
  window.INITS = window.INITS || {};
  window.INITS["drag-handle-resize"] = (root => {
  var wrap = root.querySelector('[data-wrap]');
  var handle = root.querySelector('[data-handle]');
  var bottom = root.querySelector('[data-bottom]');
  var size = root.querySelector('[data-size]');
  if (!handle || !bottom) return;
  var startY = 0, startH = 0, drag = false;
  var apply = function (h) {
    var max = wrap.clientHeight * .7, min = 80;
    h = Math.max(min, Math.min(max, h));
    bottom.style.height = h.toFixed(1) + 'px';
    if (size) size.textContent = '高 ' + Math.round(h) + 'px';
  };
  handle.addEventListener('pointerdown', function (e) { drag = true; startY = e.clientY; startH = bottom.offsetHeight; handle.setPointerCapture(e.pointerId); });
  handle.addEventListener('pointermove', function (e) { if (!drag) return; apply(startH - (e.clientY - startY)); });
  var end = function () { drag = false; };
  handle.addEventListener('pointerup', end);
  handle.addEventListener('pointercancel', end);
});
  window.INITS["drag-handle-resize"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
