<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>直方图 · histogram · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px var(--line);
  --border-strong:1px var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-hg{width:100%;max-width:340px}
.d-hg-svg{display:block;width:100%;height:auto;overflow:visible}
.d-hg-axis{stroke:var(--line);stroke-width:1}
.d-hg-label{fill:var(--faint);font-family:var(--font-mono);font-size:7px;letter-spacing:.06em}
.d-hg-bar{fill:color-mix(in srgb,var(--ink) 78%,var(--paper))}
.d-hg-bar.hi{fill:var(--ink-vermilion)}
.d-hg-mean{stroke:var(--ink);stroke-width:1;stroke-dasharray:3 3}
.d-hg-note{margin:6px 0 0;font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;color:var(--faint)}
</style>
</head>
<body>
<div class="pv-bar">
  <code>histogram</code>
  <b>直方图</b>
  <span>histogram</span>
  <span>分类 图表</span>
  <span>运动 无动效</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<div class="d-hg"><svg class="d-hg-svg" viewBox="0 0 320 170" role="img" aria-label="测量误差分布直方图，共 14 个区间"></svg><p class="d-hg-note">虚线是均值 · 区间宽 5</p></div>
</div>
<p class="pv-note">柱子之间不留缝，因为横轴是连续的数值区间，不是几个并列的类别；留缝就会让人以为组与组之间有空白。均值线画在柱子上层、虚线、比柱子深一档，位置对得上才算数。区间宽度取 5：太细看不出形状，太粗只剩三根柱子。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "histogram";
  window.INITS = window.INITS || {};
  window.INITS["histogram"] = (root => {
  const svg = root.querySelector('.d-hg-svg');
  if (!svg) return;
  const bins = [2, 5, 9, 16, 24, 31, 27, 19, 12, 7, 5, 2, 1, 0];
  const W = 320, H = 170, L = 26, R = 10, T = 14, B = 26;
  const plotW = W - L - R, plotH = H - T - B;
  const max = 32, bw = plotW / bins.length;
  const y = v => T + plotH * (1 - v / max);
  const NS = 'http://www.w3.org/2000/svg';
  const mk = (tag, attrs) => { const el = document.createElementNS(NS, tag); for (const k in attrs) el.setAttribute(k, attrs[k]); return el; };
  for (let g = 0; g <= 4; g++) {
    const gy = T + plotH * g / 4;
    svg.appendChild(mk('line', { class: 'd-hg-axis', x1: L, y1: gy, x2: W - R, y2: gy }));
    const t = mk('text', { class: 'd-hg-label', x: 0, y: gy + 2.5 });
    t.textContent = String(max - g * 8);
    svg.appendChild(t);
  }
  const peak = bins.indexOf(Math.max.apply(null, bins));
  bins.forEach((v, i) => {
    if (!v) return;
    svg.appendChild(mk('rect', { class: 'd-hg-bar' + (i === peak ? ' hi' : ''), x: (L + i * bw).toFixed(1), y: y(v).toFixed(1), width: Math.ceil(bw) + 0.5, height: (y(0) - y(v)).toFixed(1) }));
  });
  const mean = 5.4;
  const mx = L + plotW * mean / bins.length;
  svg.appendChild(mk('line', { class: 'd-hg-mean', x1: mx, y1: T, x2: mx, y2: H - B }));
  ['−2', '0', '+2', '+4', '+6'].forEach((lab, k) => { const t = mk('text', { class: 'd-hg-label', x: L + plotW * (k * 3.5) / bins.length, y: H - 8 }); t.textContent = lab; svg.appendChild(t); });
});
  window.INITS["histogram"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
