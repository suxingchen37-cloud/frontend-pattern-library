<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>长按复制 · long-press-copy · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px solid var(--line);
  --border-strong:1px solid var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-lc2{position:relative;display:flex;flex-direction:column;justify-content:center;width:100%;max-width:340px;height:170px;padding:0 16px;border:1px solid var(--line);border-radius:10px;background:var(--paper);overflow:hidden}
.d-lc2-text{margin:0;font-size:13px;line-height:1.9;user-select:none;-webkit-user-select:none}
.d-lc2-menu{position:absolute;display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:6px;background:var(--ink);box-shadow:0 12px 24px -8px #20241e26;z-index:3}
.d-lc2-menu button{padding:4px 10px;border:0;border-radius:6px;background:transparent;color:var(--paper);font:inherit;font-size:11px;cursor:pointer}
.d-lc2-menu button:hover{background:color-mix(in srgb,var(--paper) 14%,transparent)}
.d-lc2-note{position:absolute;bottom:8px;margin:0;font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;color:var(--faint)}
</style>
</head>
<body>
<div class="pv-bar">
  <code>long-press-copy</code>
  <b>长按复制</b>
  <span>long press copy</span>
  <span>分类 手势</span>
  <span>运动 物理</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<div class="d-lc2" data-zone><p class="d-lc2-text" data-text>时码 14:22:07，机位 B，缺 38 秒。</p><div class="d-lc2-menu" data-menu hidden><button type="button" data-copy>复制这句</button><button type="button" data-cancel>取消</button></div><p class="d-lc2-note">长按上面这句话</p></div>
</div>
<p class="pv-note">长按 480ms 弹出菜单，比系统的 500ms 略短，是因为网页里常有人按得轻。菜单出现在按下的位置上方，放不下就翻到下方——位置不对，人第一反应是「没反应」。复制后菜单不立刻消失，改成显示「已复制」，因为消失得太快会让人不确定到底成没成。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "long-press-copy";
  window.INITS = window.INITS || {};
  window.INITS["long-press-copy"] = (root => {
  var zone = root.querySelector('[data-zone]');
  var text = root.querySelector('[data-text]');
  var menu = root.querySelector('[data-menu]');
  if (!zone || !text || !menu) return;
  var timer = 0;
  var hide = function () { menu.hidden = true; };
  var open = function (x, y) {
    menu.hidden = false;
    var r = zone.getBoundingClientRect();
    var mw = menu.offsetWidth, mh = menu.offsetHeight;
    var left = Math.max(6, Math.min(r.width - mw - 6, x - r.left - mw / 2));
    var top = y - r.top - mh - 8;
    if (top < 4) top = y - r.top + 18;
    menu.style.left = left.toFixed(0) + 'px';
    menu.style.top = top.toFixed(0) + 'px';
  };
  var start = function (e) { timer = setTimeout(function () { open(e.clientX, e.clientY); }, 480); };
  var cancel = function () { clearTimeout(timer); };
  text.addEventListener('pointerdown', start);
  text.addEventListener('pointerup', cancel);
  text.addEventListener('pointermove', cancel);
  text.addEventListener('pointercancel', cancel);
  var copy = menu.querySelector('[data-copy]');
  if (copy) copy.addEventListener('click', function () { var old = copy.textContent; copy.textContent = '已复制'; setTimeout(function () { copy.textContent = old; hide(); }, 700); });
  var cancelBtn = menu.querySelector('[data-cancel]');
  if (cancelBtn) cancelBtn.addEventListener('click', hide);
  zone.addEventListener('click', function (e) { if (menu.hidden) return; if (!menu.contains(e.target)) hide(); });
});
  window.INITS["long-press-copy"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
