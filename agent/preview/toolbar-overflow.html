<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工具栏溢出折叠 · toolbar-overflow · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px solid var(--line);
  --border-strong:1px solid var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-toolbar-overflow{position:relative;width:280px;max-width:100%;font-family:var(--sans)}
.d-to-bar{display:flex;align-items:center;gap:2px;height:34px;padding:0 2px;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
.d-to-btn{height:24px;min-width:26px;padding:0 6px;border:0;border-radius:2px;background:transparent;color:var(--muted);font:inherit;font-size:var(--fs-11);cursor:pointer}
.d-to-btn:hover{color:var(--ink)}
.d-to-btn[aria-pressed=true]{color:var(--ink);background:var(--bg);box-shadow:inset 0 1px 0 #fff5}
.d-to-btn:focus-visible,.d-to-more:focus-visible,.d-to-item:focus-visible{outline:1px solid var(--ink);outline-offset:1px}
.d-to-more{display:inline-flex;align-items:center;gap:4px;margin-left:auto;height:24px;padding:0 8px;border:1px solid var(--line);border-radius:2px;background:transparent;color:var(--ink);font:inherit;font-size:var(--fs-11);cursor:pointer}
.d-to-more b{font-family:var(--mono);font-weight:400;font-size:var(--fs-9);color:var(--faint)}
.d-to-menu{position:absolute;right:0;top:38px;z-index:2;width:148px;padding:4px;border:1px solid var(--line);border-radius:6px;background:var(--paper);box-shadow:0 12px 24px -8px #20241e26}
.d-to-menu[hidden]{display:none}
.d-to-item{display:block;width:100%;height:28px;padding:0 8px;border:0;border-radius:2px;background:transparent;color:var(--ink);font:inherit;font-size:var(--fs-11);text-align:left;cursor:pointer;opacity:0;transform:translateY(-4px)}
.d-to-item:hover{background:var(--bg)}
.d-toolbar-overflow.is-open .d-to-item{animation:d-toolbar-overflow-item 180ms steps(6) forwards;animation-delay:calc(var(--i,0) * 120ms)}
.d-to-item:nth-child(2){--i:1}
.d-to-item:nth-child(3){--i:2}
@keyframes d-toolbar-overflow-item{to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="pv-bar">
  <code>toolbar-overflow</code>
  <b>工具栏溢出折叠</b>
  <span>toolbar overflow</span>
  <span>分类 浮层</span>
  <span>运动 机械</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<div class="d-toolbar-overflow"><div class="d-to-bar" role="toolbar" aria-label="编辑器工具"><button class="d-to-btn" type="button" aria-pressed="true">粗</button><button class="d-to-btn" type="button" aria-pressed="false">斜</button><button class="d-to-more" type="button" aria-expanded="false" aria-haspopup="true">更多 <b>3</b></button></div><div class="d-to-menu" role="menu" hidden><button class="d-to-item" type="button" role="menuitem">插入注脚</button><button class="d-to-item" type="button" role="menuitem">导出 PDF</button><button class="d-to-item" type="button" role="menuitem">版本历史</button></div></div>
</div>
<p class="pv-note">工具栏定宽 280px：再宽就轮不到折叠；展开时三项依次错 120ms、用 steps(6) 出现，是让人看清有哪三项，而不是一次糊上来。更多键上留着数字 3——折起来的东西要能数得清。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "toolbar-overflow";
  window.INITS = window.INITS || {};
  window.INITS["toolbar-overflow"] = (root => {
  const box = root.querySelector('.d-toolbar-overflow');
  if (!box || box.dataset.dto) return;
  box.dataset.dto = '1';
  const btn = box.querySelector('.d-to-more');
  const menu = box.querySelector('.d-to-menu');
  const items = [...box.querySelectorAll('.d-to-item')];
  let cur = 0;
  const focusItem = i => { cur = (i + items.length) % items.length; items[cur].focus(); };
  const set = open => {
    box.classList.toggle('is-open', open);
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    menu.hidden = !open;
    if (open) setTimeout(() => focusItem(0), 280);
  };
  btn.addEventListener('click', () => set(btn.getAttribute('aria-expanded') !== 'true'));
  items.forEach(it => it.addEventListener('click', () => { set(false); btn.focus(); }));
  box.addEventListener('pointerdown', e => {
    if (!menu.hidden && !menu.contains(e.target) && !btn.contains(e.target)) set(false);
  });
  box.addEventListener('keydown', e => {
    if (e.key === 'Escape') { set(false); btn.focus(); }
    else if (e.key === 'ArrowDown' && !menu.hidden) { e.preventDefault(); focusItem(cur + 1); }
    else if (e.key === 'ArrowUp' && !menu.hidden) { e.preventDefault(); focusItem(cur - 1); }
  });
});
  window.INITS["toolbar-overflow"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
