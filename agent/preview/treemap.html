<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>矩形树图 · treemap · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px solid var(--line);
  --border-strong:1px solid var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-tm{width:100%;max-width:340px}
.d-tm-svg{display:block;width:100%;height:auto}
.d-tm-cell{stroke:var(--paper);stroke-width:2}
.d-tm-text{fill:var(--paper);font-size:9px;font-weight:600}
.d-tm-val{fill:var(--paper);font-family:var(--font-mono);font-size:7px;opacity:.8}
.d-tm-note{margin:6px 0 0;font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;color:var(--faint)}
</style>
</head>
<body>
<div class="pv-bar">
  <code>treemap</code>
  <b>矩形树图</b>
  <span>treemap</span>
  <span>分类 图表</span>
  <span>运动 无动效</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<div class="d-tm"><svg class="d-tm-svg" viewBox="0 0 320 170" role="img" aria-label="流量来源的矩形树图"></svg><p class="d-tm-note">面积 = 占比</p></div>
</div>
<p class="pv-note">面积就是占比，所以只能拿面积比，不能拿长短比——人估面积误差大，这张图适合看「谁明显更大」，不适合读精确数值。只在能放下字的块里写标签，放不下就留空，硬塞会把字压成两个字。块按大小从左上角排，眼睛先落在那里。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "treemap";
  window.INITS = window.INITS || {};
  window.INITS["treemap"] = (root => {
  const svg = root.querySelector('.d-tm-svg');
  if (!svg) return;
  const items = [['搜索', 42], ['直接', 23], ['社交', 15], ['邮件', 9], ['联盟', 6], ['其它', 5]];
  const total = items.reduce((s, x) => s + x[1], 0);
  const W = 320, H = 170;
  const NS = 'http://www.w3.org/2000/svg';
  const mk = (tag, attrs) => { const el = document.createElementNS(NS, tag); for (const k in attrs) el.setAttribute(k, attrs[k]); return el; };
  const shades = ['var(--ink)', 'color-mix(in srgb,var(--ink) 78%,var(--paper))', 'color-mix(in srgb,var(--ink) 60%,var(--paper))', 'var(--ink-indigo)', 'color-mix(in srgb,var(--ink) 42%,var(--paper))', 'color-mix(in srgb,var(--ink) 30%,var(--paper))'];
  const rects = [];
  (function split(list, x, y, w, h, vertical) {
    if (!list.length) return;
    if (list.length === 1) { rects.push({ item: list[0], x: x, y: y, w: w, h: h }); return; }
    const sum = list.reduce((s, i) => s + i[1], 0);
    let acc = 0, cut = 1;
    for (let i = 0; i < list.length; i++) { const next = acc + list[i][1]; if (next >= sum / 2) { cut = i + 1; break; } acc = next; }
    const a = list.slice(0, cut), b = list.slice(cut);
    const sa = a.reduce((s, i) => s + i[1], 0);
    const frac = sa / sum;
    if (vertical) { split(a, x, y, w * frac, h, false); split(b, x + w * frac, y, w * (1 - frac), h, false); }
    else { split(a, x, y, w, h * frac, true); split(b, x, y + h * frac, w, h * (1 - frac), true); }
  })(items, 0, 0, W, H, true);
  const order = new Map(items.map((it, i) => [it[0], i]));
  rects.forEach(r => {
    const [name, val] = r.item;
    const idx = order.get(name);
    svg.appendChild(mk('rect', { class: 'd-tm-cell', x: r.x.toFixed(1), y: r.y.toFixed(1), width: r.w.toFixed(1), height: r.h.toFixed(1), fill: shades[idx % shades.length] }));
    if (r.w < 52 || r.h < 30) return;
    const t = mk('text', { class: 'd-tm-text', x: r.x + 8, y: r.y + 18 });
    t.textContent = name;
    svg.appendChild(t);
    const v = mk('text', { class: 'd-tm-val', x: r.x + 8, y: r.y + 30 });
    v.textContent = Math.round(val / total * 100) + '%';
    svg.appendChild(v);
  });
});
  window.INITS["treemap"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
