<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>日历热力 · heatmap-calendar · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px solid var(--line);
  --border-strong:1px solid var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-hc{width:100%;max-width:340px}
.d-hc-svg{display:block;width:100%;height:auto}
.d-hc-cell{stroke:var(--bg);stroke-width:1}
.d-hc-legend{display:flex;align-items:center;gap:4px;margin-top:6px;font-family:var(--font-mono);font-size:8px;color:var(--faint)}
.d-hc-legend i{width:9px;height:9px;border-radius:2px;display:block}
.d-hc-legend i[data-l="0"]{background:color-mix(in srgb,var(--ink) 6%,var(--paper))}
.d-hc-legend i[data-l="1"]{background:color-mix(in srgb,var(--ink) 18%,var(--paper))}
.d-hc-legend i[data-l="2"]{background:color-mix(in srgb,var(--ink) 34%,var(--paper))}
.d-hc-legend i[data-l="3"]{background:color-mix(in srgb,var(--ink) 58%,var(--paper))}
.d-hc-legend i[data-l="4"]{background:var(--ink)}
</style>
</head>
<body>
<div class="pv-bar">
  <code>heatmap-calendar</code>
  <b>日历热力</b>
  <span>calendar heatmap</span>
  <span>分类 图表</span>
  <span>运动 无动效</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<div class="d-hc"><div class="d-hc-grid" aria-label="近二十周的活跃度热力图"><svg class="d-hc-svg" viewBox="0 0 320 116" role="img" aria-label="二十周、每周七天的活跃度热力图"></svg></div><div class="d-hc-legend"><span>少</span><i data-l="0"></i><i data-l="1"></i><i data-l="2"></i><i data-l="3"></i><i data-l="4"></i><span>多</span></div></div>
</div>
<p class="pv-note">一格一天，一列一周，行是星期几：位置固定，面积才可比。深浅只分五档，再多档人眼分不出；0 单独用一个接近纸面的颜色，跟「有一点」区别开。二十周就够看趋势，画满一年格子在卡片里会小到看不清。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "heatmap-calendar";
  window.INITS = window.INITS || {};
  window.INITS["heatmap-calendar"] = (root => {
  const svg = root.querySelector('.d-hc-svg');
  if (!svg) return;
  const weeks = 20, days = 7, cell = 14, gap = 2;
  const NS = 'http://www.w3.org/2000/svg';
  const mk = (tag, attrs) => { const el = document.createElementNS(NS, tag); for (const k in attrs) el.setAttribute(k, attrs[k]); return el; };
  const shades = ['color-mix(in srgb,var(--ink) 6%,var(--paper))', 'color-mix(in srgb,var(--ink) 18%,var(--paper))', 'color-mix(in srgb,var(--ink) 34%,var(--paper))', 'color-mix(in srgb,var(--ink) 58%,var(--paper))', 'var(--ink)'];
  let seed = 11;
  const rnd = () => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };
  const days7 = ['一', '三', '五', '日'];
  for (let w = 0; w < weeks; w++) {
    for (let d = 0; d < days; d++) {
      const r = rnd();
      const v = d === 5 || d === 6 ? (r > .55 ? 1 : 0) : r > .82 ? 4 : r > .62 ? 3 : r > .38 ? 2 : r > .16 ? 1 : 0;
      const rect = mk('rect', { class: 'd-hc-cell', x: 22 + w * (cell + gap), y: 6 + d * (cell + gap), width: cell, height: cell, rx: 2, fill: shades[v] });
      svg.appendChild(rect);
    }
  }
  days7.forEach((label, k) => {
    const t = mk('text', { class: 'd-hc-t', x: 16, y: 6 + k * 4 * (cell + gap) + cell - 3, 'text-anchor': 'end', fill: 'var(--faint)', 'font-size': '7', 'font-family': 'var(--font-mono)' });
    t.textContent = label;
    svg.appendChild(t);
  });
});
  window.INITS["heatmap-calendar"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
