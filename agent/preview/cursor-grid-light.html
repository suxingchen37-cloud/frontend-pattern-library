<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>光标点亮网格 · cursor-grid-light · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px solid var(--line);
  --border-strong:1px solid var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-grid-light{display:inline-flex;flex-direction:column;gap:var(--sp-8);font-family:var(--sans);outline:none;cursor:crosshair}
.d-gl-grid{display:grid;grid-template-columns:repeat(12,22px);grid-auto-rows:22px;gap:1px;width:max-content;background:var(--line);border:1px solid var(--line)}
.d-gl-cell{background:var(--paper);transition:background 180ms steps(6),opacity 180ms steps(6)}
.d-gl-cell.is-l1{background:#c2402a}
.d-gl-cell.is-l2{background:#c2402a;opacity:.5}
.d-gl-cell.is-l3{background:#c2402a;opacity:.22}
.d-gl-tip{font-family:var(--mono);font-size:var(--fs-9);letter-spacing:.08em;color:var(--faint)}
.d-grid-light:focus-visible{outline:1px solid var(--ink);outline-offset:4px}
</style>
</head>
<body>
<div class="pv-bar">
  <code>cursor-grid-light</code>
  <b>光标点亮网格</b>
  <span>grid spotlight</span>
  <span>分类 光标</span>
  <span>运动 机械</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<div class="d-grid-light" tabindex="0" role="group" aria-label="光标点亮网格，方向键移动"><div class="d-gl-grid"></div><span class="d-gl-tip">移动光标 / 方向键</span></div>
</div>
<p class="pv-note">亮度按与光标的欧氏距离分三档（1 / 2.2 / 3.2 格），不用连续值：连续亮度在 180ms 里会糊成一片，分档才看得出一圈一圈；最近一圈不加延迟，加了就变成追着光标跑。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "cursor-grid-light";
  window.INITS = window.INITS || {};
  window.INITS["cursor-grid-light"] = (root => {
  const box = root.querySelector('.d-grid-light');
  if (!box || box.dataset.dgl) return;
  box.dataset.dgl = '1';
  const grid = box.querySelector('.d-gl-grid');
  const cols = 12, rows = 5, step = 23;
  if (!grid.children.length) {
    for (let i = 0; i < cols * rows; i++) {
      const cell = document.createElement('span');
      cell.className = 'd-gl-cell';
      grid.appendChild(cell);
    }
  }
  const cells = [...grid.children];
  let at = -1, kx = 5, ky = 2;
  const clear = () => { cells.forEach(c => { c.className = 'd-gl-cell'; }); at = -1; };
  const paint = (col, row) => {
    if (col < 0 || row < 0 || col >= cols || row >= rows) { clear(); return; }
    const idx = row * cols + col;
    if (idx === at) return;
    at = idx;
    cells.forEach((c, i) => {
      const d = Math.hypot(i % cols - col, Math.floor(i / cols) - row);
      c.className = 'd-gl-cell' + (d <= 1 ? ' is-l1' : d <= 2.2 ? ' is-l2' : d <= 3.2 ? ' is-l3' : '');
    });
  };
  const atPointer = e => {
    const r = grid.getBoundingClientRect();
    kx = Math.floor((e.clientX - r.left) / step);
    ky = Math.floor((e.clientY - r.top) / step);
    paint(kx, ky);
  };
  grid.addEventListener('pointermove', atPointer);
  grid.addEventListener('pointerdown', atPointer);
  grid.addEventListener('pointerleave', clear);
  box.addEventListener('focus', () => paint(kx, ky));
  box.addEventListener('blur', clear);
  box.addEventListener('keydown', e => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'ArrowUp' || k === 'ArrowDown') {
      e.preventDefault();
      kx = Math.max(0, Math.min(cols - 1, kx + (k === 'ArrowRight' ? 1 : k === 'ArrowLeft' ? -1 : 0)));
      ky = Math.max(0, Math.min(rows - 1, ky + (k === 'ArrowDown' ? 1 : k === 'ArrowUp' ? -1 : 0)));
      paint(kx, ky);
    } else if (k === 'Escape') { clear(); }
  });
});
  window.INITS["cursor-grid-light"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
