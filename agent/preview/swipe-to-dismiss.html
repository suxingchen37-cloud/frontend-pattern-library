<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>侧滑关闭 · swipe-to-dismiss · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px solid var(--line);
  --border-strong:1px solid var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-sd{position:relative;width:100%;max-width:340px;padding:8px 0}
.d-sd-card{position:relative;display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper);touch-action:pan-y;cursor:grab;will-change:transform;transition:transform 220ms var(--ease-physical),opacity 220ms var(--ease)}
.d-sd-card b{font-size:13px}
.d-sd-card span{font-size:11px;color:var(--muted)}
.d-sd-card em{font-style:normal;font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;color:var(--faint)}
.d-sd-note{margin:10px 0 0;font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;color:var(--faint);cursor:pointer}
</style>
</head>
<body>
<div class="pv-bar">
  <code>swipe-to-dismiss</code>
  <b>侧滑关闭</b>
  <span>swipe to dismiss</span>
  <span>分类 手势</span>
  <span>运动 物理</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<div class="d-sd"><div class="d-sd-card" data-card><b>今晚 8 点</b><span>样片放到共享盘了，记得看第 3 场。</span><em>左滑或右滑</em></div><p class="d-sd-note">滑掉就没了 · 再点一下这里重置</p></div>
</div>
<p class="pv-note">滑过 96px 或松手时速度超过 0.5px/ms 才算关掉，两个条件缺一个就弹回去：只看距离会把「手抖一下」当成关闭，只看速度会把慢慢推到底的动作忽略。位移跟手但压到 0.55 倍，手感是「拉着有阻力」，不是图片在飘。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "swipe-to-dismiss";
  window.INITS = window.INITS || {};
  window.INITS["swipe-to-dismiss"] = (root => {
  var card = root.querySelector('[data-card]');
  var note = root.querySelector('.d-sd-note');
  if (!card || !note) return;
  var startX = 0, startT = 0, dx = 0, dragging = false;
  var reset = function () { card.style.transition = 'transform 220ms cubic-bezier(.34,1.56,.64,1),opacity 220ms cubic-bezier(.2,.75,.25,1)'; card.style.transform = ''; card.style.opacity = '1'; };
  card.addEventListener('pointerdown', function (e) { dragging = true; startX = e.clientX; startT = Date.now(); dx = 0; card.style.transition = 'none'; card.setPointerCapture(e.pointerId); });
  card.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    dx = e.clientX - startX;
    card.style.transform = 'translateX(' + (dx * .55).toFixed(1) + 'px)';
    card.style.opacity = String(Math.max(.35, 1 - Math.abs(dx) / 420));
  });
  var end = function () {
    if (!dragging) return;
    dragging = false;
    var v = Math.abs(dx) / Math.max(1, Date.now() - startT);
    if (Math.abs(dx) > 96 || v > .5) { card.style.transform = 'translateX(' + (dx > 0 ? 420 : -420) + 'px)'; card.style.opacity = '0'; }
    else reset();
  };
  card.addEventListener('pointerup', end);
  card.addEventListener('pointercancel', end);
  note.addEventListener('click', function () { card.style.transition = 'none'; card.style.transform = ''; card.style.opacity = '1'; void card.offsetWidth; reset(); });
});
  window.INITS["swipe-to-dismiss"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
