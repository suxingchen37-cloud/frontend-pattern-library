<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>单位成本比较 · unit-price-comparison · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px solid var(--line);
  --border-strong:1px solid var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-unit-price-comparison{width:100%;max-width:430px;min-width:0;color:var(--ink);font:inherit;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.d-unit-price-comparison *,.d-unit-price-comparison *::before,.d-unit-price-comparison *::after{box-sizing:border-box}
.d-unit-price-comparison [hidden]{display:none!important}
.d-unit-price-comparison .d-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0}
.d-unit-price-comparison .d-note{display:block;margin:8px 0 0;color:var(--muted);font-size:12px;min-height:1.5em}
.d-unit-price-comparison label{display:block;margin:8px 0}
.d-unit-price-comparison input,.d-unit-price-comparison select,.d-unit-price-comparison textarea,.d-unit-price-comparison button{font:inherit;color:inherit;max-width:100%;min-width:0}
.d-unit-price-comparison input:not([type=checkbox]):not([type=radio]),.d-unit-price-comparison select,.d-unit-price-comparison textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:var(--radius-control);background:var(--paper)}
.d-unit-price-comparison button{padding:6px 10px;border:1px solid var(--line);border-radius:var(--radius-control);background:var(--paper);cursor:pointer}
.d-unit-price-comparison button:disabled{opacity:.5;cursor:default}
.d-unit-price-comparison :focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.d-unit-price-comparison [aria-invalid=true]{border-color:var(--warn)!important}
.d-unit-price-comparison .d-scroll{max-width:100%;overflow:auto}
.d-unit-price-comparison table{width:100%;border-collapse:collapse;font-size:12px;text-align:left}
.d-unit-price-comparison th,.d-unit-price-comparison td{padding:7px;border-bottom:1px solid var(--line);vertical-align:top}
.d-unit-price-comparison caption{text-align:left;font-weight:600;margin-bottom:8px}
.d-unit-price-comparison progress{width:100%;accent-color:var(--ink)}
.d-unit-price-comparison pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}
.d-unit-price-comparison h3,.d-unit-price-comparison p{margin:8px 0}
.d-unit-price-comparison [aria-pressed=true],.d-unit-price-comparison [aria-selected=true]{border-color:var(--ink);font-weight:650}
.d-unit-price-comparison .d-grow{flex:1;min-width:100px}
.d-unit-price-comparison summary{cursor:pointer;padding:6px 0}
.d-unit-price-comparison ul,.d-unit-price-comparison ol{padding-left:24px}
</style>
</head>
<body>
<div class="pv-bar">
  <code>unit-price-comparison</code>
  <b>单位成本比较</b>
  <span>unit price comparison</span>
  <span>分类 数据</span>
  <span>运动 无动效</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<section class="d-unit-price-comparison" aria-label="单位成本比较"><p>样例比较：两方案单位须相同。</p><label>方案 A 价格<input data-price-a type="number" value="30"></label><label>方案 A 数量<input data-count-a type="number" value="3"></label><label>方案 B 价格<input data-price-b type="number" value="48"></label><label>方案 B 数量<input data-count-b type="number" value="6"></label><button type="button" data-compare>比较单位成本</button><output class="d-note" data-out role="status" aria-live="polite"></output></section>
</div>
<p class="pv-note">按价格除以数量比较样例方案，数量必须大于零；显示输入假设，不构成真实报价。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "unit-price-comparison";
  window.INITS = window.INITS || {};
  window.INITS["unit-price-comparison"] = (root => {
 const q = selector => root.querySelector(selector);
 const qa = selector => [...root.querySelectorAll(selector)];
 const say = text => { const out = q('[data-out]'); if (out) out.textContent = text; };
 ((root,q,qa,say)=>{q('[data-compare]').onclick=()=>{const inputs=qa('input'),values=inputs.map(el=>Number(el.value));if(inputs.some(el=>!el.value.trim())||values.some(n=>!Number.isFinite(n))||values[0]<0||values[2]<0||values[1]<=0||values[3]<=0){say('价格须非负，数量须大于零');return;}const one=values[0]/values[1],two=values[2]/values[3];if(!Number.isFinite(one)||!Number.isFinite(two)){say('结果超出可计算范围，请调整价格或数量');return;}say('A '+one.toFixed(2)+' / 单位；B '+two.toFixed(2)+' / 单位；'+(one===two?'单位成本相同':one<two?'A 较低':'B 较低'));};})(root, q, qa, say);
});
  window.INITS["unit-price-comparison"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
