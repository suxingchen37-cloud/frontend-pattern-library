<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>画中画小窗 · pip-window · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px solid var(--line);
  --border-strong:1px solid var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-pw{position:relative;width:100%;max-width:340px;height:190px;border:1px solid var(--line);border-radius:10px;background:var(--paper);overflow:hidden}
.d-pw-main{position:absolute;inset:0;display:flex;align-items:flex-end;padding:10px;background:linear-gradient(160deg,color-mix(in srgb,var(--ink) 74%,var(--paper)),color-mix(in srgb,var(--ink) 48%,var(--paper)))}
.d-pw-main span{font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;color:var(--paper);opacity:.8}
.d-pw-pip{position:absolute;right:10px;bottom:10px;width:96px;height:60px;padding:6px;border:1px solid var(--paper);border-radius:6px;background:color-mix(in srgb,var(--ink) 35%,var(--paper));color:var(--paper);cursor:grab;touch-action:none;transition:left 200ms var(--ease),top 200ms var(--ease),right 200ms var(--ease),bottom 200ms var(--ease)}
.d-pw-pip b{display:block;font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;font-weight:400}
.d-pw-pip span{display:block;margin-top:2px;font-size:8px;opacity:.75;line-height:1.4}
.d-pw-pip button{position:absolute;right:2px;top:2px;width:18px;height:18px;border:0;border-radius:2px;background:transparent;color:var(--paper);font-size:10px;cursor:pointer;opacity:.8}
</style>
</head>
<body>
<div class="pv-bar">
  <code>pip-window</code>
  <b>画中画小窗</b>
  <span>picture in picture</span>
  <span>分类 媒体</span>
  <span>运动 物理</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<div class="d-pw" data-box><div class="d-pw-main"><span>主画面 · 场记 03</span></div><div class="d-pw-pip" data-pip><b>B 机</b><span>点右下角回主画面</span><button type="button" data-back aria-label="回到主画面">⤢</button></div></div>
</div>
<p class="pv-note">小窗固定在右下角、占主画面 28%：再小看不清表情，再大就把主画面挡了。小窗带一个「回主画面」的角标，不然用户不知道能点回去。拖动能挪位置，但松手会吸附到最近的角——飘在中间的小窗总是挡字幕。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "pip-window";
  window.INITS = window.INITS || {};
  window.INITS["pip-window"] = (root => {
  var box = root.querySelector('[data-box]');
  var pip = root.querySelector('[data-pip]');
  var back = root.querySelector('[data-back]');
  if (!box || !pip) return;
  var drag = null;
  pip.addEventListener('pointerdown', function (e) {
    if (e.target === back) return;
    var r = pip.getBoundingClientRect(), br = box.getBoundingClientRect();
    drag = { dx: e.clientX - r.left, dy: e.clientY - r.top, w: r.width, h: r.height, bw: br.width, bh: br.height };
    pip.style.transition = 'none';
    pip.setPointerCapture(e.pointerId);
  });
  pip.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var br = box.getBoundingClientRect();
    var x = Math.max(0, Math.min(drag.bw - drag.w, e.clientX - br.left - drag.dx));
    var y = Math.max(0, Math.min(drag.bh - drag.h, e.clientY - br.top - drag.dy));
    pip.style.left = x + 'px'; pip.style.top = y + 'px';
    pip.style.right = 'auto'; pip.style.bottom = 'auto';
  });
  var end = function () {
    if (!drag) return;
    drag = null;
    pip.style.transition = 'left 200ms cubic-bezier(.2,.75,.25,1),top 200ms cubic-bezier(.2,.75,.25,1)';
    var br = box.getBoundingClientRect(), r = pip.getBoundingClientRect();
    var left = (r.left - br.left) < (br.width - r.width) / 2;
    var top = (r.top - br.top) < (br.height - r.height) / 2;
    pip.style.left = left ? '10px' : (br.width - r.width - 10) + 'px';
    pip.style.top = top ? '10px' : (br.height - r.height - 10) + 'px';
  };
  pip.addEventListener('pointerup', end);
  pip.addEventListener('pointercancel', end);
  if (back) back.addEventListener('click', function () { pip.style.transition = 'none'; pip.style.left = ''; pip.style.top = ''; pip.style.right = '10px'; pip.style.bottom = '10px'; });
});
  window.INITS["pip-window"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
