<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>瀑布拆解 · waterfall · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px solid var(--line);
  --border-strong:1px solid var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-wf{width:100%;max-width:340px}
.d-wf-svg{display:block;width:100%;height:auto;overflow:visible}
.d-wf-axis{stroke:var(--line);stroke-width:1}
.d-wf-label{fill:var(--faint);font-family:var(--font-mono);font-size:7px;letter-spacing:.06em}
.d-wf-bar{fill:var(--ink)}
.d-wf-up{fill:var(--ink-vermilion)}
.d-wf-down{fill:color-mix(in srgb,var(--ink) 30%,var(--paper))}
.d-wf-link{stroke:var(--line);stroke-width:1;stroke-dasharray:2 2}
.d-wf-val{fill:var(--ink);font-family:var(--font-mono);font-size:7px}
.d-wf-note{margin:6px 0 0;font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;color:var(--faint)}
</style>
</head>
<body>
<div class="pv-bar">
  <code>waterfall</code>
  <b>瀑布拆解</b>
  <span>waterfall chart</span>
  <span>分类 图表</span>
  <span>运动 无动效</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<div class="d-wf"><svg class="d-wf-svg" viewBox="0 0 320 170" role="img" aria-label="月度变化瀑布图：起点、三次增减、终点"></svg><p class="d-wf-note">每根从上根的落点起</p></div>
</div>
<p class="pv-note">先给起点、再给每次增减、最后落到终点，中间那几根悬空才是瀑布图的意义：每一段从上一段的落点开始，不是从零开始。桥接线用虚线，是在说「这两根不是并列，是接力」。增减只用一个墨色加一档透明，不靠红绿——色盲跟打印都还看得懂上下。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "waterfall";
  window.INITS = window.INITS || {};
  window.INITS["waterfall"] = (root => {
  const svg = root.querySelector('.d-wf-svg');
  if (!svg) return;
  const steps = [['期初', 120, 'total'], ['新增', 38, 'up'], ['流失', -27, 'down'], ['退款', -12, 'down'], ['期末', 119, 'total']];
  const W = 320, H = 170, L = 24, R = 8, T = 16, B = 28;
  const plotW = W - L - R, plotH = H - T - B;
  const max = 160, slot = plotW / steps.length, bw = 26;
  const y = v => T + plotH * (1 - v / max);
  const NS = 'http://www.w3.org/2000/svg';
  const mk = (tag, attrs) => { const el = document.createElementNS(NS, tag); for (const k in attrs) el.setAttribute(k, attrs[k]); return el; };
  for (let g = 0; g <= 4; g++) {
    const gy = T + plotH * g / 4;
    svg.appendChild(mk('line', { class: 'd-wf-axis', x1: L, y1: gy, x2: W - R, y2: gy }));
    const t = mk('text', { class: 'd-wf-label', x: 0, y: gy + 2.5 });
    t.textContent = String(max - g * 40);
    svg.appendChild(t);
  }
  let run = 0, prevTop = null;
  steps.forEach((s, i) => {
    const [name, val, kind] = s;
    const cx = L + slot * i + slot / 2;
    let from, to;
    if (kind === 'total') { from = 0; to = val; run = val; }
    else { from = run; to = run + val; run = to; }
    const y0 = y(from), y1 = y(to);
    const top = Math.min(y0, y1), h = Math.max(2, Math.abs(y1 - y0));
    svg.appendChild(mk('rect', { class: 'd-wf-bar ' + (kind === 'up' ? 'd-wf-up' : kind === 'down' ? 'd-wf-down' : ''), x: (cx - bw / 2).toFixed(1), y: top.toFixed(1), width: bw, height: h.toFixed(1) }));
    if (prevTop !== null) svg.appendChild(mk('line', { class: 'd-wf-link', x1: cx - slot / 2 - bw / 2, y1: prevTop.toFixed(1), x2: cx - bw / 2, y2: prevTop.toFixed(1) }));
    prevTop = kind === 'total' ? y(to) : y(to);
    const t = mk('text', { class: 'd-wf-label', x: cx, y: H - 10, 'text-anchor': 'middle' });
    t.textContent = name;
    svg.appendChild(t);
    const v = mk('text', { class: 'd-wf-val', x: cx, y: top - 4, 'text-anchor': 'middle' });
    v.textContent = kind === 'total' ? String(val) : (val > 0 ? '+' + val : String(val));
    svg.appendChild(v);
  });
});
  window.INITS["waterfall"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
