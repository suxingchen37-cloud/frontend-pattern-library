<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>横滑切页 · swipe-tab-pager · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px solid var(--line);
  --border-strong:1px solid var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-sp3{width:100%;max-width:340px}
.d-sp3-dots{display:flex;gap:5px;justify-content:center;margin-bottom:6px}
.d-sp3-dots i{width:5px;height:5px;border-radius:50%;background:var(--line);transition:width 180ms var(--ease),background-color 180ms var(--ease)}
.d-sp3-dots i.d-sp3-on{width:16px;border-radius:999px;background:var(--ink)}
.d-sp3-view{overflow:hidden;border:1px solid var(--line);border-radius:10px;background:var(--paper);touch-action:pan-y}
.d-sp3-track{display:flex;width:300%;transition:transform 260ms var(--ease-physical);will-change:transform}
.d-sp3-track section{width:calc(100% / 3);padding:18px 16px;display:flex;flex-direction:column;gap:4px}
.d-sp3-track b{font-size:13px}
.d-sp3-track span{font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<div class="pv-bar">
  <code>swipe-tab-pager</code>
  <b>横滑切页</b>
  <span>swipe tab pager</span>
  <span>分类 手势</span>
  <span>运动 物理</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<div class="d-sp3" data-pager><div class="d-sp3-dots"><i class="d-sp3-on"></i><i></i><i></i></div><div class="d-sp3-view"><div class="d-sp3-track" data-track><section><b>第一页</b><span>今天拍了 12 条，缺 1 条。</span></section><section><b>第二页</b><span>B 机位补了两条反打。</span></section><section><b>第三页</b><span>收工 22:40，比计划晚 40 分。</span></section></div></div></div>
</div>
<p class="pv-note">翻页用「三分之一屏」做阈值，不是整屏：手腕一抖就换页在手机上很烦，走满三分之一才认。页与页之间不留空隙，手指到哪儿内容到哪儿，松手再补完剩下的一段——中间加过渡会让人觉得页面在打滑。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "swipe-tab-pager";
  window.INITS = window.INITS || {};
  window.INITS["swipe-tab-pager"] = (root => {
  var box = root.querySelector('[data-pager]');
  var view = box && box.querySelector('.d-sp3-view');
  var track = box && box.querySelector('[data-track]');
  var dots = box ? [].slice.call(box.querySelectorAll('.d-sp3-dots i')) : [];
  if (!view || !track) return;
  var idx = 0, startX = 0, startY = 0, dx = 0, dragging = false, w = 0;
  var set = function (i, anim) { idx = Math.max(0, Math.min(2, i)); track.style.transition = anim ? 'transform 260ms cubic-bezier(.34,1.56,.64,1)' : 'none'; track.style.transform = 'translateX(' + (-idx * 100 / 3) + '%)'; dots.forEach(function (d, k) { d.classList.toggle('d-sp3-on', k === idx); }); };
  view.addEventListener('pointerdown', function (e) { dragging = true; startX = e.clientX; startY = e.clientY; dx = 0; w = view.clientWidth; track.style.transition = 'none'; view.setPointerCapture(e.pointerId); });
  view.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    dx = e.clientX - startX;
    var dy = e.clientY - startY;
    if (Math.abs(dy) > Math.abs(dx) + 6) return;
    track.style.transform = 'translateX(calc(' + (-idx * 100 / 3) + '% + ' + dx.toFixed(1) + 'px))';
  });
  var end = function () { if (!dragging) return; dragging = false; set(Math.abs(dx) > w / 3 ? idx + (dx < 0 ? 1 : -1) : idx, true); };
  view.addEventListener('pointerup', end);
  view.addEventListener('pointercancel', end);
  set(0, false);
});
  window.INITS["swipe-tab-pager"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
