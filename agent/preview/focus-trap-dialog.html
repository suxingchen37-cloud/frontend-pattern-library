<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>焦点陷阱 · focus-trap-dialog · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px var(--line);
  --border-strong:1px var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-ftd{position:relative;width:300px;max-width:100%;height:150px;border:1px solid var(--line);border-radius:2px;background:var(--paper);overflow:hidden;font-family:var(--sans)}
.d-ftd-page{padding:12px}
.d-ftd-line{max-width:200px;margin:0 0 10px;font-size:11px;line-height:1.7;color:var(--muted)}
.d-ftd-open{font-family:var(--mono);font-size:9px;letter-spacing:.08em;padding:5px 9px;border:1px solid var(--line);border-radius:2px;background:var(--paper);color:var(--ink);cursor:pointer;transition:border-color 120ms steps(6)}
.d-ftd-open:hover{border-color:var(--ink)}
.d-ftd-open:focus-visible{outline:1px solid var(--ink);outline-offset:2px}
.d-ftd-scrim{position:absolute;inset:0;background:var(--bg);opacity:.72}
.d-ftd-box{position:absolute;left:14px;right:14px;top:16px;padding:10px 12px 12px;border:1px solid var(--ink);border-radius:2px;background:var(--paper);box-shadow:0 12px 24px -8px #20241e26}
.d-ftd.is-open .d-ftd-box{animation:d-focus-trap-dialog-snap 120ms steps(6) both}
@keyframes d-focus-trap-dialog-snap{from{transform:translateY(6px)}to{transform:translateY(0)}}
.d-ftd-title{display:block;font-size:11px;line-height:1.5;font-weight:650;color:var(--ink)}
.d-ftd-row{display:flex;gap:6px;margin-top:8px}
.d-ftd-opt{width:52px;padding:4px 0;border:1px solid var(--line);border-radius:2px;background:var(--paper);font-family:var(--mono);font-size:9px;color:var(--muted);cursor:pointer;transition:border-color 120ms steps(6),color 120ms steps(6),background-color 120ms steps(6)}
.d-ftd-opt.is-on{border-color:var(--ink);background:var(--bg);color:var(--ink)}
.d-ftd-opt:focus-visible{outline:1px solid #2b4b8f;outline-offset:2px}
.d-ftd-caret{--i:0;display:block;width:52px;height:1px;margin-top:4px;background:#2b4b8f;transform:translateX(calc(var(--i,0) * 58px));transition:transform 120ms steps(6)}
.d-ftd-hint{display:block;margin-top:8px;font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--faint)}
</style>
</head>
<body>
<div class="pv-bar">
  <code>focus-trap-dialog</code>
  <b>焦点陷阱</b>
  <span>focus trap</span>
  <span>分类 无障碍</span>
  <span>运动 机械</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<div class="d-ftd"><div class="d-ftd-page"><p class="d-ftd-line">改字号会重排整页，所以先问一句。</p><button class="d-ftd-open" type="button" aria-haspopup="dialog">打开对话框</button></div><div class="d-ftd-scrim" hidden></div><div class="d-ftd-box" role="dialog" aria-modal="true" aria-label="套用字号确认" hidden><b class="d-ftd-title">套用这个字号？</b><div class="d-ftd-row"><button class="d-ftd-opt" type="button">套用</button><button class="d-ftd-opt" type="button">先看</button><button class="d-ftd-opt" type="button">取消</button></div><i class="d-ftd-caret" aria-hidden="true"></i><span class="d-ftd-hint">Tab 循环三点 · Esc 关</span></div></div>
</div>
<p class="pv-note">焦点不淡入：三个按钮下面那根 1px 游标用 120ms 的 steps(6) 一格格挪，像字车走位，读者能数出焦点在第几个；弹层本身也只用 120ms 六步从 6px 外落到位，不给缓动。Tab 到底回第一个、Esc 关掉并把焦点送回触发按钮——这两条缺一条，键盘用户就不敢在弹层里按回车。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "focus-trap-dialog";
  window.INITS = window.INITS || {};
  window.INITS["focus-trap-dialog"] = (root => {
  const stage = root.querySelector('.d-ftd');
  if (!stage || stage.dataset.ftd) return;
  stage.dataset.ftd = '1';
  const openBtn = stage.querySelector('.d-ftd-open');
  const box = stage.querySelector('.d-ftd-box');
  const scrim = stage.querySelector('.d-ftd-scrim');
  const caret = stage.querySelector('.d-ftd-caret');
  const opts = Array.from(stage.querySelectorAll('.d-ftd-opt'));
  const mark = el => {
    const i = opts.indexOf(el);
    opts.forEach(o => o.classList.toggle('is-on', o === el));
    caret.style.setProperty('--i', String(i < 0 ? 0 : i));
  };
  const open = () => {
    stage.classList.add('is-open');
    box.hidden = false;
    scrim.hidden = false;
    opts[0].focus();
    mark(opts[0]);
  };
  const close = () => {
    stage.classList.remove('is-open');
    box.hidden = true;
    scrim.hidden = true;
    openBtn.focus();
  };
  openBtn.addEventListener('click', open);
  scrim.addEventListener('click', close);
  opts.forEach(o => {
    o.addEventListener('focus', () => mark(o));
    o.addEventListener('click', close);
  });
  box.addEventListener('keydown', e => {
    if (e.key === 'Escape') { e.preventDefault(); close(); return; }
    if (e.key !== 'Tab' || opts.length < 2) return;
    const first = opts[0], last = opts[opts.length - 1];
    if (e.shiftKey && stage.contains(document.activeElement) && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
});
  window.INITS["focus-trap-dialog"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
