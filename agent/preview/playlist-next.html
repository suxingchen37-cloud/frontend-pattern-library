<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>播放列表接续 · playlist-next · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px solid var(--line);
  --border-strong:1px solid var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-pl{width:100%;max-width:340px;border:1px solid var(--line);border-radius:10px;background:var(--paper);overflow:hidden}
.d-pl-now{display:flex;justify-content:space-between;align-items:baseline;padding:10px 12px;border-bottom:1px solid var(--line)}
.d-pl-now b{font-size:12px}
.d-pl-now span{font-family:var(--font-mono);font-size:9px;color:var(--faint)}
.d-pl-list{list-style:none;margin:0;padding:4px 0}
.d-pl-list li{display:flex;justify-content:space-between;padding:6px 12px;font-size:11px;color:var(--muted);cursor:pointer;border-left:2px solid transparent}
.d-pl-list li.d-pl-on{color:var(--ink);border-left-color:var(--ink);background:color-mix(in srgb,var(--ink) 5%,transparent)}
.d-pl-list em{font-style:normal;font-family:var(--font-mono);font-size:9px;color:var(--faint)}
</style>
</head>
<body>
<div class="pv-bar">
  <code>playlist-next</code>
  <b>播放列表接续</b>
  <span>playlist next</span>
  <span>分类 媒体</span>
  <span>运动 机械</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<div class="d-pl" data-box><div class="d-pl-now"><b data-title>场记 · 第一条</b><span data-time>00:00 / 00:08</span></div><ol class="d-pl-list" data-list><li data-d="8" class="d-pl-on">场记 · 第一条<em>0:08</em></li><li data-d="12">场记 · 第二条<em>0:12</em></li><li data-d="6">现场环境音<em>0:06</em></li></ol></div>
</div>
<p class="pv-note">当前这首在列表里高亮并保持可见；播完自动接下一首，中间不留「播放结束」的空档。列表项显示时长而不是序号，因为下一首该放哪儿，人是用时长判断的。手动点任意一首会立刻切，不排队。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "playlist-next";
  window.INITS = window.INITS || {};
  window.INITS["playlist-next"] = (root => {
  var list = root.querySelector('[data-list]');
  var title = root.querySelector('[data-title]');
  var time = root.querySelector('[data-time]');
  if (!list) return;
  var items = [].slice.call(list.children), i = 0, t = 0, timer = 0;
  var fmt = function (s) { return '00:' + (s < 10 ? '0' : '') + s; };
  var paint = function () {
    items.forEach(function (li, k) { li.classList.toggle('d-pl-on', k === i); });
    if (title) title.textContent = items[i].firstChild.textContent.trim();
    if (time) time.textContent = fmt(Math.floor(t)) + ' / 00:' + String(items[i].dataset.d).padStart(2, '0');
  };
  var next = function () { i = (i + 1) % items.length; t = 0; paint(); };
  var start = function () { clearInterval(timer); timer = setInterval(function () { t += .25; if (t >= Number(items[i].dataset.d)) next(); paint(); }, 250); };
  items.forEach(function (li, k) { li.addEventListener('click', function () { i = k; t = 0; paint(); start(); }); });
  paint(); start();
});
  window.INITS["playlist-next"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
