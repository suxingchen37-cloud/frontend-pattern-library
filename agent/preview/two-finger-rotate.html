<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>双指旋转 · two-finger-rotate · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px var(--line);
  --border-strong:1px var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-rot{position:relative;width:300px;height:150px;color:var(--ink)}
.d-rot-stage{position:absolute;left:14px;top:16px;width:200px;height:112px;border:1px dashed var(--line);border-radius:6px}
.d-rot-axis-h{position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.d-rot-axis-v{position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--line)}
.d-rot-card{position:absolute;left:50%;top:50%;width:112px;height:72px;margin:-36px 0 0 -56px;display:flex;flex-direction:column;justify-content:space-between;padding:8px 10px;background:var(--paper);border:1px solid var(--ink);border-radius:6px;box-shadow:0 1px 0 var(--line);cursor:grab;touch-action:none;user-select:none;will-change:transform}
.d-rot-card b{font-size:11px;font-weight:650;letter-spacing:.02em}
.d-rot-card em{font-style:normal;font-family:var(--mono);font-size:9px;letter-spacing:.04em;color:var(--faint)}
.d-rot-card[data-drag]{cursor:grabbing;box-shadow:0 12px 24px -8px #20241e26}
.d-rot-card:focus-visible{outline:1px solid var(--ink);outline-offset:2px}
.d-rot-num{position:absolute;right:14px;top:16px;font-family:var(--mono);font-size:21px;line-height:1.05;letter-spacing:-.02em;color:#2b4b8f}
.d-rot-hint{position:absolute;left:14px;bottom:8px;margin:0;font-family:var(--mono);font-size:9px;line-height:1.6;color:var(--faint)}
</style>
</head>
<body>
<div class="pv-bar">
  <code>two-finger-rotate</code>
  <b>双指旋转</b>
  <span>two-finger rotate</span>
  <span>分类 手势</span>
  <span>运动 物理</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<div class="d-rot" role="group" aria-label="双指旋转">
  <div class="d-rot-stage">
    <i class="d-rot-axis-h" aria-hidden="true"></i>
    <i class="d-rot-axis-v" aria-hidden="true"></i>
    <div class="d-rot-card" tabindex="0" role="button" aria-label="按住 Shift 拖动旋转，或用左右方向键，Enter 归零"><b>旋转</b><em>Shift + 拖</em></div>
  </div>
  <b class="d-rot-num">0°</b>
  <p class="d-rot-hint">Shift + 拖 · 0° 基准</p>
</div>
</div>
<p class="pv-note">角度按「指针相对卡心的夹角」算，不按横向位移：夹角等于真的两根手指在转，位移算法一转过头就会反向跳，人立刻知道是假的。松手时 6° 内吸到 15° 的刻度上——手很难停准，吸一下才有「卡进档位」的手感，而 15° 是排版里斜线最常用的档，再密就分不出区别。读数放卡外，是因为卡在转，字跟着转就没法看。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "two-finger-rotate";
  window.INITS = window.INITS || {};
  window.INITS["two-finger-rotate"] = (root => {
  const box = root.querySelector('.d-rot');
  if (!box || box.dataset.ready) return;
  box.dataset.ready = '1';
  const card = box.querySelector('.d-rot-card');
  const num = box.querySelector('.d-rot-num');
  const hint = box.querySelector('.d-rot-hint');
  const IDLE = 'Shift + 拖 · 0° 基准';
  let rot = 0, drag = null;

  function render(v, animate) {
    rot = v;
    card.style.transition = animate ? 'transform .28s cubic-bezier(.34,1.56,.64,1)' : 'none';
    card.style.transform = 'rotate(' + v.toFixed(1) + 'deg)';
    num.textContent = Math.round(v) + '°';
    hint.textContent = Math.round(v) === 0 ? IDLE : '已转 ' + Math.round(v) + '° · 15° 一档 · Enter 归零';
  }
  function down(e) {
    if (!e.shiftKey || drag) return;
    e.preventDefault();
    card.focus({ preventScroll: true });
    const r = card.getBoundingClientRect();
    const c = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    drag = { c: c, a0: Math.atan2(e.clientY - c.y, e.clientX - c.x), r0: rot };
    card.setPointerCapture(e.pointerId);
    card.dataset.drag = '1';
    render(rot, false);
  }
  function move(e) {
    if (!drag) return;
    const a = Math.atan2(e.clientY - drag.c.y, e.clientX - drag.c.x);
    render(drag.r0 + (a - drag.a0) * 180 / Math.PI, false);
  }
  function up() {
    if (!drag) return;
    drag = null;
    delete card.dataset.drag;
    const snap = Math.round(rot / 15) * 15;
    render(Math.abs(rot - snap) < 6 ? snap : rot, true);
  }
  function key(e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      render(0, true);
      return;
    }
    const d = e.key === 'ArrowLeft' ? -15 : e.key === 'ArrowRight' ? 15 : 0;
    if (!d) return;
    e.preventDefault();
    render(rot + d, true);
  }

  card.addEventListener('pointerdown', down);
  card.addEventListener('pointermove', move);
  card.addEventListener('pointerup', up);
  card.addEventListener('pointercancel', up);
  card.addEventListener('keydown', key);
  render(0, false);
});
  window.INITS["two-finger-rotate"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
