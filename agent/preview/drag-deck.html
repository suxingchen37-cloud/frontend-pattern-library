<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>卡片堆拖拽 · drag-deck · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px solid var(--line);
  --border-strong:1px solid var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-deck{position:relative;width:260px;height:150px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink)}
.d-deck-stack{position:relative;width:100%;height:118px}
.d-deck-card{position:absolute;left:50%;top:0;width:190px;height:104px;margin-left:-95px;display:flex;flex-direction:column;justify-content:space-between;padding:8px 10px;background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 0 var(--line);transform-origin:50% 80%;cursor:grab;touch-action:none;user-select:none;will-change:transform}
.d-deck-card[data-depth="1"],.d-deck-card[data-depth="2"]{background:var(--bg)}
.d-deck-card b{font-size:56px;line-height:1;letter-spacing:-.03em;font-weight:650}
.d-deck-card em{font-style:normal;font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--faint)}
.d-deck-card[data-drag]{cursor:grabbing;box-shadow:0 12px 24px -8px #20241e26}
.d-deck-card:focus-visible{outline:1px solid var(--ink);outline-offset:2px}
.d-deck-hint{margin:0;font-family:var(--mono);font-size:9px;letter-spacing:.04em;color:var(--faint)}
</style>
</head>
<body>
<div class="pv-bar">
  <code>drag-deck</code>
  <b>卡片堆拖拽</b>
  <span>drag deck</span>
  <span>分类 拖拽</span>
  <span>运动 物理</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<div class="d-deck">
  <div class="d-deck-stack">
    <article class="d-deck-card" data-depth="2"><b>03</b><em>第三张</em></article>
    <article class="d-deck-card" data-depth="1"><b>02</b><em>第二张</em></article>
    <article class="d-deck-card" data-depth="0" tabindex="0" role="button" aria-label="第一张卡片，左右拖动或按左右方向键甩出"><b>01</b><em>左右甩我</em></article>
  </div>
  <p class="d-deck-hint">甩出速度 > 0.5px/ms 直接飞走</p>
</div>
</div>
<p class="pv-note">卡片堆通过拖动距离与速度决定回位或甩出，避免轻微调整触发误操作。序号、层间比例、间距与倾斜只是本例参数，可按内容与设备调整，无需刻意破格。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "drag-deck";
  window.INITS = window.INITS || {};
  window.INITS["drag-deck"] = (root => {
  const deck = root.querySelector('.d-deck');
  if (!deck || deck.dataset.ready) return;
  deck.dataset.ready = '1';
  const cards = [].slice.call(deck.querySelectorAll('.d-deck-card'));
  const hint = deck.querySelector('.d-deck-hint');
  const IDLE = '甩出速度 > 0.5px/ms 直接飞走';

  // 从上到下的顺序，order[0] 才是可拖的那张
  const order = cards.slice().sort((a, b) => Number(a.dataset.depth) - Number(b.dataset.depth));

  // 每深一层：下移 7px、缩 4.5%、再带一点固定斜角，才像一叠纸
  const base = i => 'translateY(' + i * 7 + 'px) rotate(' + (i === 1 ? -1.4 : i === 2 ? 1.8 : 0) + 'deg) scale(' + (1 - i * .045) + ')';

  function paint(animate) {
    order.forEach((el, i) => {
      el.dataset.depth = String(i);
      el.style.zIndex = String(10 - i);
      el.style.transition = animate ? 'transform .28s cubic-bezier(.34,1.56,.64,1)' : 'none';
      el.style.transform = base(i);
    });
  }

  let drag = null;

  function down(e) {
    const el = e.currentTarget;
    if (el !== order[0]) return;
    e.preventDefault();
    el.focus({ preventScroll: true });
    el.setPointerCapture(e.pointerId);
    el.dataset.drag = '1';
    el.style.transition = 'none';
    drag = { el: el, x0: e.clientX, y0: e.clientY, x: e.clientX, dx: 0, v: 0, t: performance.now() };
  }

  function move(e) {
    if (!drag) return;
    const now = performance.now();
    const dt = now - drag.t;
    if (dt > 0) drag.v = drag.v * .6 + ((e.clientX - drag.x) / dt) * .4;
    drag.x = e.clientX;
    drag.t = now;
    drag.dx = e.clientX - drag.x0;
    const dy = e.clientY - drag.y0;
    const rot = Math.max(-14, Math.min(14, drag.dx * .06));
    drag.el.style.transform = 'translate(' + drag.dx + 'px,' + Math.max(-8, Math.min(8, dy * .22)) + 'px) rotate(' + rot + 'deg)';
    hint.textContent = Math.abs(drag.v) > .5 ? '松手 → 飞走' : '松手 → 回弹';
  }

  function release(dir) {
    const d = drag;
    drag = null;
    if (!d) return;
    const el = d.el;
    delete el.dataset.drag;
    const fly = dir || (Math.abs(d.dx) > 78 || Math.abs(d.v) > .5 ? (d.dx || d.v) > 0 ? 1 : -1 : 0);
    if (!fly) {
      el.style.transition = 'transform .28s cubic-bezier(.34,1.56,.64,1)';
      el.style.transform = base(0);
      hint.textContent = IDLE;
      return;
    }
    el.style.transition = 'transform .18s cubic-bezier(.34,1.56,.64,1)';
    el.style.transform = 'translate(' + fly * 340 + 'px,0px) rotate(' + fly * 16 + 'deg)';
    hint.textContent = fly > 0 ? '飞走 → 下一张' : '← 飞走 · 下一张';
    setTimeout(() => {
      order.push(order.shift());
      el.style.transition = 'none';
      el.style.transform = base(2);
      order.forEach((c, i) => {
        c.dataset.depth = String(i);
        c.style.zIndex = String(10 - i);
        if (c !== el) {
          c.style.transition = 'transform .28s cubic-bezier(.34,1.56,.64,1)';
          c.style.transform = base(i);
        }
      });
      hint.textContent = IDLE;
    }, 180);
  }

  function key(e) {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    if (drag) return;
    drag = { el: order[0], x0: 0, y0: 0, x: 0, dx: 0, v: 0, t: performance.now() };
    release(e.key === 'ArrowRight' ? 1 : -1);
  }

  cards.forEach(el => {
    el.addEventListener('pointerdown', down);
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', () => release(0));
    el.addEventListener('pointercancel', () => release(0));
    el.addEventListener('keydown', key);
  });
  paint(false);
});
  window.INITS["drag-deck"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
