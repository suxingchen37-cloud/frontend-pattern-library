<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>捏合缩放 · pinch-zoom-tile · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px solid var(--line);
  --border-strong:1px solid var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-zoom{position:relative;width:300px;height:150px;color:var(--ink)}
.d-zoom-frame{position:absolute;left:12px;top:14px;width:200px;height:112px;border:1px solid var(--line);border-radius:6px;background:var(--bg);overflow:hidden}
.d-zoom-tile{position:absolute;inset:0;background:var(--paper);transform-origin:50% 50%;will-change:transform;cursor:zoom-in;touch-action:none}
.d-zoom-v{position:absolute;left:66px;top:0;bottom:0;width:1px;background:var(--line)}
.d-zoom-h{position:absolute;left:0;right:0;top:60%;height:1px;background:var(--line)}
.d-zoom-dot{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:2px;background:#2b4b8f}
.d-zoom-tile:focus-visible{outline:1px solid var(--ink);outline-offset:-3px}
.d-zoom-num{position:absolute;left:228px;top:14px;font-family:var(--mono);font-size:13px;line-height:1.2;letter-spacing:.02em;color:var(--muted)}
.d-zoom[data-edge] .d-zoom-num{color:var(--ink)}
.d-zoom-hint{position:absolute;left:12px;bottom:6px;margin:0;font-family:var(--mono);font-size:9px;line-height:1.6;color:var(--faint)}
</style>
</head>
<body>
<div class="pv-bar">
  <code>pinch-zoom-tile</code>
  <b>捏合缩放</b>
  <span>pinch zoom</span>
  <span>分类 手势</span>
  <span>运动 物理</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<div class="d-zoom" role="group" aria-label="捏合缩放">
  <div class="d-zoom-frame">
    <div class="d-zoom-tile" tabindex="0" role="group" aria-label="Ctrl 加滚轮或双指缩放，方向键也行">
      <i class="d-zoom-v" aria-hidden="true"></i>
      <i class="d-zoom-h" aria-hidden="true"></i>
      <i class="d-zoom-dot" aria-hidden="true"></i>
    </div>
  </div>
  <b class="d-zoom-num">1.00×</b>
  <p class="d-zoom-hint">1.00–2.40 之间 · 越界按 0.25 折算</p>
</div>
</div>
<p class="pv-note">上下限锁 1.00 和 2.40：1 是「刚到边」而不是随便定的下限，2.40 是这张 200px 的图放大后网点还认得出的极限。越界先按 0.25 折算再回弹，所以推到 3.00 也不会突然停住——突然停住人会以为手势坏了，而不是以为到底了。回弹 280ms 用带过冲的物理曲线，越界那一刻的「拽回来」才感觉得到。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "pinch-zoom-tile";
  window.INITS = window.INITS || {};
  window.INITS["pinch-zoom-tile"] = (root => {
  const box = root.querySelector('.d-zoom');
  if (!box || box.dataset.ready) return;
  box.dataset.ready = '1';
  const frame = box.querySelector('.d-zoom-frame');
  const tile = box.querySelector('.d-zoom-tile');
  const num = box.querySelector('.d-zoom-num');
  const hint = box.querySelector('.d-zoom-hint');
  const MIN = 1, MAX = 2.4;
  const IDLE = '1.00–2.40 之间 · 越界按 0.25 折算';
  let scale = 1, settleT = 0, pinch = null;
  const ptrs = new Map();

  function shown(s) {
    if (s > MAX) return MAX + (s - MAX) * .25;
    if (s < MIN) return MIN - (MIN - s) * .25;
    return s;
  }
  function render(s) {
    scale = s;
    const v = shown(s);
    tile.style.transform = 'scale(' + v.toFixed(3) + ')';
    num.textContent = v.toFixed(2) + '×';
    if (s > MAX || s < MIN) box.dataset.edge = s > MAX ? 'max' : 'min';
    else delete box.dataset.edge;
  }
  function settle() {
    clearTimeout(settleT);
    settleT = 0;
    tile.style.transition = 'transform .28s cubic-bezier(.34,1.56,.64,1)';
    render(Math.max(MIN, Math.min(MAX, scale)));
    hint.textContent = IDLE;
  }
  function later() {
    clearTimeout(settleT);
    settleT = setTimeout(settle, 180);
  }
  function wheel(e) {
    if (!e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    tile.style.transition = 'none';
    render(scale * Math.exp(-e.deltaY * .0022));
    hint.textContent = '缩放中 · ' + shown(scale).toFixed(2) + '×';
    later();
  }
  function pdown(e) {
    tile.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    tile.style.transition = 'none';
    if (ptrs.size === 2) {
      const a = Array.from(ptrs.values());
      pinch = { d: Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y), s: scale };
      hint.textContent = '双指张开或收拢';
    }
  }
  function pmove(e) {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (!pinch || ptrs.size !== 2) return;
    const a = Array.from(ptrs.values());
    const d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
    if (pinch.d > 8) render(pinch.s * (d / pinch.d));
  }
  function pup(e) {
    ptrs.delete(e.pointerId);
    if (ptrs.size < 2) pinch = null;
    if (ptrs.size === 0) settle();
  }
  function key(e) {
    if (e.key === '0') {
      e.preventDefault();
      tile.style.transition = 'transform .28s cubic-bezier(.34,1.56,.64,1)';
      render(1);
      hint.textContent = IDLE;
      return;
    }
    const step = e.key === 'ArrowUp' || e.key === '+' || e.key === '=' ? .2 : e.key === 'ArrowDown' || e.key === '-' ? -.2 : 0;
    if (!step) return;
    e.preventDefault();
    tile.style.transition = 'transform .28s cubic-bezier(.34,1.56,.64,1)';
    render(Math.max(MIN, Math.min(MAX, scale + step)));
    hint.textContent = '方向键每档 0.20× · 0 复位';
  }

  frame.addEventListener('wheel', wheel, { passive: false });
  tile.addEventListener('pointerdown', pdown);
  tile.addEventListener('pointermove', pmove);
  tile.addEventListener('pointerup', pup);
  tile.addEventListener('pointercancel', pup);
  tile.addEventListener('keydown', key);
  render(1);
});
  window.INITS["pinch-zoom-tile"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
