<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>时间戳与秒数转换 · timestamp-seconds-converter · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px solid var(--line);
  --border-strong:1px solid var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-timestamp-seconds-converter{width:100%;max-width:430px;min-width:0;color:var(--ink);font:inherit;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.d-timestamp-seconds-converter *,.d-timestamp-seconds-converter *::before,.d-timestamp-seconds-converter *::after{box-sizing:border-box}
.d-timestamp-seconds-converter [hidden]{display:none!important}
.d-timestamp-seconds-converter .d-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0}
.d-timestamp-seconds-converter .d-note{display:block;margin:8px 0 0;color:var(--muted);font-size:12px;min-height:1.5em}
.d-timestamp-seconds-converter label{display:block;margin:8px 0}
.d-timestamp-seconds-converter input,.d-timestamp-seconds-converter select,.d-timestamp-seconds-converter textarea,.d-timestamp-seconds-converter button{font:inherit;color:inherit;max-width:100%;min-width:0}
.d-timestamp-seconds-converter input:not([type=checkbox]):not([type=radio]),.d-timestamp-seconds-converter select,.d-timestamp-seconds-converter textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:var(--radius-control);background:var(--paper)}
.d-timestamp-seconds-converter button{padding:6px 10px;border:1px solid var(--line);border-radius:var(--radius-control);background:var(--paper);cursor:pointer}
.d-timestamp-seconds-converter button:disabled{opacity:.5;cursor:default}
.d-timestamp-seconds-converter :focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.d-timestamp-seconds-converter [aria-invalid=true]{border-color:var(--warn)!important}
.d-timestamp-seconds-converter .d-scroll{max-width:100%;overflow:auto}
.d-timestamp-seconds-converter table{width:100%;border-collapse:collapse;font-size:12px;text-align:left}
.d-timestamp-seconds-converter th,.d-timestamp-seconds-converter td{padding:7px;border-bottom:1px solid var(--line);vertical-align:top}
.d-timestamp-seconds-converter caption{text-align:left;font-weight:600;margin-bottom:8px}
.d-timestamp-seconds-converter progress{width:100%;accent-color:var(--ink)}
.d-timestamp-seconds-converter pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}
.d-timestamp-seconds-converter h3,.d-timestamp-seconds-converter p{margin:8px 0}
.d-timestamp-seconds-converter [aria-pressed=true],.d-timestamp-seconds-converter [aria-selected=true]{border-color:var(--ink);font-weight:650}
.d-timestamp-seconds-converter .d-grow{flex:1;min-width:100px}
.d-timestamp-seconds-converter summary{cursor:pointer;padding:6px 0}
.d-timestamp-seconds-converter ul,.d-timestamp-seconds-converter ol{padding-left:24px}
</style>
</head>
<body>
<div class="pv-bar">
  <code>timestamp-seconds-converter</code>
  <b>时间戳与秒数转换</b>
  <span>timestamp seconds converter</span>
  <span>分类 媒体</span>
  <span>运动 无动效</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<section class="d-timestamp-seconds-converter" aria-label="时间戳与秒数转换"><label>时间戳（时:分:秒）<input data-stamp type="text" value="00:01:02.500"></label><button type="button" data-to-seconds>换算为秒</button><label>总秒数<input data-seconds type="number" value="62.5"></label><button type="button" data-to-stamp>换算为时间戳</button><output class="d-note" data-out role="status" aria-live="polite"></output></section>
</div>
<p class="pv-note">小时可超过两位，分钟秒数须小于 60；保留到毫秒，明确换算格式。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "timestamp-seconds-converter";
  window.INITS = window.INITS || {};
  window.INITS["timestamp-seconds-converter"] = (root => {
 const q = selector => root.querySelector(selector);
 const qa = selector => [...root.querySelectorAll(selector)];
 const say = text => { const out = q('[data-out]'); if (out) out.textContent = text; };
 ((root,q,qa,say)=>{q('[data-seconds]').step='.001';q('[data-to-seconds]').onclick=()=>{const match=/^(\d{1,5}):([0-5]\d):([0-5]\d(?:\.\d{1,3})?)$/.exec(q('[data-stamp]').value.trim());if(!match){say('时间戳须为 时:分:秒，可带三位小数');return;}q('[data-seconds]').value=String(Number(match[1])*3600+Number(match[2])*60+Number(match[3]));say('时间戳已换算为秒');};q('[data-to-stamp]').onclick=()=>{const n=Number(q('[data-seconds]').value);if(!q('[data-seconds]').value.trim()||!Number.isFinite(n)||n<0||n>359999999){say('请输入 0–359999999 之间的秒数');return;}const ms=Math.round(n*1000),whole=Math.floor(ms/1000);q('[data-stamp]').value=String(Math.floor(whole/3600)).padStart(2,'0')+':'+String(Math.floor(whole/60)%60).padStart(2,'0')+':'+String(whole%60).padStart(2,'0')+'.'+String(ms%1000).padStart(3,'0');say('秒数已换算为时间戳');};})(root, q, qa, say);
});
  window.INITS["timestamp-seconds-converter"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
