<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>速度倾斜 · scroll-velocity-skew · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px var(--line);
  --border-strong:1px var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-vel{box-sizing:border-box;width:300px;max-width:100%;height:150px;overflow-x:hidden;overflow-y:auto;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.d-vel-body{padding:12px;transform-origin:50% 0;transition:transform 120ms linear;will-change:transform}
.d-vel-h{margin:0 0 4px;font-size:15px;color:var(--ink)}
.d-vel-p{margin:0 0 8px;font-size:11px;line-height:1.6;color:var(--muted)}
.d-vel-p:last-child{margin-bottom:0}
.d-vel:focus-visible{outline:1px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<div class="pv-bar">
  <code>scroll-velocity-skew</code>
  <b>速度倾斜</b>
  <span>velocity skew</span>
  <span>分类 滚动驱动</span>
  <span>运动 机械</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<div class="d-vel" tabindex="0" aria-label="速度倾斜：滚动越快字行越斜，停下回正"><div class="d-vel-body"><p class="d-vel-h">速度倾斜</p><p class="d-vel-p">滚得越快，这一叠字行越斜。</p><p class="d-vel-p">停手之后它会自己回正，不用等。</p><p class="d-vel-p">慢滚时几乎看不出，快滚时最明显。</p><p class="d-vel-p">只斜 Y 轴，横向不歪，读起来还是正的。</p><p class="d-vel-p">封顶 6°，再大就不是速度而是晃动了。</p><p class="d-vel-p">滚到底部可以再往上滚，看它反向。</p></div></div>
</div>
<p class="pv-note">倾斜 6° 封顶：再大文字基线就开始像被压扁，人先感到晃而不是快。速度按「一帧走了多少像素」算，不是按 wheel 一次跳多少——wheel 一跳 100px 不代表真速度，除以帧间隔才是；每帧靠近目标 45%，所以停下后 120ms 内自然回正。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "scroll-velocity-skew";
  window.INITS = window.INITS || {};
  window.INITS["scroll-velocity-skew"] = (root => {
  const box = root.querySelector('.d-vel');
  if (!box) return;
  const body = box.querySelector('.d-vel-body');
  if (!body) return;
  if (root.__dVelStop) root.__dVelStop();
  let raf = 0, prevY = box.scrollTop, prevT = 0, cur = 0;
  const paint = () => {
    body.style.transform = Math.abs(cur) < .05 ? '' : 'skewY(' + cur.toFixed(2) + 'deg)';
  };
  const frame = now => {
    const y = box.scrollTop;
    const dt = prevT ? Math.max(8, now - prevT) : 16;
    const perFrame = (y - prevY) * (16 / dt);
    prevY = y;
    prevT = now;
    const want = Math.max(-6, Math.min(6, perFrame * .28));
    cur = cur + (want - cur) * .45;
    if (Math.abs(want) < .05 && Math.abs(cur) < .05) {
      cur = 0; paint(); prevT = 0; raf = 0;
      return;
    }
    paint();
    raf = requestAnimationFrame(frame);
  };
  const onScroll = () => {
    if (raf) return;
    prevY = box.scrollTop;
    raf = requestAnimationFrame(frame);
  };
  box.addEventListener('scroll', onScroll, { passive: true });
  root.__dVelStop = () => {
    box.removeEventListener('scroll', onScroll);
    if (raf) cancelAnimationFrame(raf);
    raf = 0; prevT = 0; cur = 0;
    body.style.transform = '';
  };
});
  window.INITS["scroll-velocity-skew"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
