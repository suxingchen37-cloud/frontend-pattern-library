<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>音量浮层 · volume-popover · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px solid var(--line);
  --border-strong:1px solid var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-vp{position:relative;display:flex;align-items:flex-end;justify-content:center;width:100%;max-width:340px;height:180px;padding-bottom:20px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.d-vp-pop{position:absolute;bottom:64px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);box-shadow:0 12px 24px -8px #20241e26}
.d-vp-slider{position:relative;width:6px;height:88px;border-radius:999px;background:var(--line);cursor:ns-resize;touch-action:none}
.d-vp-slider i{position:absolute;left:0;right:0;bottom:0;height:70%;border-radius:999px;background:var(--ink)}
.d-vp-slider b{position:absolute;left:-5px;bottom:70%;width:16px;height:10px;margin-bottom:-5px;border:1px solid var(--ink);border-radius:2px;background:var(--paper)}
.d-vp-pop span{font-family:var(--font-mono);font-size:9px;color:var(--faint)}
.d-vp-btn{padding:5px 14px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink);font:inherit;font-size:11px;cursor:pointer}
</style>
</head>
<body>
<div class="pv-bar">
  <code>volume-popover</code>
  <b>音量浮层</b>
  <span>volume popover</span>
  <span>分类 媒体</span>
  <span>运动 无动效</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<div class="d-vp" data-box><div class="d-vp-pop" data-pop hidden><div class="d-vp-slider" data-slider><i data-fill></i><b data-knob></b></div><span data-val>70</span></div><button type="button" class="d-vp-btn" data-btn aria-expanded="false">音量</button></div>
</div>
<p class="pv-note">点喇叭弹出竖直滑杆，不是横在按钮下面：竖条占的横向空间小，手指上下滑也更自然。滑杆里画出「当前音量」的填充段，光有一个小圆点时人不知道现在多大声。静音后图标变叉，再点恢复上一次的音量，不是回到满格。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "volume-popover";
  window.INITS = window.INITS || {};
  window.INITS["volume-popover"] = (root => {
  var pop = root.querySelector('[data-pop]');
  var btn = root.querySelector('[data-btn]');
  var slider = root.querySelector('[data-slider]');
  var fill = root.querySelector('[data-fill]');
  var knob = root.querySelector('[data-knob]');
  var val = root.querySelector('[data-val]');
  if (!pop || !btn || !slider || !fill) return;
  var v = .7, last = .7, drag = false;
  var paint = function () {
    fill.style.height = (v * 100).toFixed(0) + '%';
    if (knob) knob.style.bottom = (v * 100).toFixed(0) + '%';
    if (val) val.textContent = String(Math.round(v * 100));
    btn.textContent = v === 0 ? '静音' : '音量 ' + Math.round(v * 100);
  };
  btn.addEventListener('click', function () {
    if (v === 0) { v = last || .7; paint(); pop.hidden = true; btn.setAttribute('aria-expanded', 'false'); return; }
    pop.hidden = !pop.hidden;
    btn.setAttribute('aria-expanded', pop.hidden ? 'false' : 'true');
  });
  var set = function (e) { var r = slider.getBoundingClientRect(); v = Math.max(0, Math.min(1, 1 - (e.clientY - r.top) / r.height)); if (v > 0) last = v; paint(); };
  slider.addEventListener('pointerdown', function (e) { drag = true; slider.setPointerCapture(e.pointerId); set(e); });
  slider.addEventListener('pointermove', function (e) { if (drag) set(e); });
  var end = function () { drag = false; };
  slider.addEventListener('pointerup', end);
  slider.addEventListener('pointercancel', end);
  paint();
});
  window.INITS["volume-popover"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
