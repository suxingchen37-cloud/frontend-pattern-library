<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>标签球 · tag-sphere · 预览</title>
<script>document.documentElement.dataset.theme = (location.search || "").indexOf("theme=night") !== -1 ? "night" : "paper";</script>
<style>
:root{
  /* 纸与墨 */
  --bg:#f3f1e9;
  --paper:#fbfaf5;
  --ink:#20241e;
  --muted:#6b7860;
  --faint:#94a184;
  --line:#deded2;
  /* 油墨与标记笔 */
  --ink-vermilion:#c2402a; /* 朱 */
  --ink-indigo:#2b4b8f; /* 靛 */
  --ink-yellow:#e8c34a; /* 黄 */
  --marker-hi:#d9f875;
  --ok:#3d7347;
  --warn:#a8502f;
  /* 字号（px） */
  --fs-9:9px;
  --fs-11:11px;
  --fs-13:13px;
  --fs-15:15px;
  --fs-21:21px;
  --fs-34:34px;
  --fs-56:56px;
  --fs-96:96px;
  /* 行高与字距 */
  --lh-body:1.7;
  --lh-note:1.6;
  --lh-display:1.05;
  --tracking-display:-0.03em;
  --tracking-body:0;
  --tracking-mono-label:0.08em; /* 等宽小标签 */
  /* 字体 */
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Songti SC,STSong,Noto Serif CJK SC,SimSun,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 间距（px） */
  --sp-4:4px;
  --sp-8:8px;
  --sp-12:12px;
  --sp-16:16px;
  --sp-24:24px;
  --sp-40:40px;
  --sp-64:64px;
  --sp-96:96px;
  /* 圆角（px） */
  --radius-table:0px;
  --radius-tag:2px;
  --radius-control:6px;
  --radius-card:10px;
  --radius-pill:999px;
  /* 时长（ms） */
  --dur-feedback:120ms;
  --dur-move:180ms;
  --dur-reveal:280ms;
  --dur-ambient:900ms;
  /* 曲线 */
  --ease-mechanical:linear; /* tokens: linear | steps(6) */
  --ease-physical:cubic-bezier(.34,1.56,.64,1); /* 物理 */
  --ease-print:cubic-bezier(.2,.75,.25,1); /* 印刷 */
  /* 阴影与描边 */
  --shadow-divider:0 1px 0 var(--line);
  --shadow-press:inset 0 1px 0 #fff5;
  --shadow-overlay:0 12px 24px -8px #20241e26;
  --border-default:1px var(--line);
  --border-strong:1px var(--ink);
  /* 兼容别名：老资产 css 里的短名，值仍然是 tokens 里的同一个值 */
  --sans:var(--font-sans);
  --serif:var(--font-serif);
  --mono:var(--font-mono);
  --lime:var(--marker-hi);
  --coral:var(--ink-vermilion);
  --blue:var(--ink-indigo);
  --mint:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --lime-soft:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --lav:color-mix(in srgb,var(--ink-indigo) 14%,var(--paper));
  --ease:var(--ease-print);
  --ease-out:var(--ease-print);
  --ease-spring:var(--ease-physical);
  --r:var(--radius-card);
  --sp:var(--sp-4);
}
[data-theme="night"]{
  --bg:#121610;
  --paper:#191d18;
  --ink:#e8efe0;
  --muted:#a9b8a0;
  --faint:#7b8a72;
  --line:#2c3327;
  --ok:#8fd3a4;
  --warn:#f0a184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-15);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--line);background:var(--paper);font-size:var(--fs-11);color:var(--muted)}
.pv-bar b{font-size:var(--fs-13);font-weight:650;color:var(--ink)}
.pv-bar code{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--faint)}
.pv-bar .pv-grow{flex:1}
.pv-bar button{font:inherit;font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--ink);cursor:pointer}
.pv-bar button:hover{border-color:var(--ink)}
.pv-stage{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--sp-12);padding:var(--sp-40) var(--sp-24)}
.pv-note{max-width:64ch;margin:0 auto;padding:0 var(--sp-24) var(--sp-40);color:var(--muted);font-size:var(--fs-11);line-height:var(--lh-note)}
/* ——— 本条 css（原样注入，单页里不需要作用域） ——— */
.d-ts-stage{position:relative;width:100%;max-width:340px;height:190px;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:var(--bg);touch-action:none;cursor:grab}
.d-ts-stage.d-ts-drag{cursor:grabbing}
.d-ts-core{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--ink);opacity:.35}
.d-ts-tag{position:absolute;left:50%;top:50%;padding:3px 8px;border:1px solid var(--line);border-radius:999px;background:var(--paper);font-size:11px;line-height:1.2;white-space:nowrap;color:var(--ink);will-change:transform,opacity}
</style>
</head>
<body>
<div class="pv-bar">
  <code>tag-sphere</code>
  <b>标签球</b>
  <span>tag sphere</span>
  <span>分类 3D 与透视</span>
  <span>运动 物理</span>
  <span class="pv-grow"></span>
  <button type="button" id="pv-toggle">切换夜间</button>
</div>
<div class="pv-stage" id="pv-stage">
<div class="d-ts-stage" aria-label="标签球：可以用手拖动旋转"><div class="d-ts-core"></div><span class="d-ts-tag">排版</span><span class="d-ts-tag">留白</span><span class="d-ts-tag">描边</span><span class="d-ts-tag">节奏</span><span class="d-ts-tag">油墨</span><span class="d-ts-tag">纸感</span><span class="d-ts-tag">对齐</span><span class="d-ts-tag">层级</span></div>
</div>
<p class="pv-note">每个词的位置用等距球面点算，不手写坐标：手写的坐标会挤在赤道。远小近大按 260 的焦距算，透明度跟着深度掉，最远的降到 35%——不是为了好看，是为了让眼睛分得清前后。拖一下会带着惯性转，松手后慢慢停，停的位置由松手那一下的速度决定。</p>
<script>
(function () {
  var root = document.getElementById('pv-stage');
  root.dataset.item = "tag-sphere";
  window.INITS = window.INITS || {};
  window.INITS["tag-sphere"] = (root => {
  const stage = root.querySelector('.d-ts-stage');
  if (!stage) return;
  const tags = [...stage.querySelectorAll('.d-ts-tag')];
  if (!tags.length) return;
  const R = 96, FOV = 260;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const pts = tags.map((el, i) => {
    const y = 1 - (i / (tags.length - 1)) * 2;
    const rad = Math.sqrt(Math.max(0, 1 - y * y));
    const th = i * 2.399963229728653;
    return { el, x: Math.cos(th) * rad, y, z: Math.sin(th) * rad };
  });
  let ry = 0.4, rx = -0.18, vy = reduce ? 0 : 0.0035, vx = 0, raf = 0, live = false, drag = null;
  const draw = () => {
    const cy = Math.cos(ry), sy = Math.sin(ry), cx = Math.cos(rx), sx = Math.sin(rx);
    for (const p of pts) {
      const x1 = p.x * cy - p.z * sy;
      const z1 = p.x * sy + p.z * cy;
      const y1 = p.y * cx - z1 * sx;
      const z2 = p.y * sx + z1 * cx;
      const s = FOV / (FOV + z2 * R);
      p.el.style.transform = 'translate3d(' + (x1 * R * s).toFixed(1) + 'px,' + (y1 * R * s).toFixed(1) + 'px,0) translate(-50%,-50%) scale(' + s.toFixed(3) + ')';
      p.el.style.opacity = (0.35 + 0.65 * ((s - 0.62) / 0.55)).toFixed(3);
      p.el.style.zIndex = String(Math.round((z2 + 1) * 100));
    }
  };
  const tick = () => {
    if (!live) return;
    ry += vy; rx += vx;
    rx = Math.max(-1.1, Math.min(1.1, rx));
    vy *= 0.96; vx *= 0.9;
    if (Math.abs(vy) < 0.0004) vy = reduce ? 0 : 0.0035;
    draw();
    raf = requestAnimationFrame(tick);
  };
  const start = () => { if (!live) { live = true; raf = requestAnimationFrame(tick); } };
  const stop = () => { live = false; cancelAnimationFrame(raf); };
  stage.addEventListener('pointerdown', e => {
    drag = { x: e.clientX, y: e.clientY };
    stage.classList.add('d-ts-drag');
    stage.setPointerCapture(e.pointerId);
    vy = 0; vx = 0;
  });
  stage.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag = { x: e.clientX, y: e.clientY };
    ry += dx * 0.006; rx = Math.max(-1.1, Math.min(1.1, rx + dy * 0.004));
    vx = dy * 0.0006; vy = 0;
    draw();
  });
  const release = () => { drag = null; stage.classList.remove('d-ts-drag'); };
  stage.addEventListener('pointerup', release);
  stage.addEventListener('pointercancel', release);
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(es => es.forEach(x => (x.isIntersecting ? start() : stop())), { rootMargin: '120px' }).observe(stage);
  } else start();
  draw();
});
  window.INITS["tag-sphere"](root);
  document.getElementById('pv-toggle').addEventListener('click', function () {
    var d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'night' ? 'paper' : 'night';
  });
})();
</script>
</body>
</html>
