<div class="d-tf3"><div class="d-toc-follow-tfnav3"><button type="button" data-goto3="0" class="d-toc-follow-on">01 起点</button><button type="button" data-goto3="1">02 字距</button><button type="button" data-goto3="2">03 留白</button></div><div class="d-toc-follow-tfscroll3" data-tfscroll><section data-sec3><b>01 起点</b><p>先决定阅读从哪里开始。标题是入口，首段是台阶。</p><p>台阶太高，人就不上去了。</p></section><section data-sec3><b>02 字距</b><p>字距不是越紧越省空间。远看时，眼睛需要空隙把笔画分开。</p><p>同一块底板，字距从 2 厘米放到 5 厘米，十五米外反而更清楚。</p></section><section data-sec3><b>03 留白</b><p>留白不是空着，是让重要的东西有地方站。</p><p>把字排松一点，空气就进来了。</p></section></div></div>
