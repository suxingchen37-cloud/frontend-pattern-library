<div class="d-sc" role="group" aria-label="滚动计数：向下滚动，三个数字从 0 走到目标值"><div class="d-sc-scroll" tabindex="0"><div class="d-sc-head"><div class="d-sc-cell"><span class="d-sc-num d-sc-n1"></span><span class="d-sc-k">印张</span></div><div class="d-sc-cell"><span class="d-sc-num d-sc-n2"></span><span class="d-sc-k">校次</span></div><div class="d-sc-cell"><span class="d-sc-num d-sc-n3"></span><span class="d-sc-k">成品率</span></div></div><p class="d-sc-p">第一版上机，墨辊先空转两圈，让油墨在辊面上匀开。</p><p class="d-sc-p">样张从收纸台取下来，对着色标看三块油墨的深浅。</p><p class="d-sc-p">压力调小半格，网点就不再往纸里陷。</p><p class="d-sc-p">把样张折一道，看折缝处的墨色有没有匀。</p><p class="d-sc-p">换第二版之前，先洗掉墨辊上的旧色，免得串色。</p><p class="d-sc-p">刀口的毛边用指尖抹过，摸得出来就该磨刀了。</p><p class="d-sc-p">成品按印次编号，签样一起装进牛皮纸袋。</p><p class="d-sc-p">这一卷的账记完了，数字停在最后一次校色的位置。</p></div></div>
