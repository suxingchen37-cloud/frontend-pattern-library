<div class="d-en"><p class="d-en-body">显色指数低于八十时，红色会明显发灰<sup><a href="#" class="d-en-ref" data-n="1">1</a></sup>，这一点在布料上最明显<sup><a href="#" class="d-en-ref" data-n="2">2</a></sup>。</p><ol class="d-en-list"><li id="d-en-1"><b>1</b><span>《照明设计手册》第三版，第 42 页。</span></li><li id="d-en-2"><b>2</b><span>2026 年 3 月实测，同色布在两种灯下的照片对比。</span></li></ol></div>
