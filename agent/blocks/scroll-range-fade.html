<div class="d-rg" tabindex="0" aria-label="区间淡出：卡片在指定滚动区间里退场"><div class="d-rg-body"><p class="d-rg-h">区间淡出</p><p class="d-rg-p">上面这一段是垫高用的：先让卡片在视口里正常出现，往下滚才看它贴上沿退场；没有这段，卡片一进来就已经在半透明里，看不出「开始退场」那一下。</p><div class="d-rg-card"><p class="d-rg-t">cover 55% → 95%</p><p class="d-rg-k">animation-range: cover 55% / cover 95%</p></div><p class="d-rg-p">这一段同样是垫高，好让卡片能贴着上沿走完整个区间。滚到底部时它只剩一圈轮廓和 15% 的墨；往回滚，它会一路还原，不需要点任何按钮，这也是交给滚动位置而不是脚本的原因。</p></div></div>
