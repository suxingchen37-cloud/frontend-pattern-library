<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>场记 SLATE · 拍摄日报</title>
<style>
:root{
  --bg:#f3f1e9;--paper:#fbfaf5;--ink:#20241e;--muted:#6b7860;--faint:#94a184;--line:#deded2;
  --ink-vermilion:#c2402a;--ink-indigo:#2b4b8f;--ink-yellow:#e8c34a;--marker-hi:#d9f875;
  --ok:#3d7347;--warn:#a8502f;
  --sp-4:4px;--sp-8:8px;--sp-12:12px;--sp-16:16px;--sp-24:24px;--sp-40:40px;--sp-64:64px;--sp-96:96px;
  --r-tag:2px;--r-control:6px;--r-card:10px;--r-pill:999px;
  --ease-print:cubic-bezier(.2,.75,.25,1);--ease-physical:cubic-bezier(.34,1.56,.64,1);
  --shadow-overlay:0 12px 24px -8px #20241e26;--shadow-divider:0 1px 0 var(--line);
  --font-sans:Inter,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --mono:var(--font-mono);--ease:var(--ease-print);
}
[data-theme="night"]{--bg:#121610;--paper:#191d18;--ink:#e8efe0;--muted:#a9b8a0;--faint:#7b8a72;--line:#2c3327;--ok:#8fd3a4;--warn:#f0a184}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.db-shell{display:grid;grid-template-columns:196px minmax(0,1fr);min-height:100vh}
html.embedded .db-side{padding-top:16px}

/* 侧栏 */
.db-side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:var(--sp-24);padding:20px 14px;border-right:1px solid var(--line);background:var(--paper)}
.db-brand{display:flex;align-items:baseline;gap:6px;font-weight:700}
.db-brand i{font-family:var(--font-mono);font-style:normal;font-size:9px;letter-spacing:.14em;color:var(--faint);font-weight:400}
.db-nav{display:flex;flex-direction:column;gap:2px}
.db-nav a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--r-control);color:var(--muted);text-decoration:none;font-size:13px;transition:background-color 160ms var(--ease),color 160ms var(--ease)}
.db-nav a i{width:4px;height:4px;border-radius:50%;background:var(--line)}
.db-nav a[data-on]{background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink)}
.db-nav a[data-on] i{background:var(--ink)}
.db-nav a:hover{color:var(--ink)}
.db-side .spacer{flex:1}
.db-user{display:flex;gap:10px;align-items:center;padding-top:var(--sp-16);border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.db-avatar{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--font-mono);font-size:9px}

/* 主区 */
.db-main{min-width:0;padding:0 var(--sp-24) var(--sp-40)}
.db-top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:var(--sp-12);flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--line);background:var(--bg)}
.db-crumb{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;color:var(--faint)}
.db-top .grow{flex:1}
.db-search{display:flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--paper)}
.db-search input{border:0;background:transparent;color:inherit;font:inherit;font-size:12px;width:130px;outline:none}
.db-top button{font:inherit;font-size:11px;padding:5px 12px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--paper);color:var(--ink);cursor:pointer}
.db-top button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.db-title{display:flex;align-items:baseline;gap:var(--sp-12);flex-wrap:wrap;padding:var(--sp-24) 0 0}
.db-title h1{margin:0;font-size:21px;letter-spacing:-.01em}
.db-title span{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--faint)}

/* KPI */
.db-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-12);margin-top:var(--sp-16)}
.db-kpi{padding:var(--sp-16);border:1px solid var(--line);border-radius:var(--r-card);background:var(--paper)}
.db-kpi b{display:block;font-family:var(--font-mono);font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.db-kpi span{display:block;margin-top:2px;font-size:11px;color:var(--muted)}
.db-kpi svg{display:block;width:100%;height:26px;margin-top:var(--sp-8);overflow:visible}
.db-kpi path{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.db-kpi .down{color:var(--ink-vermilion)}
.db-kpi em{font-style:normal;font-family:var(--font-mono);font-size:10px;color:var(--faint);float:right}

/* 图表 */
.db-panel{margin-top:var(--sp-16);border:1px solid var(--line);border-radius:var(--r-card);background:var(--paper);overflow:hidden}
.db-panel-head{display:flex;align-items:center;gap:var(--sp-12);padding:12px var(--sp-16);border-bottom:1px solid var(--line)}
.db-panel-head b{font-size:13px;font-weight:600}
.db-panel-head span{margin-left:auto;font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;color:var(--faint)}
.db-chart{position:relative;padding:var(--sp-16)}
.db-chart svg{display:block;width:100%;height:190px}
.db-bar{fill:color-mix(in srgb,var(--ink) 80%,var(--paper));transition:fill 160ms var(--ease)}
.db-bar:hover{fill:var(--ink-vermilion)}
.db-axis{stroke:var(--line);stroke-width:1}
.db-lab{fill:var(--faint);font-family:var(--font-mono);font-size:8px}
.db-tip{position:absolute;padding:3px 8px;border-radius:var(--r-tag);background:var(--ink);color:var(--paper);font-family:var(--font-mono);font-size:9px;pointer-events:none;opacity:0;transition:opacity 120ms var(--ease)}
.db-tip.on{opacity:1}

/* 表格 */
.db-tools{display:flex;gap:var(--sp-8);flex-wrap:wrap;padding:12px var(--sp-16);border-bottom:1px solid var(--line)}
.db-chip{padding:4px 11px;border:1px solid var(--line);border-radius:var(--r-pill);background:transparent;color:var(--muted);font:inherit;font-size:11px;cursor:pointer;transition:background-color 160ms var(--ease),color 160ms var(--ease),border-color 160ms var(--ease)}
.db-chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.db-table{width:100%;border-collapse:collapse;font-size:13px}
.db-table th{position:sticky;top:0;background:var(--paper);text-align:left;padding:9px var(--sp-16);border-bottom:1px solid var(--line);font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;color:var(--faint);font-weight:400;white-space:nowrap}
.db-table th button{all:unset;cursor:pointer;font:inherit;color:inherit}
.db-table th button:hover{color:var(--ink)}
.db-table td{padding:10px var(--sp-16);border-bottom:1px solid var(--line)}
.db-table tbody tr{cursor:pointer;transition:background-color 120ms var(--ease)}
.db-table tbody tr:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.db-table tbody tr[aria-selected="true"]{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.db-table .num{font-family:var(--font-mono);font-size:11px}
.db-tag{display:inline-flex;padding:1px 8px;border:1px solid var(--line);border-radius:var(--r-pill);font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;color:var(--muted)}
.db-tag.ok{border-color:var(--ok);color:var(--ok)}
.db-tag.warn{border-color:var(--warn);color:var(--warn)}
.db-empty{display:grid;place-items:center;gap:6px;padding:56px var(--sp-16);text-align:center}
.db-empty b{font-size:13px}
.db-empty p{margin:0;font-size:12px;color:var(--muted);max-width:30ch}
.db-empty button{margin-top:6px;font:inherit;font-size:11px;padding:4px 12px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--paper);color:var(--ink);cursor:pointer}

/* 详情抽屉 */
.db-drawer{position:fixed;top:0;right:0;bottom:0;width:320px;z-index:40;padding:20px;border-left:1px solid var(--line);background:var(--paper);box-shadow:var(--shadow-overlay);transform:translateX(100%);transition:transform 280ms var(--ease-print);overflow:auto}
.db-drawer.on{transform:none}
.db-drawer h2{margin:0 0 var(--sp-16);font-size:15px}
.db-drawer .row{display:flex;justify-content:space-between;gap:var(--sp-12);padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}
.db-drawer .row b{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--faint);font-weight:400}
.db-drawer .close{position:absolute;right:16px;top:16px;border:0;background:transparent;color:var(--muted);font-size:15px;cursor:pointer}
.db-drawer .note{margin-top:var(--sp-16);font-size:12px;color:var(--muted)}
@media (max-width:1000px){
  .db-shell{grid-template-columns:1fr}
  .db-side{position:static;height:auto;flex-direction:row;align-items:center;gap:var(--sp-12);border-right:0;border-bottom:1px solid var(--line);padding:10px var(--sp-16)}
  .db-side .spacer{flex:1}
  .db-nav{flex-direction:row;overflow:auto}
  .db-user{border-top:0;padding-top:0}
  .db-kpis{grid-template-columns:1fr 1fr}
  .db-drawer{width:100%}
}
@media (prefers-reduced-motion:reduce){.db-drawer,.db-bar,.db-chip,.db-nav a{transition:none}}
</style>
</head>
<body>
<div class="db-shell">
  <aside class="db-side">
    <span class="db-brand">场记 SLATE <i>v2.4</i></span>
    <nav class="db-nav">
      <a href="#" data-on><i></i>日报</a>
      <a href="#"><i></i>场次</a>
      <a href="#"><i></i>素材</a>
      <a href="#"><i></i>设置</a>
    </nav>
    <span class="spacer"></span>
    <div class="db-user"><span class="db-avatar">Z</span><span>组 A · 现场</span></div>
  </aside>

  <main class="db-main">
    <div class="db-top">
      <span class="db-crumb">项目 / 长夜 / 拍摄日报</span>
      <span class="grow"></span>
      <label class="db-search"><input id="dbQ" type="search" placeholder="搜场次或条号" aria-label="搜索场次或条号"></label>
      <button type="button" id="dbExport">导出两页</button>
      <button type="button" id="dbTheme">夜间</button>
    </div>

    <div class="db-title">
      <h1>第 12 拍摄日</h1>
      <span>2026-10-23 · 组 A · 47 条入库</span>
    </div>

    <section class="db-kpis" aria-label="今日指标">
      <div class="db-kpi"><b id="k1">47</b><span>今日条数</span><svg data-v="18,26,22,31,29,38,44,47" aria-hidden="true"></svg></div>
      <div class="db-kpi"><b id="k2">43</b><span>可用条数<em>91%</em></span><svg data-v="14,22,20,28,26,34,40,43" aria-hidden="true"></svg></div>
      <div class="db-kpi"><b class="down" id="k3">2</b><span>缺条<em>需补拍</em></span><svg data-v="4,3,5,2,3,2,3,2" aria-hidden="true"></svg></div>
      <div class="db-kpi"><b id="k4">11:40</b><span>平均收工</span><svg data-v="12,11,10,11,9,8,8,9" aria-hidden="true"></svg></div>
    </section>

    <section class="db-panel">
      <div class="db-panel-head"><b>每场条数</b><span>今天 6 场 · 悬停看单场</span></div>
      <div class="db-chart">
        <svg id="dbBars" viewBox="0 0 640 190" role="img" aria-label="六个场次的条数柱状图"></svg>
        <span class="db-tip" id="dbTip"></span>
      </div>
    </section>

    <section class="db-panel">
      <div class="db-tools" role="group" aria-label="筛选场次">
        <button class="db-chip" type="button" data-f="all" aria-pressed="true">全部 6</button>
        <button class="db-chip" type="button" data-f="warn" aria-pressed="false">有缺条 2</button>
        <button class="db-chip" type="button" data-f="done" aria-pressed="false">已完成 4</button>
      </div>
      <table class="db-table">
        <thead>
          <tr>
            <th>场次</th>
            <th><button type="button" id="dbSort">条数 <span id="dbSortMark">↓</span></button></th>
            <th>机位</th>
            <th>时码</th>
            <th>状态</th>
          </tr>
        </thead>
        <tbody id="dbBody"></tbody>
      </table>
      <div id="dbEmpty" class="db-empty" hidden>
        <b>这个筛选下没有场次</b>
        <p>今天六场都拍完了；换「全部」看看，或者去「素材」页查缺条。</p>
        <button type="button" id="dbReset">回到全部</button>
      </div>
    </section>
  </main>
</div>

<aside class="db-drawer" id="dbDrawer" aria-label="场次详情" aria-hidden="true">
  <button class="close" type="button" id="dbClose" aria-label="关闭">×</button>
  <h2 id="dbdTitle">场次</h2>
  <div id="dbdRows"></div>
  <p class="note" id="dbdNote"></p>
</aside>

<script>
function applyTheme(v){ document.documentElement.setAttribute('data-theme', v === 'night' ? 'night' : 'paper'); var b = document.getElementById('dbTheme'); if (b) b.textContent = v === 'night' ? '纸色' : '夜间'; }
var q = new URLSearchParams(location.search).get('theme');
if (q) applyTheme(q);
if (window.self !== window.top) document.documentElement.classList.add('embedded');
addEventListener('message', function (e) { if (e.data && e.data.type === 'site-theme') applyTheme(e.data.value); });
document.getElementById('dbTheme').addEventListener('click', function () {
  var night = document.documentElement.getAttribute('data-theme') !== 'night';
  applyTheme(night ? 'night' : 'paper');
  try { parent.postMessage({ type: 'site-theme', value: night ? 'night' : 'paper' }, '*'); } catch (err) {}
});

var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* 迷你趋势：每个 KPI 一条 28px 高的折线 */
(function () {
  var NS = 'http://www.w3.org/2000/svg';
  [].slice.call(document.querySelectorAll('.db-kpi svg')).forEach(function (svg) {
    var vals = (svg.dataset.v || '').split(',').map(Number);
    if (!vals.length) return;
    svg.setAttribute('viewBox', '0 0 120 26');
    svg.setAttribute('preserveAspectRatio', 'none');
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals), span = max - min || 1;
    var d = vals.map(function (v, i) { return (i ? 'L' : 'M') + (i * 120 / (vals.length - 1)).toFixed(1) + ' ' + (24 - (v - min) / span * 22).toFixed(1); }).join(' ');
    var p = document.createElementNS(NS, 'path');
    p.setAttribute('d', d);
    svg.appendChild(p);
  });
})();

/* 柱状图 + 悬停读数 */
(function () {
  var svg = document.getElementById('dbBars');
  if (!svg) return;
  var rows = [['S01', 6], ['S02', 9], ['S03', 12], ['S04', 8], ['S05', 7], ['S06', 5]];
  var W = 640, H = 190, L = 26, R = 10, T = 16, B = 30;
  var plotW = W - L - R, plotH = H - T - B, max = 14;
  var slot = plotW / rows.length, bw = Math.min(56, slot - 18);
  var NS = 'http://www.w3.org/2000/svg';
  var mk = function (tag, attrs) { var el = document.createElementNS(NS, tag); for (var k in attrs) el.setAttribute(k, attrs[k]); return el; };
  var tip = document.getElementById('dbTip');
  var y = function (v) { return T + plotH * (1 - v / max); };
  for (var g = 0; g <= 3; g++) {
    svg.appendChild(mk('line', { class: 'db-axis', x1: L, y1: T + plotH * g / 3, x2: W - R, y2: T + plotH * g / 3 }));
    var lab = mk('text', { class: 'db-lab', x: 0, y: T + plotH * g / 3 + 3 });
    lab.textContent = String(Math.round(max - g * max / 3));
    svg.appendChild(lab);
  }
  rows.forEach(function (r, i) {
    var cx = L + slot * i + slot / 2;
    var rect = mk('rect', { class: 'db-bar', x: (cx - bw / 2).toFixed(1), y: y(r[1]).toFixed(1), width: bw, height: (y(0) - y(r[1])).toFixed(1), rx: 2 });
    svg.appendChild(rect);
    var t = mk('text', { class: 'db-lab', x: cx, y: H - 10, 'text-anchor': 'middle' });
    t.textContent = r[0];
    svg.appendChild(t);
    rect.addEventListener('pointerenter', function () {
      tip.textContent = r[0] + ' · ' + r[1] + ' 条';
      tip.style.left = (cx / W * 100).toFixed(1) + '%';
      tip.style.top = (y(r[1]) / H * 100).toFixed(1) + '%';
      tip.classList.add('on');
    });
    rect.addEventListener('pointerleave', function () { tip.classList.remove('on'); });
  });
})();

/* 表格：筛选 + 排序 + 详情 */
(function () {
  var data = [
    { id: 'S01', n: 6, cam: 'A / B', tc: '09:12', st: 'done', note: '客厅推门，三条可用' },
    { id: 'S02', n: 9, cam: 'A', tc: '10:04', st: 'done', note: '厨房，手部特写为主' },
    { id: 'S03', n: 12, cam: 'A / B', tc: '11:38', st: 'warn', note: '缺 S03T04，38 秒' },
    { id: 'S04', n: 8, cam: 'B', tc: '13:20', st: 'done', note: '楼道，补了两条反打' },
    { id: 'S05', n: 7, cam: 'A', tc: '14:55', st: 'done', note: '卧室，光比调整三次' },
    { id: 'S06', n: 5, cam: 'A / B', tc: '16:10', st: 'warn', note: '缺 S06T02，机位 B 未打板' }
  ];
  var body = document.getElementById('dbBody');
  var empty = document.getElementById('dbEmpty');
  var table = document.querySelector('.db-table');
  var chips = [].slice.call(document.querySelectorAll('[data-f]'));
  var sortBtn = document.getElementById('dbSort');
  var sortMark = document.getElementById('dbSortMark');
  var q = document.getElementById('dbQ');
  var drawer = document.getElementById('dbDrawer');
  var filter = 'all', desc = true, term = '';

  function rows() {
    var list = data.filter(function (r) {
      if (filter === 'warn' && r.st !== 'warn') return false;
      if (filter === 'done' && r.st !== 'done') return false;
      if (term && (r.id + r.note).toLowerCase().indexOf(term) < 0) return false;
      return true;
    });
    list.sort(function (a, b) { return desc ? b.n - a.n : a.n - b.n; });
    return list;
  }
  function render() {
    var list = rows();
    body.textContent = '';
    table.hidden = !list.length;
    empty.hidden = !!list.length;
    list.forEach(function (r) {
      var tr = document.createElement('tr');
      tr.tabIndex = 0;
      var cells = [r.id, r.n + ' 条', r.cam, r.tc];
      cells.forEach(function (v, i) {
        var td = document.createElement('td');
        if (i === 1 || i === 3) td.className = 'num';
        td.textContent = v;
        tr.appendChild(td);
      });
      var td = document.createElement('td');
      var tag = document.createElement('span');
      tag.className = 'db-tag ' + (r.st === 'warn' ? 'warn' : 'ok');
      tag.textContent = r.st === 'warn' ? '有缺条' : '已完成';
      td.appendChild(tag);
      tr.appendChild(td);
      tr.addEventListener('click', function () { open(r, tr); });
      tr.addEventListener('keydown', function (e) { if (e.key === 'Enter') open(r, tr); });
      body.appendChild(tr);
    });
  }
  function open(r, tr) {
    [].slice.call(body.children).forEach(function (x) { x.removeAttribute('aria-selected'); });
    tr.setAttribute('aria-selected', 'true');
    document.getElementById('dbdTitle').textContent = r.id + ' · ' + r.n + ' 条';
    var rowsBox = document.getElementById('dbdRows');
    rowsBox.textContent = '';
    [['机位', r.cam], ['首条时码', r.tc], ['状态', r.st === 'warn' ? '有缺条' : '已完成']].forEach(function (p) {
      var row = document.createElement('div');
      row.className = 'row';
      var b = document.createElement('b'); b.textContent = p[0];
      var s = document.createElement('span'); s.textContent = p[1];
      row.appendChild(b); row.appendChild(s);
      rowsBox.appendChild(row);
    });
    document.getElementById('dbdNote').textContent = r.note;
    drawer.classList.add('on');
    drawer.setAttribute('aria-hidden', 'false');
  }
  function close() { drawer.classList.remove('on'); drawer.setAttribute('aria-hidden', 'true'); }
  document.getElementById('dbClose').addEventListener('click', close);
  addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });

  chips.forEach(function (c) {
    c.addEventListener('click', function () {
      filter = c.dataset.f;
      chips.forEach(function (x) { x.setAttribute('aria-pressed', x === c ? 'true' : 'false'); });
      render();
    });
  });
  sortBtn.addEventListener('click', function () {
    desc = !desc;
    sortMark.textContent = desc ? '↓' : '↑';
    render();
  });
  q.addEventListener('input', function () { term = q.value.trim().toLowerCase(); render(); });
  document.getElementById('dbReset').addEventListener('click', function () {
    filter = 'all'; term = ''; q.value = '';
    chips.forEach(function (x) { x.setAttribute('aria-pressed', x.dataset.f === 'all' ? 'true' : 'false'); });
    render();
  });
  document.getElementById('dbExport').addEventListener('click', function (e) {
    var b = e.currentTarget, old = b.textContent;
    b.textContent = '已导出 2 页';
    setTimeout(function () { b.textContent = old; }, 1400);
  });
  render();
})();
</script>
</body>
</html>
