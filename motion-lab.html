<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>前端模式库：动效与交互</title>
<style>
:root{
  --bg:#f3f1e9;--paper:#fbfaf5;--ink:#20241e;--muted:#6b7860;--faint:#94a184;--line:#deded2;
  --lime:#d9f875;/* 以下四色已退役：仅存量老资产仍在引用，新资产禁用（见 data/rules.md 黑名单） */
  --mint:#83d9bd;--coral:#ff886e;--lav:#c4b6ff;--blue:#7e88ff;
  --ease:cubic-bezier(.2,.75,.25,1);--ease-spring:cubic-bezier(.34,1.56,.64,1);
  --r:10px;--sp:4px;
}
[data-theme=night]{--bg:#121610;--paper:#191d18;--ink:#e8efe0;--muted:#a9b8a0;--faint:#7b8a72;--line:#2c3327}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.7 Inter,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
a{color:inherit}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 22px;background:var(--paper);border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:15px;letter-spacing:-.01em}
header .sub{font-size:11px;color:var(--faint);border-left:1px solid var(--line);padding-left:12px}
header .grow{flex:1}
header input[type=search]{width:200px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:transparent;color:inherit;font:inherit;font-size:12px}
header button{font:inherit;font-size:12px;padding:7px 11px;border:1px solid var(--line);border-radius:6px;background:transparent;color:inherit;cursor:pointer}
header button:hover{border-color:var(--ink)}
#catbar{position:sticky;top:55px;z-index:19;display:flex;gap:6px;flex-wrap:wrap;padding:8px 22px;background:var(--bg);border-bottom:1px solid var(--line)}
#catbar button{font:inherit;font-size:11.5px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
#catbar button[data-on]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
main{max-width:1240px;margin:0 auto;padding:22px 22px 120px}
h2.cat{font-size:13px;letter-spacing:.14em;color:var(--faint);margin:34px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 14px;display:flex;flex-direction:column;gap:10px;position:relative;min-width:0}
.card[data-pick]{border-color:var(--ink);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 22%,transparent)}
.card h3{margin:0;font-size:14px;font-weight:650;display:flex;align-items:center;gap:8px}
.card h3 em{font-style:normal;font-weight:500;font-size:10.5px;color:var(--faint);letter-spacing:.04em}
.card p{margin:0;font-size:11.5px;color:var(--muted);line-height:1.8}
.stage{min-height:120px;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;padding:16px;border-radius:10px;background:color-mix(in srgb,var(--ink) 4%,transparent);overflow:hidden}
.stage>*{min-width:0;max-width:100%}
.acts{display:flex;gap:6px;align-items:center;margin-top:auto}
.acts button{font:inherit;font-size:11px;padding:5px 9px;border:1px solid var(--line);border-radius:6px;background:transparent;color:inherit;cursor:pointer}
.acts button:hover{border-color:var(--ink)}
.pick{margin-left:auto;border:1px solid var(--line)!important}
.pick[aria-pressed=true]{background:var(--lime);color:var(--ink);border-color:color-mix(in srgb,var(--ink) 30%,transparent)}
.hint{font-size:10.5px;color:var(--faint)}
#dock{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:12px 22px;background:var(--paper);border-top:1px solid var(--line);z-index:30}
#dock b{font-size:13px}
#dock code{font-size:11px;color:var(--muted)}
.hidden{display:none!important}
.btn{font:inherit;font-size:12px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:transparent;cursor:pointer;color:inherit}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
@media(max-width:640px){main{padding:16px 12px 120px}.grid{grid-template-columns:1fr}#catbar{top:52px;padding:6px 12px}}

/* ——— 演示按钮的基础形态（各卡片里复用） ——— */
.demo-btn{font:inherit;font-size:12.5px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;transition:transform .16s var(--ease),box-shadow .16s var(--ease),background .16s}
.demo-btn:hover{box-shadow:0 1px 0 var(--line)}
.demo-btn:active{transform:scale(.97)}
.demo-btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
html.embedded header{display:none}
html.embedded #catbar{top:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
html.embedded #catbar::-webkit-scrollbar{display:none}
html.embedded #catbar button{flex:0 0 auto}
.catbar-tools{margin-left:auto;display:flex;gap:6px;align-items:center;flex:0 0 auto;position:sticky;right:0;background:var(--bg);padding-left:8px;border-left:1px solid var(--line)}
.catbar-tools input[type=search]{width:190px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:transparent;color:inherit;font:inherit;font-size:12px}
#catbar .catbar-tools button{font:inherit;font-size:12px;padding:7px 11px;border:1px solid var(--line);border-radius:6px;background:transparent;color:inherit;cursor:pointer}
@media(max-width:640px){.catbar-tools input[type=search]{display:none}.catbar-tools{padding-left:6px}}

/* ---------- wide workspace ---------- */
.lab-shell{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
.lab-center{min-width:0}
.lab-rail,.picked-panel{display:none}
main#lab{max-width:none;margin:0;padding:20px 22px 96px}
.grid{--card-min:320px;grid-template-columns:repeat(auto-fill,minmax(var(--card-min),1fr))}
.grid:empty{min-height:300px}
.card{content-visibility:auto;contain-intrinsic-size:auto 380px;scroll-margin-top:20px}
.card.flash{outline:1px solid var(--ink);outline-offset:3px}
.rail-head{display:flex;align-items:center;justify-content:space-between;font:10px var(--mono);letter-spacing:.12em;color:var(--faint);padding:0 5px 4px}
.rail-total{font:10px var(--mono);color:var(--faint)}
.rail-tools{display:flex;flex-direction:column;gap:5px;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:2px}
.rail-tools input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:inherit;font:11.5px var(--sans);outline:none}
.rail-tools input:focus{border-color:var(--ink)}
.rail-tools button,.rail-top{font:11px var(--sans);padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;text-align:left}
.rail-tools button:hover,.rail-top:hover{border-color:var(--ink);color:var(--ink)}
.rail-cats{display:flex;flex-direction:column;gap:1px;flex:1;min-height:0;overflow:auto;padding-right:2px}
.rail-cats button{display:flex;align-items:center;justify-content:space-between;gap:6px;border:0;background:transparent;color:var(--muted);font:12px var(--sans);padding:5px 7px;border-radius:6px;cursor:pointer;text-align:left}
.rail-cats button:hover{background:var(--bg)}
.rail-cats button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.rail-cats em{font:9.5px var(--mono);font-style:normal;opacity:.55}
.rail-top{margin-top:8px;flex:0 0 auto}
@media(min-width:1200px){
  .lab-shell{grid-template-columns:214px minmax(0,1fr)}
  #catbar{display:none}
  .lab-rail{display:flex;flex-direction:column;gap:8px;position:sticky;top:0;align-self:start;height:100vh;overflow:hidden;padding:14px 12px;background:var(--paper);border-right:1px solid var(--line);z-index:7}
  html:not(.embedded) .lab-rail{top:62px;height:calc(100vh - 62px)}
}
@media(min-width:1600px){
  .lab-shell{grid-template-columns:214px minmax(0,1fr) 286px}
  .picked-panel{display:flex}
  .picked-pill{display:none}
}
@media(max-width:1199px){.lab-rail,.picked-panel{display:none}}

/* picked panel / pill / sheet */
.picked-panel{position:sticky;top:0;height:100vh;flex-direction:column;gap:9px;padding:14px 12px;background:var(--paper);border-left:1px solid var(--line);overflow:hidden}
html:not(.embedded) .picked-panel{top:62px;height:calc(100vh - 62px)}
.pp-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:650}
.pp-head span[data-count]{color:var(--muted);font-weight:500}
.pp-hint{font:8.5px var(--mono);color:var(--faint);font-weight:400}
.pp-list{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:4px}
.pp-item{display:flex;align-items:center;gap:3px;border:1px solid var(--line);border-radius:6px;padding:4px 5px;min-width:0}
.pp-go{flex:1;min-width:0;border:0;background:transparent;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:1px;padding:2px;color:inherit}
.pp-go span{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp-go code{font:9px var(--mono);color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp-x{border:0;background:transparent;color:var(--faint);font-size:13px;cursor:pointer;padding:2px 4px;line-height:1}
.pp-x:hover{color:var(--warn,#a8502f)}
.pp-empty{font-size:11px;color:var(--faint);line-height:1.7;margin:0;padding:8px 0}
.pp-actions{display:flex;flex-wrap:wrap;gap:4px;border-top:1px solid var(--line);padding-top:9px}
.pp-actions button,.pp-close{font:10px var(--sans);padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--muted);cursor:pointer}
.pp-actions button:hover,.pp-close:hover{border-color:var(--ink);color:var(--ink)}
.pp-actions button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.picked-pill{position:fixed;right:16px;bottom:16px;z-index:40;display:flex;align-items:center;gap:6px;padding:7px 12px;border:0;border-radius:999px;background:var(--ink);color:var(--paper);font:12px var(--sans);cursor:pointer;box-shadow:0 12px 24px -8px #20241e26}
.picked-pill b{font:11px var(--mono);color:var(--ink)}
.picked-pill span{font-size:10px;opacity:.7}
.to-top{position:fixed;left:16px;bottom:16px;z-index:40;padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--muted);font-size:11px;cursor:pointer;box-shadow:0 1px 0 var(--line)}
.sheet-wrap{position:fixed;inset:0;z-index:50}
.sheet-wrap[hidden]{display:none}
.sheet-scrim{position:absolute;inset:0;background:#0c0f0a55}
.sheet{position:absolute;right:14px;bottom:14px;width:min(330px,calc(100vw - 28px));max-height:70vh;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 12px 24px -8px #20241e26}

/* preview */
.preview{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:#0c0f0a66}
.preview[hidden]{display:none}
.preview-card{width:min(720px,100%);max-height:90vh;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:10px}
.preview-head{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px}
.preview-head button{font-size:11px;padding:4px 9px;border:1px solid var(--line);border-radius:6px;background:transparent;color:inherit;cursor:pointer}
.preview-stage{min-height:260px;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;padding:24px;background:var(--bg);border-radius:10px;overflow:auto}
.preview-stage>*{min-width:0;max-width:100%}
.preview-note{margin:0;font-size:12px;color:var(--muted);line-height:1.8}
.preview-actions{display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.preview-actions button{font-size:10.5px;padding:5px 9px;border:1px solid var(--line);border-radius:6px;background:transparent;color:inherit;cursor:pointer}

/* density */
html[data-density=compact] .grid{--card-min:270px;gap:12px}
html[data-density=compact] .card{padding:13px;gap:8px}
html[data-density=compact] .stage{min-height:96px;padding:10px}
html[data-density=compact] .card p{font-size:11px;line-height:1.7}
@media(min-width:1600px){.picked-pill{display:none}}
@media(min-width:1200px){.to-top{display:none}}
</style>
<script>if (window.self !== window.top) document.documentElement.classList.add('embedded');</script>
</head>
<body>

<header>
  <h1>前端模式库：动效与交互</h1>
  <span class="sub">挑你想要的，点「选中」；底部复制清单给我</span>
  <span class="grow"></span>
  <input id="q" type="search" placeholder="搜效果（滚动 / 光标 / 加载…）">
  <button id="allbtn" title="全选当前筛选">全选可见</button>
  <button id="themebtn">夜间</button>
</header>
<div class="lab-shell">
  <aside class="lab-rail" id="labRail" aria-label="分类与工具">
    <div class="rail-head"><span>分类</span><span class="rail-total" id="railTotal"></span></div>
    <div class="rail-tools" id="railTools"></div>
    <div class="rail-cats" id="railCats"></div>
    <button class="rail-top" id="railTop" type="button">↑ 回到顶部</button>
  </aside>
  <div class="lab-center">
    <div id="catbar"></div>
    <main id="lab"></main>
  </div>
  <aside class="picked-panel" id="pickedPanel" aria-label="已选效果">
    <div class="pp-head"><span>已选 <span data-count>0</span></span><span class="pp-hint">点标题定位</span></div>
    <div class="pp-list" id="ppList"></div>
    <div class="pp-actions">
      <button type="button" data-only aria-pressed="false">只看已选</button>
      <button type="button" data-copy>复制清单</button>
      <button type="button" data-clear>清空</button>
    </div>
  </aside>
</div>

<button class="picked-pill" id="pickedPill" type="button">已选 <b data-count>0</b><span>展开</span></button>
<button class="to-top" id="toTop" type="button" hidden>↑ 顶部</button>

<div class="sheet-wrap" id="sheet" hidden>
  <div class="sheet-scrim" data-sheetclose></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="已选效果">
    <div class="pp-head"><span>已选 <span data-count>0</span></span><button class="pp-close" type="button" data-sheetclose>关闭</button></div>
    <div class="pp-list" id="sheetList"></div>
    <div class="pp-actions">
      <button type="button" data-only aria-pressed="false">只看已选</button>
      <button type="button" data-copy>复制清单</button>
      <button type="button" data-clear>清空</button>
    </div>
  </div>
</div>

<div class="preview" id="preview" hidden>
  <div class="preview-card" role="dialog" aria-modal="true" aria-labelledby="pvTitle">
    <div class="preview-head"><b id="pvTitle">预览</b><button type="button" data-pvclose>关闭</button></div>
    <div class="preview-stage" id="pvStage"></div>
    <p class="preview-note" id="pvNote"></p>
    <div class="preview-actions">
      <button type="button" data-pvcss>复制 CSS</button>
      <button type="button" data-pvcard>复制整卡</button>
      <button type="button" data-pvlink>复制链接</button>
    </div>
  </div>
</div>

<script src="lab-more.js?v=3"></script>
<script src="lab-extra2.js?v=1"></script>
<script src="lab-extra3.js?v=1"></script>
<script src="lab-extra4.js?v=1"></script>
<script src="lab-recipe.js?v=1"></script>
<script>
/* 每条 = 一个可交互效果。body 里只允许用 class="d-…"，避免互相污染。 */
const DEMOS = [
{id:'fade-stagger',cat:"入场",t:"错峰淡入",en:"staggered fade-up",d:"列表/卡片依次出现，每项延迟 40ms；最基础也最耐看的入场。",body:`
  <div class="d-stack"><i class="d-chip"></i><i class="d-chip"></i><i class="d-chip"></i><i class="d-chip"></i></div>
  <button class="d-btn" data-replay>重播</button>`,css:`.d-stack{display:flex;flex-direction:column;gap:8px}
.d-chip{width:120px;height:12px;border-radius:6px;background:color-mix(in srgb,var(--ink) 18%,transparent);opacity:0;animation:d-fade-stagger-in .45s var(--ease) forwards}
.d-chip:nth-child(1){animation-delay:0ms}.d-chip:nth-child(2){animation-delay:40ms}.d-chip:nth-child(3){animation-delay:80ms}.d-chip:nth-child(4){animation-delay:120ms}
@keyframes d-fade-stagger-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.d-btn{font:inherit;font-size:13px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;transition:transform 180ms var(--var(--ease)),background-color 180ms,color 180ms,border-color 180ms}
.d-btn:hover{box-shadow:0 6px 18px #20241e14}
.d-btn:active{transform:scale(.97)}
`},
{id:'pop-spring',cat:"入场",t:"弹簧弹出",en:"spring pop",d:"弹出确认、新建成功这类「有物理感」的时刻；别用在长列表上。",body:`<button class="d-btn d-btn-primary" data-pop>点我弹一个</button><span class="d-badge" data-badge hidden>已保存</span>`,css:`.d-badge{padding:4px 10px;border-radius:999px;background:var(--lime);color:#1e2a12;font-size:11px}
.d-badge.on{animation:d-pop-spring-kf .42s var(--ease-spring)}
@keyframes d-pop-spring-kf{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.d-btn{font:inherit;font-size:13px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;transition:transform 180ms var(--var(--ease-spring)),background-color 180ms,color 180ms,border-color 180ms}
.d-btn:hover{box-shadow:0 6px 18px #20241e14}
.d-btn:active{transform:scale(.97)}
.d-btn.d-btn-primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
`},
{id:'blur-in',cat:"入场",t:"模糊聚焦",en:"blur-in",d:"内容从模糊到清晰，适合弹窗、图片、AI 生成结果。",body:`<div class="d-blur-in-kf">聚焦的那一刻</div><button class="d-btn" data-replay>重播</button>`,css:`.d-blur-in-kf{font-size:15px;padding:14px 18px;border-radius:10px;background:var(--paper);border:1px solid var(--line);animation:d-blur-in-kf .5s var(--ease) forwards}
@keyframes d-blur-in-kf{from{filter:blur(10px);opacity:0}to{filter:blur(0);opacity:1}}
.d-btn{font:inherit;font-size:13px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;transition:transform 180ms var(--var(--ease)),background-color 180ms,color 180ms,border-color 180ms}
.d-btn:hover{box-shadow:0 6px 18px #20241e14}
.d-btn:active{transform:scale(.97)}
`},
{id:'mask-reveal',cat:"入场",t:"遮罩揭示",en:"clip reveal",d:"用 clip-path 从上往下「掀开」，适合标题与大幅图片。",body:`<div class="d-mask-reveal-kf">把想法，变成能用的界面。</div>`,css:`.d-mask-reveal-kf{font-size:21px;font-weight:700;letter-spacing:-.03em;animation:d-mask-reveal-kf .7s var(--ease) forwards;clip-path:inset(0 100% 0 0)}
@keyframes d-mask-reveal-kf{to{clip-path:inset(0 0 0 0)}}`},
{id:'skeleton',cat:"加载",t:"骨架到内容",en:"skeleton → content",d:"先给形状再给内容，比转圈更稳；加载超过 300ms 才出现。",body:`<div class="d-sk"><i></i><i></i><i></i></div><button class="d-btn" data-swap>载入完成</button>`,css:`.d-sk{width:180px;display:flex;flex-direction:column;gap:8px}
.d-sk i{height:12px;border-radius:6px;background:linear-gradient(90deg,color-mix(in srgb,var(--ink) 8%,transparent),color-mix(in srgb,var(--ink) 16%,transparent),color-mix(in srgb,var(--ink) 8%,transparent));background-size:200% 100%;animation:d-skeleton-shim 1.2s linear infinite}
.d-sk i:nth-child(2){width:80%}.d-sk i:nth-child(3){width:60%}
@keyframes d-skeleton-shim{to{background-position:-200% 0}}
.d-btn{font:inherit;font-size:13px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;transition:transform 180ms var(--linear),background-color 180ms,color 180ms,border-color 180ms}
.d-btn:hover{box-shadow:0 6px 18px #20241e14}
.d-btn:active{transform:scale(.97)}
`},

{id:'focus-ring',cat:"无障碍",t:"焦点环",en:"focus-visible",d:"键盘 Tab 才有环、鼠标点没有；环要 2px 且与背景有对比。",body:`<button class="d-btn d-focus">按 Tab 到我</button><button class="d-btn">再按一次 Tab</button>`,css:`.d-focus:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.d-btn{font:inherit;font-size:13px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;transition:transform 180ms var(--var(--ease)),background-color 180ms,color 180ms,border-color 180ms}
.d-btn:hover{box-shadow:0 6px 18px #20241e14}
.d-btn:active{transform:scale(.97)}
`},
{id:'contrast-badge',cat:"无障碍",t:"对比度自检",en:"contrast check",d:"正文 ≥ 7:1、次要 ≥ 4.5:1；这张卡片本身就是示例。",body:`<div class="d-cc"><b>正文 7:1</b><span>次要文字 4.5:1</span></div>`,css:`.d-cc{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;background:var(--paper);border:1px solid var(--line)}
.d-cc b{font-size:13px}.d-cc span{font-size:11px;color:var(--muted)}`}
];
DEMOS.push(...(window.DEMOS_EXTRA || []));

/* ——— 状态、分类与选中 ——— */
const lab = document.getElementById('lab');
const cats = [...new Set(DEMOS.map(d => d.cat))];
const picked = new Set(JSON.parse(localStorage.getItem('lab.picks') || '[]'));
for (const id of [...picked]) if (!DEMOS.some(d => d.id === id)) picked.delete(id);
localStorage.setItem('lab.picks', JSON.stringify([...picked]));
let filter = localStorage.getItem('lab.filter') || 'all';
if (filter !== 'all' && !cats.includes(filter)) filter = 'all';
let q = localStorage.getItem('lab.q') || '';
let onlyPicked = false;
let renderTimer = null;
let previewId = null;

const catbar = document.getElementById('catbar');
const railCats = document.getElementById('railCats');
const railTools = document.getElementById('railTools');
const railTotal = document.getElementById('railTotal');
const qInput = document.getElementById('q');
const allBtn = document.getElementById('allbtn');
const densityBtn = document.createElement('button');
densityBtn.type = 'button';
densityBtn.id = 'densityBtn';
railTools.append(densityBtn);
railTotal.textContent = DEMOS.length + ' 个';

const countOf = (c) => c === 'all' ? DEMOS.length : DEMOS.filter(d => d.cat === c).length;
function buildNav() {
  catbar.innerHTML = ['全部', ...cats].map(c => {
    const on = (c === '全部' && filter === 'all') || c === filter;
    return `<button data-cat="${c}" ${on ? 'data-on' : ''}>${c} <span style="opacity:.55">${countOf(c === '全部' ? 'all' : c)}</span></button>`;
  }).join('');
  railCats.innerHTML = ['全部', ...cats].map(c => {
    const on = (c === '全部' && filter === 'all') || c === filter;
    return `<button type="button" data-rail-cat="${c}" aria-pressed="${on}"><span>${c}</span><em>${countOf(c === '全部' ? 'all' : c)}</em></button>`;
  }).join('');
}
buildNav();
qInput.value = q;

function ensureCatTools() {
  let t = catbar.querySelector('.catbar-tools');
  if (!t) { t = document.createElement('span'); t.className = 'catbar-tools'; catbar.append(t); }
  return t;
}
function applyLayout() {
  if (innerWidth >= 1200) railTools.append(qInput, allBtn, densityBtn);
  else ensureCatTools().append(qInput, allBtn, densityBtn);
}

/* CSS 作用域：卡内 #c-，预览 #pv- */
function scoped(prefix, id, css) {
  const out = []; let buf = '', depth = 0;
  for (let i = 0; i < css.length; i++) {
    const c = css[i]; buf += c;
    if (c === '{') depth++;
    if (c === '}') {
      depth--;
      if (depth === 0) {
        const open = buf.indexOf('{');
        const sel = buf.slice(0, open).trim();
        const body = buf.slice(open);
        if (sel.startsWith('@')) out.push(buf);
        else out.push(sel.split(',').map(x => '#' + prefix + id + ' ' + x.trim()).join(',') + body);
        buf = '';
      }
    }
  }
  return out.join(String.fromCharCode(10));
}
function scopedCss(id, css) { return scoped('c-', id, css); }
function cardSnippet(d) {
  return '<div id="c-' + d.id + '">\n' + d.body + '\n</div>\n<style>\n' + scopedCss(d.id, d.css) + '\n</style>';
}
function linkFor(id) {
  const theme = document.documentElement.getAttribute('data-theme') === 'night' ? 'night' : 'paper';
  if (window.self !== window.top) {
    const u = new URL(location.origin + '/');
    u.searchParams.set('tab', 'motion');
    u.searchParams.set('demo', id);
    u.searchParams.set('theme', theme);
    return u.href;
  }
  const u = new URL(location.origin + location.pathname);
  u.searchParams.set('demo', id);
  u.searchParams.set('theme', theme);
  return u.href;
}
function copy(text) {
  try { navigator.clipboard.writeText(text); } catch {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
  }
}
function flashLabel(btn, text) {
  const old = btn.textContent; btn.textContent = text;
  setTimeout(() => { btn.textContent = old; }, 1200);
}
function visibleList() {
  return DEMOS.filter(d => (filter === 'all' || d.cat === filter)
    && (!q || (d.t + d.en + d.d + d.id).toLowerCase().includes(q)));
}

function cardHTML(d) {
  return `<article class="card" id="c-${d.id}" data-id="${d.id}" ${picked.has(d.id) ? 'data-pick' : ''}>
    <h3>${d.t} <em>${d.en}</em></h3>
    <div class="stage" data-demo="${d.id}">${d.body}</div>
    <style>${scopedCss(d.id, d.css)}</style>
    <p>${d.d}</p>
    <div class="acts">
      <button data-copy-css="${d.id}">复制 CSS</button>
      <button data-copy-card="${d.id}">整卡</button>
      <button data-preview="${d.id}">预览</button>
      <button class="pick" data-pick="${d.id}" aria-pressed="${picked.has(d.id)}">${picked.has(d.id) ? '已选' : '选中'}</button>
    </div>
  </article>`;
}
function bindCards(scope) {
  scope.querySelectorAll('[data-demo]').forEach(el => { const id = el.dataset.demo; if (INITS[id]) INITS[id](el); });
  scope.querySelectorAll('[data-copy-css]').forEach(b => b.onclick = () => {
    const d = DEMOS.find(x => x.id === b.dataset.copyCss);
    copy(d.css); flashLabel(b, '已复制');
  });
  scope.querySelectorAll('[data-copy-card]').forEach(b => b.onclick = () => {
    const d = DEMOS.find(x => x.id === b.dataset.copyCard);
    copy(cardSnippet(d)); flashLabel(b, '已复制');
  });
  scope.querySelectorAll('[data-preview]').forEach(b => b.onclick = () => openPreview(b.dataset.preview));
  scope.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => toggle(b.dataset.pick));
}

let blockIO = null;
let fillCat = () => {};
let currentShown = [];
function render() {
  currentShown = onlyPicked ? DEMOS.filter(d => picked.has(d.id)) : visibleList();
  if (blockIO) { blockIO.disconnect(); blockIO = null; }
  if (!currentShown.length) {
    lab.innerHTML = `<p style="color:var(--faint);padding:30px 4px">${onlyPicked ? '还没有选中的效果。点卡片右下「选中」。' : '没有匹配的效果'}</p>`;
    syncPicked();
    return;
  }
  lab.innerHTML = cats.map(c => {
    const n = currentShown.filter(d => d.cat === c).length;
    if (!n) return '';
    return `<section class="cat-block" data-cat="${c}"><h2 class="cat" id="cat-${c}">${c} <span style="opacity:.45;font-size:10px">${n}</span></h2><div class="grid" data-grid="${c}"></div></section>`;
  }).join('');

  fillCat = (cat) => {
    const block = lab.querySelector(`.cat-block[data-cat="${CSS.escape(cat)}"]`);
    const grid = lab.querySelector(`.grid[data-grid="${CSS.escape(cat)}"]`);
    if (!block || !grid || block.dataset.filled === '1') return;
    block.dataset.filled = '1';
    const list = currentShown.filter(d => d.cat === cat);
    grid.innerHTML = list.map(cardHTML).join('');
    bindCards(grid);
    syncPicked();
  };

  if (currentShown.length <= 48) {
    [...lab.querySelectorAll('.cat-block')].forEach(b => fillCat(b.dataset.cat));
  } else {
    blockIO = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (!e.isIntersecting) return;
        fillCat(e.target.dataset.cat);
        blockIO.unobserve(e.target);
      });
    }, { rootMargin: '300px 0px' });
    lab.querySelectorAll('.cat-block').forEach(b => blockIO.observe(b));
  }
  syncPicked();
}

function setFilter(cat) {
  filter = cat === '全部' ? 'all' : cat;
  localStorage.setItem('lab.filter', filter);
  onlyPicked = false;
  buildNav();
  applyLayout();
  render();
  window.scrollTo(0, 0);
}
railCats.addEventListener('click', e => { const b = e.target.closest('[data-rail-cat]'); if (b) setFilter(b.dataset.railCat); });
catbar.addEventListener('click', e => { const b = e.target.closest('[data-cat]'); if (b) setFilter(b.dataset.cat); });
qInput.addEventListener('input', e => {
  q = e.target.value.trim().toLowerCase();
  localStorage.setItem('lab.q', q);
  clearTimeout(renderTimer);
  renderTimer = setTimeout(() => { render(); window.scrollTo(0, 0); }, 120);
});

/* ——— 选中、已选面板、复制 ——— */
function syncPicked() {
  const n = picked.size;
  document.querySelectorAll('[data-count]').forEach(el => el.textContent = n);
  document.querySelectorAll('[data-only]').forEach(b => b.setAttribute('aria-pressed', String(onlyPicked)));
  const items = DEMOS.filter(d => picked.has(d.id));
  const html = items.length ? items.map(d => `<div class="pp-item">
    <button class="pp-go" type="button" data-go="${d.id}" title="定位到卡片"><span>${d.t}</span><code>${d.id}</code></button>
    <button class="pp-x" type="button" data-remove="${d.id}" aria-label="从已选移除">×</button>
  </div>`).join('') : '<p class="pp-empty">还没选。点卡片右下「选中」。</p>';
  ['ppList', 'sheetList'].forEach(id => {
    const box = document.getElementById(id);
    if (!box) return;
    box.innerHTML = html;
    box.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { closeSheet(); jumpTo(b.dataset.go); });
    box.querySelectorAll('[data-remove]').forEach(b => b.onclick = () => toggle(b.dataset.remove));
  });
}
function toggle(id) {
  picked.has(id) ? picked.delete(id) : picked.add(id);
  localStorage.setItem('lab.picks', JSON.stringify([...picked]));
  const card = document.getElementById('c-' + id);
  if (card) {
    card.toggleAttribute('data-pick', picked.has(id));
    const btn = card.querySelector('[data-pick]');
    if (btn) { btn.setAttribute('aria-pressed', String(picked.has(id))); btn.textContent = picked.has(id) ? '已选' : '选中'; }
  }
  if (onlyPicked) render(); else syncPicked();
}
document.querySelectorAll('[data-only]').forEach(b => b.onclick = () => {
  onlyPicked = !onlyPicked; render(); window.scrollTo(0, 0);
});
document.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => {
  const ids = [...picked];
  copy(ids.length ? ids.join(', ') : '(还没选)');
  flashLabel(b, '已复制');
});
document.querySelectorAll('[data-clear]').forEach(b => b.onclick = () => {
  picked.clear(); localStorage.setItem('lab.picks', '[]'); render();
});

/* 已选 sheet */
const sheet = document.getElementById('sheet');
function openSheet() { sheet.hidden = false; document.querySelector('#sheet [data-sheetclose]')?.focus(); }
function closeSheet() { if (sheet) sheet.hidden = true; }
document.getElementById('pickedPill').onclick = openSheet;
document.querySelectorAll('[data-sheetclose]').forEach(b => b.onclick = closeSheet);

/* 预览 */
const preview = document.getElementById('preview');
const pvTitle = document.getElementById('pvTitle');
const pvNote = document.getElementById('pvNote');
const pvStage = document.getElementById('pvStage');
let pvReturn = null;
function openPreview(id) {
  const d = DEMOS.find(x => x.id === id);
  if (!d) return;
  previewId = id; pvReturn = document.activeElement;
  pvTitle.textContent = d.t + ' · ' + d.en;
  pvNote.textContent = d.d;
  pvStage.id = 'pv-' + id;
  pvStage.innerHTML = d.body + '<style>' + scoped('pv-', id, d.css) + '</style>';
  preview.hidden = false;
  document.body.style.overflow = 'hidden';
  if (INITS[id]) INITS[id](pvStage);
  preview.querySelector('[data-pvclose]').focus();
}
function closePreview() {
  if (preview.hidden) return;
  preview.hidden = true;
  document.body.style.overflow = '';
  pvStage.innerHTML = '';
  previewId = null;
  pvReturn?.focus?.();
}
preview.querySelector('[data-pvclose]').onclick = closePreview;
preview.addEventListener('click', e => { if (e.target === preview) closePreview(); });
preview.querySelector('[data-pvcss]').onclick = () => {
  const d = DEMOS.find(x => x.id === previewId); if (d) copy(d.css);
};
preview.querySelector('[data-pvcard]').onclick = () => {
  const d = DEMOS.find(x => x.id === previewId); if (d) copy(cardSnippet(d));
};
preview.querySelector('[data-pvlink]').onclick = () => {
  if (!previewId) return;
  copy(linkFor(previewId));
  flashLabel(preview.querySelector('[data-pvlink]'), '链接已复制');
};

function jumpTo(id) {
  const d = DEMOS.find(x => x.id === id);
  if (!d) return;
  if (!document.getElementById('c-' + id)) {
    filter = 'all';
    q = '';
    qInput.value = '';
    onlyPicked = false;
    localStorage.setItem('lab.filter', 'all');
    localStorage.setItem('lab.q', '');
    buildNav();
    applyLayout();
    render();
  }
  fillCat(d.cat);
  requestAnimationFrame(() => {
    const card = document.getElementById('c-' + id);
    if (!card) return;
    card.scrollIntoView({ block: 'center', behavior: 'auto' });
    card.classList.add('flash');
    setTimeout(() => card.classList.remove('flash'), 1800);
  });
}

/* 密度 */
function paintDensity() {
  const compact = document.documentElement.getAttribute('data-density') === 'compact';
  densityBtn.textContent = compact ? '密度：紧凑' : '密度：舒适';
  densityBtn.setAttribute('aria-pressed', String(compact));
}
densityBtn.onclick = () => {
  const compact = document.documentElement.getAttribute('data-density') !== 'compact';
  document.documentElement.setAttribute('data-density', compact ? 'compact' : 'cozy');
  localStorage.setItem('lab.density', compact ? 'compact' : 'cozy');
  paintDensity();
};
if (localStorage.getItem('lab.density') === 'compact') document.documentElement.setAttribute('data-density', 'compact');
paintDensity();

/* 键盘与滚动 */
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;
  if (e.key === '/' && !typing) { e.preventDefault(); qInput.focus(); qInput.select(); }
  if (e.key === 'Escape') {
    if (!preview.hidden) return closePreview();
    if (!sheet.hidden) return closeSheet();
    if (q) { q = ''; qInput.value = ''; localStorage.setItem('lab.q', ''); render(); }
  }
});
const toTop = document.getElementById('toTop');
let ticking = false;
function onScroll() {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    ticking = false;
    localStorage.setItem('lab.scroll', String(Math.round(scrollY)));
    toTop.hidden = scrollY < 600;
  });
}
window.addEventListener('scroll', onScroll, { passive: true });
toTop.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
document.getElementById('railTop').onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });

window.addEventListener('resize', applyLayout);
applyLayout();

allBtn.addEventListener('click', () => {
  visibleList().forEach(d => picked.add(d.id));
  localStorage.setItem('lab.picks', JSON.stringify([...picked]));
  document.querySelectorAll('#lab [data-pick]').forEach(b => { b.setAttribute('aria-pressed', 'true'); b.textContent = '已选'; });
  document.querySelectorAll('#lab .card').forEach(c => c.setAttribute('data-pick', ''));
  syncPicked();
});

/* ——— 每个效果的行为（没有则为纯 CSS） ——— */
const INITS = {
  "fade-stagger": root => root.querySelector('[data-replay]')?.addEventListener('click', () => {
    root.querySelectorAll('.d-chip').forEach(c => { c.style.animation = 'none'; void c.offsetWidth; c.style.animation = ''; });
  }),
  "pop-spring": root => root.querySelector('[data-pop]')?.addEventListener('click', () => {
    const b = root.querySelector('[data-badge]'); b.hidden = false; b.classList.remove('on'); void b.offsetWidth; b.classList.add('on');
    setTimeout(() => { b.hidden = true; }, 1600);
  }),
  "blur-in": root => root.querySelector('[data-replay]')?.addEventListener('click', () => {
    const el = root.querySelector('.d-blur-in-kf'); el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
  }),
  "skeleton": root => root.querySelector('[data-swap]')?.addEventListener('click', () => {
    const box = root.querySelector('.d-sk');
    box.innerHTML = '<i style="background:var(--lime);animation:none;height:14px"></i><i style="background:color-mix(in srgb,var(--ink) 20%,transparent);animation:none"></i><i style="background:color-mix(in srgb,var(--ink) 12%,transparent);animation:none"></i>';
  }),
  "ripple": root => root.querySelector('.d-rip')?.addEventListener('click', e => {
    const b = e.currentTarget, r = b.getBoundingClientRect();
    const w = document.createElement('span'); w.className = 'd-ripple-wave';
    const size = Math.max(r.width, r.height); w.style.width = w.style.height = size + 'px';
    w.style.left = (e.clientX - r.left - size / 2) + 'px'; w.style.top = (e.clientY - r.top - size / 2) + 'px';
    b.appendChild(w); setTimeout(() => w.remove(), 620);
  }),
  "toggle-spring": root => root.querySelector('.d-sw')?.addEventListener('click', e => {
    const b = e.currentTarget; b.setAttribute('aria-checked', b.getAttribute('aria-checked') === 'true' ? 'false' : 'true');
  }),
  "copy-check": root => root.querySelector('.d-copy')?.addEventListener('click', async e => {
    const b = e.currentTarget; await copy('示例文本');
    b.classList.add('done'); b.querySelector('.d-ico').textContent = '✓'; b.querySelector('.d-lbl').textContent = '已复制';
    setTimeout(() => { b.classList.remove('done'); b.querySelector('.d-ico').textContent = '⧉'; b.querySelector('.d-lbl').textContent = '复制'; }, 1600);
  }),
  "magnetic": root => {
    const b = root.querySelector('.d-mag');
    root.addEventListener('pointermove', e => {
      const r = b.getBoundingClientRect();
      const dx = Math.max(-14, Math.min(14, (e.clientX - (r.left + r.width / 2)) * .18));
      const dy = Math.max(-14, Math.min(14, (e.clientY - (r.top + r.height / 2)) * .18));
      b.style.transform = `translate(${dx}px,${dy}px)`;
    });
    root.addEventListener('pointerleave', () => b.style.transform = '');
  },
  "tooltip-follow": root => {
    const tip = root.querySelector('.d-tip'), zone = root.querySelector('.d-tipzone');
    zone.addEventListener('pointermove', e => {
      const r = zone.getBoundingClientRect(); tip.hidden = false;
      tip.style.left = (e.clientX - r.left) + 'px'; tip.style.top = (e.clientY - r.top) + 'px';
    });
    zone.addEventListener('pointerleave', () => tip.hidden = true);
  },
  "reveal-scroll": root => {
    const io = new IntersectionObserver(es => es.forEach(x => x.isIntersecting && x.target.classList.add('on')), { root: root.querySelector('.d-scrollbox') });
    root.querySelectorAll('.d-rev').forEach(el => io.observe(el));
  },
  "parallax": root => {
    const z = root.querySelector('.d-par');
    z.addEventListener('pointermove', e => {
      const r = z.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5;
      z.querySelector('.d-parallax-l1').style.transform = `translateX(${x * 6}px)`;
      z.querySelector('.d-parallax-l2').style.transform = `translateX(${x * 14}px)`;
      z.querySelector('.d-parallax-l3').style.transform = `translateX(${x * 24}px)`;
    });
  },
  "view-transition": root => root.querySelector('[data-vt]')?.addEventListener('click', () => {
    const pane = root.querySelector('.d-view-transition-pane');
    const go = () => { const detail = pane.textContent === '列表'; pane.textContent = detail ? '详情' : '列表'; pane.style.background = detail ? 'var(--lime)' : 'var(--paper)'; };
    document.startViewTransition ? document.startViewTransition(go) : go();
  }),
  "flip-list": root => root.querySelector('[data-shuffle]')?.addEventListener('click', () => {
    const box = root.querySelector('.d-flip'), items = [...box.children];
    const first = new Map(items.map(i => [i, i.getBoundingClientRect()]));
    items.sort(() => Math.random() - .5).forEach(i => box.appendChild(i));
    items.forEach(i => {
      const a = first.get(i), b = i.getBoundingClientRect();
      i.animate([{ transform: `translate(${a.left - b.left}px,${a.top - b.top}px)` }, { transform: 'none' }], { duration: 350, easing: 'cubic-bezier(.2,.75,.25,1)' });
    });
  }),
  "custom-cursor": root => {
    const z = root.querySelector('.d-cur'), dot = document.createElement('span'); dot.className = 'dot'; dot.style.opacity = 0; z.appendChild(dot);
    z.addEventListener('pointermove', e => { const r = z.getBoundingClientRect(); dot.style.opacity = 1; dot.style.left = (e.clientX - r.left) + 'px'; dot.style.top = (e.clientY - r.top) + 'px'; });
    z.addEventListener('pointerleave', () => dot.style.opacity = 0);
    z.addEventListener('pointerdown', () => { dot.style.width = dot.style.height = '22px'; });
    z.addEventListener('pointerup', () => { dot.style.width = dot.style.height = '12px'; });
  },
  "tilt": root => {
    const c = root.querySelector('.d-tilt');
    c.addEventListener('pointermove', e => {
      const r = c.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
      c.style.transform = `perspective(600px) rotateX(${(-y * 6).toFixed(2)}deg) rotateY(${(x * 6).toFixed(2)}deg)`;
    });
    c.addEventListener('pointerleave', () => c.style.transform = '');
  },
  "drag-scroll": root => {
    const el = root.querySelector('.d-drag'); let down = false, x0 = 0, l0 = 0;
    el.addEventListener('pointerdown', e => { down = true; x0 = e.clientX; l0 = el.scrollLeft; el.style.cursor = 'grabbing'; });
    el.addEventListener('pointermove', e => { if (down) el.scrollLeft = l0 - (e.clientX - x0); });
    el.addEventListener('pointerup', () => { down = false; el.style.cursor = 'grab'; });
    el.addEventListener('pointerleave', () => { down = false; el.style.cursor = 'grab'; });
  },
  "optimistic": root => root.querySelector('[data-opt]')?.addEventListener('click', () => {
    const box = root.querySelector('.d-opt'); const m = document.createElement('div'); m.className = 'd-optimistic-m d-optimistic-mine';
    m.innerHTML = '临时消息 <em>发送中…</em>'; box.appendChild(m);
    setTimeout(() => { const em = m.querySelector('em'); em.textContent = '已送达'; }, 1200);
  }),
  "accordion": root => root.querySelector('[data-acc]')?.addEventListener('click', e => {
    const box = e.currentTarget.parentElement; box.toggleAttribute('data-open');
    e.currentTarget.textContent = box.hasAttribute('data-open') ? '收起' : '展开详情';
  }),
  "splitter": root => {
    const g = root.querySelector('.d-split .d-splitter-g'), l = root.querySelector('.d-split .d-splitter-l'), box = root.querySelector('.d-split');
    let down = false;
    g.addEventListener('pointerdown', () => down = true);
    window.addEventListener('pointerup', () => down = false);
    window.addEventListener('pointermove', e => {
      if (!down) return; const r = box.getBoundingClientRect();
      const pct = Math.max(18, Math.min(82, ((e.clientX - r.left) / r.width) * 100));
      l.style.width = pct + '%';
    });
    g.addEventListener('dblclick', () => l.style.width = '38%');
  },
  "count-up": root => {
    const el = root.querySelector('.d-num');
    const run = () => { const t0 = performance.now(), to = 18888;
      const step = now => { const p = Math.min(1, (now - t0) / 800); el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))).toLocaleString(); if (p < 1) requestAnimationFrame(step); };
      requestAnimationFrame(step); };
    run(); root.querySelector('[data-count]')?.addEventListener('click', run);
  },
  "toast-stack": root => root.querySelector('[data-toast]')?.addEventListener('click', () => {
    const box = root.querySelector('.d-toasts'); const t = document.createElement('div'); t.className = 'd-toast';
    t.textContent = '已保存 · ' + new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    box.appendChild(t); setTimeout(() => t.remove(), 2600);
  }),
  "badge-pop": root => root.querySelector('[data-badge2]')?.addEventListener('click', () => {
    const b = root.querySelector('.d-badge2 b'); b.textContent = String(Number(b.textContent || 0) + 1);
    b.classList.remove('on'); void b.offsetWidth; b.classList.add('on');
  }),
  "split-text": root => {
    const el = root.querySelector('.d-splittext');
    if (!el.dataset.done) { el.dataset.done = '1'; el.innerHTML = [...el.textContent].map((c, i) => `<span style="animation-delay:${i * 28}ms">${c === ' ' ? '&nbsp;' : c}</span>`).join(''); }
  },
  "reduced-motion": root => {
    const note = root.querySelector('[data-rmnote]');
    const mq = matchMedia('(prefers-reduced-motion: reduce)');
    const set = () => note.textContent = mq.matches ? '系统：已开启「减少动态效果」→ 动画关闭' : '系统：未开启 → 动画运行';
    set(); mq.addEventListener?.('change', set);
  },
};

/* ——— 主题 ——— */
const themeBtn = document.getElementById('themebtn');
themeBtn.addEventListener('click', (e) => {
  const night = document.documentElement.getAttribute('data-theme') !== 'night';
  document.documentElement.setAttribute('data-theme', night ? 'night' : 'paper');
  e.target.textContent = night ? '纸色' : '夜间';
  localStorage.setItem('lab.theme', night ? 'night' : 'paper');
});
const startTheme = new URLSearchParams(location.search).get('theme') || localStorage.getItem('lab.theme');
if (startTheme === 'night') document.documentElement.setAttribute('data-theme', 'night');
window.addEventListener('message', (e) => {
  if (!e.data || e.data.type !== 'site-theme') return;
  const night = e.data.value === 'night';
  document.documentElement.setAttribute('data-theme', night ? 'night' : 'paper');
  themeBtn.textContent = night ? '纸色' : '夜间';
});

Object.assign(INITS, window.INITS_EXTRA || {});

/* ——— 启动：深链、滚动恢复 ——— */
const demoParam = new URLSearchParams(location.search).get('demo');
if (demoParam && DEMOS.some(d => d.id === demoParam)) {
  filter = 'all';
  q = '';
  qInput.value = '';
  onlyPicked = false;
  localStorage.setItem('lab.filter', 'all');
  localStorage.setItem('lab.q', '');
  buildNav();
  applyLayout();
}
render();
if (demoParam && DEMOS.some(d => d.id === demoParam)) {
  requestAnimationFrame(() => requestAnimationFrame(() => jumpTo(demoParam)));
} else {
  const saved = Number(localStorage.getItem('lab.scroll') || 0);
  if (saved > 0) requestAnimationFrame(() => window.scrollTo(0, saved));
}
onScroll();

</script>
</body>
</html>
